    emitsEvent: none
    governedBy: ["SM-CNS-001 R0.2, §4.1 (4), INV-9, INV-12", "DEC-BR-017 §8", "DEC-BR-014 §6"]
    testIds: [TEST-CNS-106, TEST-CNS-311]
  - id: ERR-CM-11
