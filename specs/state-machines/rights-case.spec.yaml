    testIds: [TEST-CNS-290, TEST-CNS-304]

  - id: ERR-RC-07
    code: SUBJECT_CHAIN_AMBIGUOUS
    response: "Sin caso ni RV0; hacia el colegio la respuesta es la misma 'en trámite' (no revela cuántos apoderados hay); alerta interna a Privacy Legal"
    emitsEvent: none
