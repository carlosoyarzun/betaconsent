# Máquina Revocation del subconjunto IT0 (H01 / CA-116), clase de ruta RIGHTS. rev. 4 (SM-CNS-001 v7 + R14).
# rev. 4g (2026-09-27, SEC-CNS-014, aprobado por Carlos): cierra OPEN-RV-12 en los 15 huecos que la nota de rev. 4d daba por "corregidos puntualmente" sin estarlo — RC3 (GRD-RV-19/23/25), RH2 (GRD-RV-23), RH2v (GRD-RV-23), RH3 (GRD-RV-23, GRD-RV-28), R12 (GRD-RV-19/23/25/28, GRD-RC-08, GRD-RC-14): errors += ERR-RV-13, ERR-RV-15, ERR-RV-04, ERR-RC-09 según corresponda a cada guard (onFail exacto de esta spec/rights-case.spec.yaml). OPEN-RV-12 se corrige para reflejar el estado real. Sin cambio de guards existentes, actores, estados ni semántica de consentimiento/revocación/elegibilidad.
# rev. 4f (2026-09-27, SEC-CNS-014, aprobado por Carlos): cierra el grupo GRD-CM-02 (Guard T, cross-tenant) de OPEN-RV-12 en R1/R2/R3/R8 — errors += ERR-CM-02. Sin cambio de guards existentes, actores, estados ni semántica.
# rev. 4e (2026-09-27, DEC-BR-018): alinea con DEC-BR-018 (ACCEPTED 2026-09-27) — OPEN-RV-11 pasa a DECIDED (A-57, A-58, cosignedByRef); P-02 (A-50) en REVOCATION_REQUESTED. Reemplaza citas de gobierno a scratchpad (CARLOS r3 R13-N/R14-X puros, S/PROPUESTA-Q18.md, S/R14-derivados.md) por DEC-BR-018; deja sin mapeo claro CARLOS r3 con codigos R1-R12/H1/C/F/(a), SM:NNN y DEC-BR-015:NN. Sin cambio de guards, errors ni semantica de consentimiento/revocacion/elegibilidad.
# rev. 4d (2026-09-27): SEC-CNS-013 (lampone-security, propuesta re-evaluada contra rev. 4c) — RC3
# (lado Revocation), R12, RH2, RH2v y RH3 suman GRD-CM-01/06/07 según corresponda, con sus errors;
# RV0 pasa de guardsByTrigger a guardsBySource (BEARER/SYSTEM, N-4c-01), alineado con la convención
# de common.spec.yaml (guardsBySource). ERR-RC-05 huérfano en RH2/RH2v/RH3: se anota, no se borra
# (OPEN-RV-10). Sin cambio de semántica de consentimiento/revocación/elegibilidad.
# rev. 4c (2026-09-27): F-R14-04 (co-firmante de RH3 en el ledger: cosignedByRef en REVOCATION_CONFIRMED, INV-RV-11; derivado pendiente OPEN-RV-11).
# rev. 4b (2026-09-27): SEC-CNS-012 re-verificación rev. 4 N2-01 (lado R9), N2-02 (GRD-RV-29 en R4), N2-04 (recovery token ligado a la decisión); AUDIT-H01-rev4 M-04.
# rev. 4 (2026-09-27): SEC-CNS-012 re-verificación N-01…N-09, AUDIT-H01-rev3 y decisiones R14-A/B/C de Carlos.
# rev. 3 (2026-09-27): decisiones de Carlos R13-1…R13-5 y R13-7 aplicadas (R10, R11, R12, RH2v, R9 sin re-escalar, R8h y RH3 con R13-4, erratum R13-3).
# rev. 2 (2026-09-27): SEC-CNS-012 P1-01 (parte técnica), P1-03, P1-05, P1-06 (parte técnica),
# P2-05…P2-08, P2-11, P2-17; AUDIT-H01 F-A08, F-A09, F-A11, F-A18. Semántica reservada a Carlos:
# OPEN-RV-02 (salidas de VERIFIED/CONFIRMED), OPEN-RV-05 (alcance del handle), OPEN-RV-06 (RH3),
# OPEN-RV-07 (R8h). Vocabulario del ledger = DEC-BR-017 §6, sin alias. Ningún modelo decide la
# revocación, la suficiencia de RECOVERY (LD-02) ni quién puede revocar (LD-03).
