events:
  - id: OTP_ISSUED
    stream: SECURITY
    emittedBy: [V1, V2r]
    payload: [verificationRef, scope, channelRef]
    governedBy: ["SM-CNS-001 §3 V1, V2r", "SEC F03"]
    testIds: [TEST-CNS-150, TEST-CNS-152]
  - id: OTP_FAILED
    stream: SECURITY
    emittedBy: [V2]
    payload: [verificationRef, scope]
    governedBy: ["SM-CNS-001 §3 V2"]
    testIds: [TEST-CNS-151]
  - id: OTP_LOCKED
    stream: SECURITY
    emittedBy: [V4]
    payload: [verificationRef, scope]
    governedBy: ["SM-CNS-001 §3 V4"]
    testIds: [TEST-CNS-154]
  - id: OTP_EXPIRED
    stream: SECURITY
    emittedBy: [V5]
    payload: [verificationRef, scope]
    governedBy: ["SM-CNS-001 §3 V5"]
    testIds: [TEST-CNS-155]
  - id: OTP_BUDGET_EXHAUSTED
    stream: SECURITY
    emittedBy: [V6, V6r, V6c, V6a]
    payload: [verificationRef, scopeClass, keyKind, windowKind]
    governedBy: ["SM-CNS-001 §3 V6, V6r, V6c"]
    testIds: [TEST-CNS-156, TEST-CNS-157, TEST-CNS-158]
  - id: MANAGEMENT_TOKEN_ROTATED
    stream: SECURITY
