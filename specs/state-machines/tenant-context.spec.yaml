guards:
  - id: GRD-TC-01
    name: tenant_status_reason_code
    rule: "Cambio de tenant.active solo por acto humano de plataforma (PLATFORM_ADMIN con MFA) registrado en ledger con reasonCode, o fuente FIXTURE (GRD-CM-14/15) en LOCAL/CI para seed sintético (SEC-CNS-013); ningún webhook ni billing_admin escribe app.tenant_status. Enum de reasonCode: OPEN-TC-01."
    onFail: ERR-TC-01
    governedBy: ["SM-CNS-001 §6 (SM:170)", "ADR-006 §12", "DEC-BR-016 §4, §5", "SEC-CNS-013"]
    testIds: [TEST-CNS-371]
  - id: GRD-TC-02
    name: participation_authorization_evidence
    rule: "PENDING_AUTHORIZATION/SUSPENDED → ACTIVE exige authorization_evidence_ref y authorized_by_role; como máximo una participación no CLOSED por (tenant_id, context_ref)."
    onFail: ERR-TC-02
    governedBy: ["DEC-BR-016 §1, §4", "ADR-006 §2"]
    testIds: [TEST-CNS-372]
  - id: GRD-TC-03
    name: single_active_enrollment
    rule: "Como máximo un Enrollment ACTIVE por (tenant_id, subject_ref, participation_ref); subjectRef y participationRef del tenant resuelto."
    onFail: ERR-TC-03
    governedBy: ["ADR-006 §2", "DEC-BR-016 §1"]
    testIds: [TEST-CNS-373]
  - id: GRD-TC-04
    name: enrollment_close_reason
    rule: "close_reason ∈ {TRANSFERRED, LEFT_SCHOOL, PARTICIPATION_CLOSED} (LEFT_SCHOOL pendiente de confirmación Q-28); el cierre no toca ConsentDecision."
    onFail: ERR-TC-04
    governedBy: ["SM-CNS-001 §6 (SM:173)", "DEC-BR-016 §1"]
    testIds: [TEST-CNS-374]
  - id: GRD-TC-05
    name: context_readiness
    rule: "list_tenants_for('CONTEXT_READINESS') con SET LOCAL por tenant, ejecutado solo por worker (EXECUTE nunca app_rw ni platform_rw), job_kind cerrado, auditoría por corrida; devuelve solo un booleano (≥1 tenant con SchoolParticipation ACTIVE para (contextRef, productRef)); el contexto nunca lista tenants."
    onFail: ERR-TC-05
    governedBy: ["DEC-BR-015:42, :45", "ADR-006 §2 (NF-14, S5-09)", "SEC-CNS-005 T-50, TS-16h"]
    testIds: [TEST-CNS-375]
  - id: GRD-TC-06
    name: human_only_reactivation
    rule: "PAUSED → ACTIVE solo actorType HUMAN (Context Owner o Privacy Legal); guards (a)–(d) re-evaluados atómicamente ([N-SM] §1, ACCEPTED). Exigir además que los incidentes abiertos estén resueltos es PROPOSED en [N-SM] §1 ('applies to every reasonCode') y se aplica aquí como regla PROPOSED, no como aceptada."
    onFail: ERR-CM-10
    governedBy: ["[N-SM] §1 PAUSED → ACTIVE (ACCEPTED 2026-09-23)"]
    testIds: [TEST-CNS-376]
  - id: GRD-TC-07
    name: eligibility_rows_locked_in_tx
    rule: "SEC N2-05 (write skew frente a SP4/EN1): toda transición que crea una credencial o una decisión final bajo la fórmula de elegibilidad (invitation I1, I3, I3r, I4; consent-decision C3, C5) toma, en la misma tx del append y en este orden fijo, FOR SHARE la fila de la SchoolParticipation, FOR SHARE la del Enrollment y FOR UPDATE la de la invitación, y evalúa GRD-CM-03/04/05 DESPUÉS de tomar los locks (alternativa equivalente: SERIALIZABLE con reintento). Así, o la transición confirma antes que SP4/EN1 (y la cascada ve la invitación ya terminal o la cancela), o espera y relee CLOSED y se rechaza con el error de GRD-CM-05. Conflicto o deadlock: reintento; agotado, rechazo fail-closed (ERR-CM-06), nunca efecto parcial."
    onFail: null # disciplina de locks: el rechazo lo da GRD-CM-03/04/05 tras releer bajo lock
    governedBy: ["SEC-CNS-012 re-verificación rev. 4 N2-05", "DEC-BR-018 R14-E", "SM-CNS-001 v7 §6 (SM:172, SM:173), §4.2", "DEC-BR-016 §8"]
    testIds: [TEST-CNS-436, TEST-CNS-437, TEST-CNS-443]
  - id: GRD-TC-08
    name: closure_cascade_never_aborts
    rule: "SEC N2-05 (R14-E): SP4 y EN1 toman FOR UPDATE la fila de la participación / del Enrollment (EN1: antes FOR KEY SHARE la participación, mismo orden que GRD-TC-07) y luego, en orden de invitationRef, FOR UPDATE las invitaciones no terminales afectadas; cada I9 (fuente SYSTEM, GRD-CM-15) se aplica bajo SAVEPOINT con el tenant_id del registro cerrado. Una invitación que al releer ya es terminal se salta de forma idempotente. Nunca aborta el cierre por una invitación (Guard P/E ya la bloquean: fail-closed). Condiciones SEC rev. 4b (3), DECIDIDO por Carlos como lectura de R14-E (OPEN-TC-07, DEC-BR-018 A-35, A-36): (i) lista CERRADA de fallas propias que revierten solo el SAVEPOINT de esa invitación: (a) error de append del agregado Invitation (lista blanca de payload, CHECK o UNIQUE de su sequence); (b) conflicto de expectedSequence no resuelto tras el reintento dentro de la tx; (c) lock timeout o deadlock sobre la fila de esa invitación: primero se reintenta DENTRO de la tx (ROLLBACK TO SAVEPOINT y nuevo intento con lock_timeout acotado) y solo si persiste tras el tope se revierte su SAVEPOINT. Cualquier otra falla (ledger o integridad no disponible, evaluador caído, falla sobre la fila del cierre o error no enumerado) revierte toda la tx: nada queda confirmado y el acto humano se reintenta. (ii) Al revertir un SAVEPOINT, en la misma tx del cierre se encola ops.job(kind = CASCADE_CANCEL_INVITATION, invitationRef, reasonCode) con UNIQUE (tenant_id, kind, invitation_ref) y alerta; el job lo ejecuta solo el rol worker (GRD-CM-15), relee el registro cerrado y la invitación bajo SET LOCAL y lock, salta sin evento si ya es terminal y, si no, aplica I9 con el mismo reasonCode (idempotencyKey (invitationRef, reasonCode): un solo INVITATION_CANCELLED); reintentos acotados con backoff (tope y backoff = parámetro nuevo de SEC-CNS-006, todavía PENDING; esta spec no fija valores) y alerta humana al agotarse. Agotado, la invitación sigue no terminal pero bloqueada (GRD-CM-03/04/05 bajo GRD-TC-07 y GRD-IV-13) hasta que I8 la expira en P-10; nunca toca ConsentDecision ni Revocation (INV-7). (iii) Mientras el job esté pendiente (o la participación / el Enrollment de la invitación esté CLOSED), GET /i/{token} de esa invitación responde el 404 uniforme sin crear handle LANDING (GRD-IV-13)."
    onFail: null # la cascada no tiene error propio: nunca aborta SP4/EN1
    decidedRef: "OPEN-TC-07 (DEC-BR-018, 2026-09-27); tope/backoff del job sigue PENDING en SEC-CNS-006"
    governedBy: ["SEC-CNS-012 re-verificación rev. 4 N2-05", "SEC-CNS-012 re-verificación rev. 4b (3) condiciones (i)–(iii)", "DEC-BR-018 (R14-E, OPEN-TC-07)", "SM-CNS-001 v7 §6 ('en la misma transacción que el cierre')", "INV-7", "ADR-006 §2 (job_kind cerrado)"]
    testIds: [TEST-CNS-428, TEST-CNS-436, TEST-CNS-437, TEST-CNS-438, TEST-CNS-449, TEST-CNS-450, TEST-CNS-451]
    testNotes:
      TEST-CNS-449: "Inyección de fallas en la cascada de SP4/EN1: (a) error de append de una Invitation y (b) conflicto de sequence persistente → solo su SAVEPOINT se revierte, el cierre confirma, se encola el job y hay alerta; (c) lock timeout transitorio → se reintenta dentro de la tx y la invitación se cancela en la misma tx sin job; (d) ledger/integridad no disponible, evaluador caído o error no enumerado → se revierte toda la tx (participación/Enrollment sin cambio)."
      TEST-CNS-450: "Job CASCADE_CANCEL_INVITATION: dos ejecuciones → un solo INVITATION_CANCELLED; invitación ya terminal → termina sin evento; UNIQUE (tenant_id, kind, invitation_ref); tope de reintentos con alerta al agotarse; agotado, la invitación sigue bloqueada (I1/I3/I3r/I4/C3/C5 rechazadas) y I8 la expira; ninguna ConsentDecision ni Revocation cambia; solo lo ejecuta el rol worker con el tenant del registro cerrado."
      TEST-CNS-451: "Con el job pendiente (y con participación/Enrollment CLOSED), GET /i/{token} de esa invitación → 404 uniforme (mismo cuerpo, código y tiempo acotado que un token inexistente), sin handle LANDING, sin Set-Cookie y sin evento."

