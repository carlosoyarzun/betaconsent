    testIds: [TEST-CNS-383]
  - id: RV0
    kind: EMISSION # operación sin cambio de estado de la Revocation
    from: null
    to: null
    command: IssueRecoveryLink
    actor:
      bySource:
        BEARER: {ref: UNVERIFIED_BEARER, note: "POST explícito desde el handle MANAGE_ENTRY; triggers REQUESTER_ASKED, LIMIT_REACHED"}
        SYSTEM: {actorType: SYSTEM_GUARD, note: "sin POST, credencial ni handle; dentro de la tx que dispara el trigger (RC2 → CASE_CONTACT, SCHOOL_REPORTED); SEC-CNS-013 N-4c-01"}
    triggers: [REQUESTER_ASKED, LIMIT_REACHED, CASE_CONTACT, SCHOOL_REPORTED]
    triggersBySource: {BEARER: [REQUESTER_ASKED, LIMIT_REACHED], SYSTEM: [CASE_CONTACT, SCHOOL_REPORTED]}
    routeClass: RIGHTS
    httpPost: true
    httpPostBySource: {BEARER: true, SYSTEM: false}
    httpPostNote: "SEC-CNS-013 N-4c-01: fuente BEARER es un POST explícito desde el handle MANAGE_ENTRY (GRD-CM-10); fuente SYSTEM no tiene POST, credencial ni handle, y se deriva de la identidad de ejecución (GRD-CM-15), nunca de un campo de la request."
    guards: [GRD-CM-06, GRD-RV-02, GRD-RV-17] # comunes a ambas fuentes
    guardsBySource: # SEC-CNS-013 N-4c-01 (reemplaza guardsByTrigger, SEC-CNS-012 P1-03 / AUDIT F-A09): misma clase de defecto que N3-01 en RC1 — guardsByTrigger no distinguía fuente ni exigía GRD-CM-15 en SYSTEM
      BEARER: [GRD-CM-01, GRD-CM-07, GRD-CM-10, GRD-RV-20]
      SYSTEM: [GRD-RV-22, GRD-CM-15]
    effects:
      - "Crea tenant_resolve.recovery_token(token_hash, tenant_id, chain_ref, revoked_decision_ref, recovery_ref, expires_at, consumed_at): token P-31, TTL P-15, purpose REVOCATION_RECOVERY; envío SOLO al channelRef ya ligado. SEC N2-04: revoked_decision_ref (NOT NULL) = decisión GRANTED vigente de la cadena al emitir (GRD-RV-02) o, con trigger de sistema, el revokedDecisionRef del caso."
      - "K vigentes por cadena (P-16); una emisión nueva no invalida las vigentes; al llegar a K rige la ventana P-17. Los límites se cuentan aparte de la idempotencia. Un token ligado a una decisión de un ciclo anterior no es vigente para el ciclo nuevo."
      - "Superar la ventana: respuesta uniforme con opción de pedir caso humano (RC1 LIMIT_REACHED solo a pedido del portador); nunca deniega."
      - "Un /r/ expirado no crea handle: 'pedir otro' (AC-03.3) se realiza desde el handle de /m/ con trigger REQUESTER_ASKED (alcance del handle según erratum R13-3)."
      - "Un /r/ inválido o expirado produce el mismo 303, pero nunca llega a ser un handle válido; la página muestra la uniforme de ERR-RV-05."
    emits: [RECOVERY_TOKEN_ISSUED]
    idempotencyKey: "clave por request: (tenant_id, chainRef, trigger, requestRef) — requestRef = Idempotency-Key del POST (portador) o caseRef (sistema); SEC P1-03"
    errors: [ERR-RV-12, ERR-RV-02, ERR-CM-09, ERR-CM-01, ERR-CM-10]
    governedBy: ["SM-CNS-001 §5.1 RV0", "DEC-BR-017 §2, §9", "SEC-CNS-006 P-15, P-16, P-17, P-31", "CARLOS r3 R7-3, R14-C", "SEC-CNS-012 P1-03", "SEC-CNS-012 re-verificación rev. 4 N2-04", "AUDIT F-A09", "SEC-CNS-013 N-4c-01"]
    testIds: [TEST-CNS-245, TEST-CNS-325, TEST-CNS-326, TEST-CNS-435, TEST-CNS-444, TEST-CNS-445]
    changeNote: "SEC-CNS-013 N-4c-01 (P2, gap nuevo tras rev. 4c, misma clase que N3-01): guardsByTrigger no distinguía fuente (BEARER/SYSTEM) ni exigía GRD-CM-15 en la rama SYSTEM (CASE_CONTACT, SCHOOL_REPORTED), quedando fuera del checker de guardsBySource y de la lista cerrada de funciones SECURITY DEFINER de GRD-CM-15. Se reemplaza por guardsBySource siguiendo la convención de common.spec.yaml (guardsBySource) y se suma RV0-sistema a la lista de funciones de GRD-CM-15 y a TEST-CNS-444/445 (ver common.spec.yaml). errors += ERR-CM-01, ERR-CM-10 (onFail de los guards nuevos). Actor bySource: BEARER = UNVERIFIED_BEARER (ya podía disparar RV0 por handle); SYSTEM = SYSTEM_GUARD (sin cambio de comportamiento, solo de modelado explícito). Sin cambio de semántica de consentimiento/revocación/elegibilidad."

managementLink: # §5.0: entrada única a toda ruta RIGHTS del titular (no es una máquina aparte)
  id: CFG-RV-MANAGEMENT-LINK
  entity: "tenant_resolve.management_token(token_hash PK, tenant_id, chain_ref, issued_at, rotated_at, revoked_at, revoked_reason ∈ {ROTATED, TOKEN_COMPROMISED})"
  issuedBy: "consent-decision C3 (con el receipt), solo al canal ligado"
  resolver: "resolve_management_token(token_hash) → (tenant_id, chain_ref); solo credencial + existencia del tenant (nunca *.active)"
  route: "GET /m/<token> → handle MANAGE_ENTRY (P-14) + 303 a /manage sin token"
  enables: ["otp-challenge V1 scope MANAGE/REVOCATION (al canal ligado)", "RV0 trigger del portador (al canal ligado)", "rights-case RC1, RC2u, RC3/RC3a (erratum R13-3)"]
  rotation: ["RECEIPT_REISSUED", "FAILURE_CAP (otp-challenge V6c)"]
  guard: GRD-RV-20
  invariant: INV-RV-06
  governedBy: ["SM-CNS-001 §5.0", "ADR-006 §6.1", "DEC-BR-017 §1", "SEC-CNS-006 P-13, P-14", "SEC-CNS-014 (Carlos, 2026-09-28)"]
  testIds: [TEST-CNS-258, TEST-CNS-264]
  changeNote: "SEC-CNS-014 (Carlos, 2026-09-28, opción a; mismo patrón que RECOVERY): GET /m/<token> deja de llamar resolve_management_token (deja de leer la BD) en el canje. Solo hashea el token y fija un handle MANAGE_ENTRY firmado propio (link-handle.ts, clave HKDF distinta de la de RECOVERY), con Set-Cookie y 303 a /manage SIEMPRE idénticos (válido, inexistente o rotado son indistinguibles). resolve_management_token(token_hash) se ejecuta recién en GET /manage (render, solo lectura), contra el hash del handle; si no resuelve, 404 uniforme byte-idéntico de la propia pantalla (frame 59:3), nunca del framework. Sin cambio de `enables`/`rotation`/`guard`/`invariant` ni de semántica de consentimiento/revocación/elegibilidad."

guards:
  - id: GRD-RV-01
    name: explicit_request_from_verified_manage_session
    rule: "R1 solo por POST explícito 'quiero revocar' con sesión MANAGE verificada (P-28) derivada del handle de /m/; abrir una página no crea solicitud."
    onFail: ERR-RV-01
    governedBy: ["DEC-BR-017 §1 (S4-06c)", "SM-CNS-001 §5 R1"]
    testIds: [TEST-CNS-230]
  - id: GRD-RV-02
    name: chain_granted
    rule: "La cadena resuelta en servidor tiene una ConsentDecision GRANTED/PARTIALLY_GRANTED vigente (precondición de R1, R1r, RC3 y RV0); esa decisión es el revokedDecisionRef de la nueva Revocation, fijado en servidor (R14-C)."
    onFail: ERR-RV-02
    governedBy: ["SM-CNS-001 §5 R1, §5.1", "REQ-CNS-TBD-03 AC-03.2"]
    testIds: [TEST-CNS-230, TEST-CNS-245]
  - id: GRD-RV-04
    name: single_open_revocation_per_chain
    rule: "R14-C: ≤1 Revocation no terminal por decisión GRANTED revocada, impuesto por UNIQUE parcial (tenant_id, revoked_decision_ref) WHERE state NOT IN ('COMPLETED','FAILED'); la decisionChainKey se conserva. Una revocación de un ciclo anterior (APPLIED, DOWNSTREAM_PENDING, DELIVERED) no absorbe la del consentimiento nuevo. Peticiones concurrentes sobre la misma decisión (R1 ∥ R1r ∥ RC3) → una sola crea, las demás se adjuntan; recoveryRef N:1 y caseRef 1:1."
    onFail: null # no es error: la petición se adjunta a la revocación abierta (idempotencia)
    governedBy: ["SM-CNS-001 v7 §5, §7", "DEC-BR-018 R14-C", "DEC-BR-017 §0.6", "REQ-CNS-TBD-06 AC-06.2", "SEC-CNS-012 P2-05", "AUDIT-H01-rev3 N-01"]
    testIds: [TEST-CNS-251, TEST-CNS-335, TEST-CNS-414, TEST-CNS-415, TEST-CNS-416]
  - id: GRD-RV-05
    name: fresh_revocation_otp_same_chain
    rule: "R2 exige un V3 scope REVOCATION con verification.parentRef = revocation.chainRef, del mismo decisionMakerRef y posterior a R1; una verificación MANAGE previa no basta (doble OTP deliberado). Cada verificationRef verifica a lo sumo una revocación (UNIQUE sobre revocation.verificationRef)."
    onFail: ERR-RV-03
    governedBy: ["SM-CNS-001 §5 R2", "CARLOS r3 R5-3", "REQ-CNS-TBD-02 AC-02.4", "SEC-CNS-012 P1-05"]
    testIds: [TEST-CNS-233, TEST-CNS-327, TEST-CNS-329]
  - id: GRD-RV-06
    name: recovery_token_valid
    rule: "Token de recuperación del tenant resuelto, no consumido, no expirado (P-15); handle RECOVERY vigente (P-18) creado por GET sin consumir; consumo en un único POST con CSRF + Origin. SEC N2-04 / R14-C: token.revoked_decision_ref = decisión del ciclo vigente de la cadena (la GRANTED vigente, que es el revokedDecisionRef de la Revocation abierta o de la que se crea); un token ligado a otra decisión (ciclo anterior) da la respuesta uniforme de ERR-RV-05, no se consume y no emite nada. Aplica a R1r, R2r, R10 y R11. portador fijado por GET sin validar ni consumir (P-18); este predicado se evalúa en solo lectura en GET /recovery/confirm (render) y en el POST (consumo)."
    onFail: ERR-RV-05
    governedBy: ["SM-CNS-001 §5.1 R1r, R2r", "ADR-006 §6.2", "REQ-CNS-TBD-03 AC-03.3, AC-03.5", "SEC-CNS-006 P-15, P-18", "DEC-BR-018 R14-C", "SEC-CNS-012 re-verificación rev. 4 N2-04"]
    testIds: [TEST-CNS-231, TEST-CNS-434, TEST-CNS-435]
  - id: GRD-RV-07
    name: explicit_total_withdrawal_confirmation
    rule: "Confirmación explícita de retiro total por el DecisionMaker (R3, R3r; en RH3 dada en la página del caso)."
    onFail: ERR-RV-04
    governedBy: ["SM-CNS-001 §5 R3, §5.1 R3r, §5.2 RH3"]
    testIds: [TEST-CNS-236]
  - id: GRD-RV-08
    name: actor_is_chain_decision_maker
    rule: "R1–R3, R8 y RC3 solo por el DecisionMaker de la cadena; TENANT_ADMIN, INVITER, School Champion, RIGHTS_OPERATOR, SYSTEM_GUARD o actor IA → rechazo."
    onFail: ERR-RV-04
    governedBy: ["DEC-BR-017 §8", "CARLOS r3 C", "SM-CNS-001 §4.1 (4), INV-9", "REQ-CNS-TBD-08 AC-08.1, AC-08.3"]
    testIds: [TEST-CNS-248, TEST-CNS-263]
  - id: GRD-RV-09
    name: rh2_dual_control_three_humans
    rule: "propose_case_verification por el RIGHTS_OPERATOR receptor del grant de la sesión CASE, con guion versionado; approve_case_verification por otro principal PRIVACY_LEGAL/SECURITY en su sesión PLATFORM; aprobador ≠ proponente ≠ aprobador de cualquier grant del caso ≠ receptor de cualquier grant del caso (P-38); sin Membership TENANT (revalidado en la tx); actores desde las sesiones, nunca de parámetros. Step-up y aserción: GRD-RC-12."
    onFail: ERR-RV-07
    governedBy: ["SM-CNS-001 §5.2 RH2", "ADR-006 §6.3", "ADR-002 §5", "DEC-BR-017 §3", "SEC-CNS-006 P-38", "CARLOS r3 R7-4, R7-5"]
    testIds: [TEST-CNS-235]
  - id: GRD-RV-10
    name: rh3_requires_attested_rh2
    rule: "record_case_confirmation solo con las aserciones ATTESTED de una RH2/RH2v de la MISMA (revocationRef, caseRef), posterior al último RC3/RC3a del caso; una VERIFIED por OTP con caso adjunto no pasa a RH3 sin esa verificación humana; recordedByRef desde la sesión CASE (SEC N-04)."
    onFail: ERR-RV-20
    governedBy: ["SM-CNS-001 v7 §5.2 RH3", "ADR-006 §6.3", "INV-13", "SEC-CNS-012 re-verificación N-04"]
    testIds: [TEST-CNS-238, TEST-CNS-402]
  - id: GRD-RV-11
    name: apply_in_one_tx
    rule: "C6 + RECEIPT_CREATED + outbox en una tx; effectiveAt = hora del append; expectedSequence con reintento (§4.2). Falla de clave/integridad no bloquea (P16, LD-05)."
    onFail: null # R4 nunca se rechaza por falla de clave (excepción de failClosed)
    governedBy: ["SM-CNS-001 §5 R4, §4.2", "RULE-CNS-025", "[N-SM] §1 P16"]
    testIds: [TEST-CNS-239, TEST-CNS-256]
  - id: GRD-RV-12
