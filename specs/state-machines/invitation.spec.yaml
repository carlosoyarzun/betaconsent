invariants:
  - id: INV-IV-01
    statement: "COMPLETED, DECLINED, EXPIRED y CANCELLED son terminales para el token; reemitir crea una Invitation nueva (I1 con reissueOfRef)."
    governedBy: ["[N-SM] §2", "SM-CNS-001 §2 'Inválidas'"]
    testIds: [TEST-CNS-131]
  - id: INV-IV-02
    statement: "Como máximo una Invitation no terminal por (tenantRef, contextRef, subjectRef) (PROPOSED [Q1]/LD-20)."
    governedBy: ["SM-CNS-001 §2 I1"]
    testIds: [TEST-CNS-132]
  - id: INV-IV-03
    statement: "El token nunca persiste ni aparece en ledger, logs de app/plataforma/DB ni URL tras el 303; solo tokenHash."
    governedBy: ["SM-CNS-001 §2.2", "ADR-001 §2, §8", "SEC-CNS-005 T-01", "DEC-BR-014 §6"]
