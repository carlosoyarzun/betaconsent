    routeClass: RIGHTS
    httpPost: true
    guards: [GRD-CM-01, GRD-CM-06, GRD-CM-07, GRD-CM-10, GRD-RV-19, GRD-RV-23, GRD-RV-25, GRD-RV-27, GRD-RV-28, GRD-RC-08, GRD-RC-14] # SEC-CNS-013: antepone GRD-CM-01
    effects:
