# §6 de SM-CNS-001 (contexto de tenant) modelado SOLO en lo que afecta a las cinco máquinas IT0
# (decisión del Supervisor sobre AUDIT F-A14, 2026-09-27). H01 / CA-116, rev. 2. Cero PII.
# Lo que §6 no aplica a IT0 se lista en coverage.notCovered y no se declara cubierto.
specId: SPEC-CNS-SM-TENANT-CONTEXT
title: "Contexto de tenant (Tenant status, SchoolParticipation, Enrollment, readiness de ConsentContext): efectos sobre las máquinas IT0"
smId: SM-CNS-001
smSection: "§6 (D1, F-211), R0.4–R0.6"
version: "0.2.0"
status: PROPOSED
jiraStory: CA-116
owner: lampone-architect
reviewers: [lampone-security, lampone-qa, carlosoyarzun]
humanGate: "Solo Carlos cierra esta spec."
commonSpec: specs/state-machines/common.spec.yaml
reviewInputs: ["AUDIT-H01 F-A14 (decisión del Supervisor: entra en H01 solo lo que afecta a las cinco máquinas)"]
governedBy:
  - "SM-CNS-001 v6 §6 (SM:158-163)"
  - "DEC-BR-014 §1 (SchoolParticipation y Enrollment por fixture o acto humano), §5 (SchoolParticipation y tenant.active solo por fixture o migración revisada, sin UI), §6 (actor FIXTURE)"
  - "DEC-BR-015:42, :45 (guard (d) + Guard P; reactivación R7-1)"
  - "DEC-BR-016 §1, §4, §7, §8"
  - "ADR-006 §2 (school_participation, enrollment, CONTEXT_READINESS), §12 (estado del tenant)"
  - "CARLOS r2 D1, D5; r3 R7-1"
  - "[N-SM] §1 ConsentContext (READY → ACTIVE, PAUSED → ACTIVE)"
  - "SEC-CNS-005 T-25, T-50, T-62"

coverage:
  covered:
    - "Tenant ACTIVE ↔ SUSPENDED y su efecto: bloquea ISSUANCE/DECISION, nunca RIGHTS (SM:159)"
    - "SchoolParticipation PENDING_AUTHORIZATION → ACTIVE ↔ SUSPENDED → CLOSED y su efecto sobre Guard P, I9 y ConsentDecision (SM:161)"
    - "Enrollment ACTIVE → CLOSED {TRANSFERRED, LEFT_SCHOOL, PARTICIPATION_CLOSED} y su efecto sobre Guard E, I9, API-CNS-001 e INV-7 (SM:162)"
    - "ConsentContext READY → ACTIVE y PAUSED → ACTIVE: solo el guard (d) / CONTEXT_READINESS (R7-1) y su evaluación sin lectura cross-tenant (SM:160)"
    - "Fail-closed en el tenant nuevo tras un traslado: ninguna autorización cruza tenant (SM:163, INV-3)"
  notCovered: # no se declaran cubiertos por H01
    - "Creación/borrado de tenants (provisión por fixture; borrado: LD-12)"
    - "BillingSubscription → tenant.active (DEFERRED IT0; DEC-BR-016 §5)"
    - "Flujo del traslado en el tenant destino (DEFERRED IT0; LD-09, LD-10)"
    - "Resto de la máquina ConsentContext ([N-SM] §1): DRAFT → READY, ACTIVE → PAUSED (reasonCodes, cuarentena REQ-CNS-035), → CLOSED, → ARCHIVED; guards (a)–(c) de ética y versión"
    - "eligibility.changed (E-10 PROPOSED; Q-18) — no se emite"
    - "Ética por colegio (Q-11), Organization (DEFERRED)"

submachines:
  - machine: Tenant
    aggregateType: TenantStatus
    projection: "app.tenant_status (tenant.active); la existencia vive en tenant_resolve.tenant (ADR-006 §6)"
    noTerminalStates: "El tenant no se borra mientras exista dato o evento del tenant (ADR-006 §6; LD-12)."
    states:
      - id: ACTIVE
        initial: true
        terminal: false
        description: "tenant.active = true."
        governedBy: ["SM-CNS-001 §6 (SM:159)", "ADR-006 §12"]
        testIds: [TEST-CNS-350]
      - id: SUSPENDED
        initial: false
        terminal: false
        description: "tenant.active = false: bloquea ISSUANCE/DECISION (GRD-CM-05); nunca RIGHTS (INV-6)."
        governedBy: ["SM-CNS-001 §6 (SM:159)", "DEC-BR-016 §8"]
        testIds: [TEST-CNS-351]
    transitions:
      - id: TN1
        from: ACTIVE
        to: SUSPENDED
        command: SuspendTenant
        actor: {actorType: HUMAN, actorRole: PLATFORM_ADMIN, channel: "en IT0 solo fixture o migración revisada, sin UI (DEC-BR-014 §5); FIXTURE solo según GRD-CM-13"}
        routeClass: PLATFORM
        httpPost: false
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-01]
        effects: ["Desde el append: GRD-CM-05 da false en I1–I4, V1 DECISION y C1–C5 del tenant; las rutas RIGHTS siguen resolviendo (GRD-CM-06, AC-02.3)."]
        emits: [TENANT_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, sequence)"
        errors: [ERR-CM-10, ERR-TC-01]
        governedBy: ["SM-CNS-001 §6 (SM:159)", "ADR-006 §12", "DEC-BR-014 §5"]
        testIds: [TEST-CNS-352]
      - id: TN2
        from: SUSPENDED
        to: ACTIVE
        command: ReactivateTenant
        actor: {actorType: HUMAN, actorRole: PLATFORM_ADMIN, channel: "en IT0 solo fixture o migración revisada, sin UI"}
        routeClass: PLATFORM
        httpPost: false
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-01]
        effects: ["Rehabilita ISSUANCE/DECISION del tenant; no reactiva nada terminal."]
        emits: [TENANT_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, sequence)"
        errors: [ERR-CM-10, ERR-TC-01]
        governedBy: ["SM-CNS-001 §6 (SM:159)", "ADR-006 §12"]
        testIds: [TEST-CNS-353]
  - machine: SchoolParticipation
    aggregateType: SchoolParticipation
    table: "app.school_participation (ADR-006 §2); UNIQUE parcial (tenant_id, context_ref) WHERE status <> 'CLOSED'"
    states:
      - id: PENDING_AUTHORIZATION
        initial: true
        terminal: false
        description: "Participación creada sin autorizar: Guard P falla."
        governedBy: ["SM-CNS-001 §6 (SM:161)", "ADR-006 §2", "DEC-BR-016 §1"]
        testIds: [TEST-CNS-354]
      - id: ACTIVE
        initial: false
        terminal: false
        description: "Autorizada: Guard P se cumple para (contextRef, productRef)."
        governedBy: ["SM-CNS-001 §6", "DEC-BR-016 §4"]
        testIds: [TEST-CNS-355]
      - id: SUSPENDED
        initial: false
        terminal: false
        description: "Bloquea I3/I4/C1–C5 sin cancelar invitaciones ni tocar decisiones; nunca RIGHTS."
        governedBy: ["SM-CNS-001 §6 (SM:161), §2 'Inválidas'"]
        testIds: [TEST-CNS-356]
      - id: CLOSED
        initial: false
        terminal: true
        description: "Participación cerrada; nunca toca ConsentDecision ni emite consent.revoked."
        governedBy: ["SM-CNS-001 §6 (SM:161)", "INV-7"]
        testIds: [TEST-CNS-357]
    transitions:
      - id: SP1
        from: PENDING_AUTHORIZATION
        to: ACTIVE
        command: AuthorizeSchoolParticipation
        actor: {actorType: HUMAN, actorRole: CONTEXT_OWNER, channel: "en IT0 solo fixture o migración revisada (DEC-BR-014 §5); segundo aprobador Privacy Legal: pregunta abierta F-313"}
        routeClass: PLATFORM
        httpPost: false
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-02]
        effects: ["Guard P empieza a cumplirse para el tenant; habilita I1–I4/C1–C5 si el resto de la fórmula se cumple. La IA nunca la otorga ni la infiere."]
        emits: [SCHOOL_PARTICIPATION_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, participation_ref, sequence)"
        errors: [ERR-CM-10, ERR-TC-02]
        governedBy: ["SM-CNS-001 §6 (SM:161)", "DEC-BR-016 §1, §4", "ADR-006 §2"]
        testIds: [TEST-CNS-358]
      - id: SP2
        from: ACTIVE
        to: SUSPENDED
        command: SuspendSchoolParticipation
        actor: {actorType: HUMAN, actorRole: CONTEXT_OWNER, channel: "en IT0 solo fixture o migración revisada"}
        routeClass: PLATFORM
        httpPost: false
        guards: [GRD-CM-07, GRD-CM-13]
        effects: ["Guard P falla: I3/I4/C1–C5 del tenant se rechazan con INVITER_NOT_PARTICIPATING/CONTEXT_NOT_ACTIVE sin volver nada terminal (INV-IV-07); revocación y derechos intactos (INV-6)."]
        emits: [SCHOOL_PARTICIPATION_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, participation_ref, sequence)"
        errors: [ERR-CM-10]
        governedBy: ["SM-CNS-001 §6 (SM:161)", "DEC-BR-016 §4"]
        testIds: [TEST-CNS-359]
      - id: SP3
        from: SUSPENDED
        to: ACTIVE
        command: ReactivateSchoolParticipation
        actor: {actorType: HUMAN, actorRole: CONTEXT_OWNER, channel: "en IT0 solo fixture o migración revisada"}
        routeClass: PLATFORM
        httpPost: false
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-02]
        effects: ["Guard P vuelve a cumplirse; las invitaciones no terminales continúan."]
        emits: [SCHOOL_PARTICIPATION_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, participation_ref, sequence)"
        errors: [ERR-CM-10, ERR-TC-02]
        governedBy: ["SM-CNS-001 §6 (SM:161: 'ACTIVE ↔ SUSPENDED')"]
        testIds: [TEST-CNS-360]
      - id: SP4
        from: [ACTIVE, SUSPENDED]
        to: CLOSED
        command: CloseSchoolParticipation
        actor: {actorType: HUMAN, actorRole: CONTEXT_OWNER, channel: "en IT0 solo fixture o migración revisada"}
        routeClass: PLATFORM
        httpPost: false
        guards: [GRD-CM-07, GRD-CM-13]
        effects:
          - "Invitaciones no terminales: I9 PARTICIPATION_CLOSED está enabled: false (Q-18); mientras tanto Guard P las bloquea (fail-closed)."
          - "Cierre en cascada de Enrollments con motivo PARTICIPATION_CLOSED: no especificado en SM §6 como efecto automático (OPEN-TC-02); Guard P ya bloquea el tratamiento."
          - "Ninguna transición de ConsentDecision ni consent.revoked (INV-7)."
        emits: [SCHOOL_PARTICIPATION_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, participation_ref, sequence)"
        errors: [ERR-CM-10]
        governedBy: ["SM-CNS-001 §6 (SM:161)", "DEC-BR-016 §4", "DEC-BR-017 E-04 (condicional Q-18)"]
        testIds: [TEST-CNS-361]
  - machine: Enrollment
    aggregateType: Enrollment
    table: "app.enrollment (ADR-006 §2); UNIQUE parcial (tenant_id, subject_ref, participation_ref) WHERE status = 'ACTIVE'"
    states:
      - id: ACTIVE
        initial: true
        terminal: false
        description: "Guard E se cumple para el subjectRef en la participación."
        governedBy: ["SM-CNS-001 §6 (SM:162)", "ADR-006 §2"]
        testIds: [TEST-CNS-362]
      - id: CLOSED
        initial: false
        terminal: true
        description: "close_reason ∈ {TRANSFERRED, LEFT_SCHOOL, PARTICIPATION_CLOSED}; ningún motivo es retiro de consentimiento."
        governedBy: ["SM-CNS-001 §6 (SM:162)", "DEC-BR-016 §1"]
        testIds: [TEST-CNS-363]
    transitions:
      - id: EN0
        from: null
        to: ACTIVE
        command: OpenEnrollment
        actor: {actorType: HUMAN, actorRole: INVITER, note: "TENANT_ADMIN (DEC-BR-016 §4 'abre y cierra Enrollments'); en IT0 también por fixture (DEC-BR-014 §1)"}
        routeClass: ISSUANCE_DECISION
        httpPost: true # consola STAFF cuando no es fixture
        guards: [GRD-CM-01, GRD-CM-02, GRD-CM-07, GRD-CM-10, GRD-CM-13, GRD-TC-03]
        effects: ["Guard E empieza a cumplirse para el subjectRef en esa participación."]
        emits: [ENROLLMENT_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, subject_ref, participation_ref)"
        errors: [ERR-CM-09, ERR-CM-10, ERR-TC-03]
        governedBy: ["DEC-BR-014 §1", "DEC-BR-016 §4", "ADR-006 §2"]
        testIds: [TEST-CNS-364]
      - id: EN1
        from: ACTIVE
        to: CLOSED
        command: CloseEnrollment
        actor: {actorType: HUMAN, actorRole: INVITER, note: "TENANT_ADMIN registra el motivo (DEC-BR-016 §4); en IT0 también por fixture"}
        routeClass: ISSUANCE_DECISION
        httpPost: true
        guards: [GRD-CM-01, GRD-CM-02, GRD-CM-07, GRD-CM-10, GRD-CM-13, GRD-TC-04]
        effects:
          - "Guard E falla: I3/I4/C1–C5 del subjectRef se rechazan; I9 ENROLLMENT_CLOSED está enabled: false (Q-18)."
          - "API-CNS-001 responde NOT_AUTHORIZED (RULE-CNS-013); el motivo interno ENROLLMENT_NOT_ACTIVE queda solo en AuthorizationCheck (F-323)."
          - "TRANSFERRED ≠ revocación: sin consent.revoked, sin transición de ConsentDecision, sin supresión; histórico conservado (LD-12). El DecisionMaker conserva consulta, revocación y derechos (INV-6)."
          - "eligibility.changed no se emite (E-10 PROPOSED, Q-18)."
        emits: [ENROLLMENT_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, enrollment_ref, sequence)"
        errors: [ERR-CM-09, ERR-CM-10, ERR-TC-04]
        governedBy: ["SM-CNS-001 §6 (SM:162)", "DEC-BR-016 §7", "DR2 D1", "INV-7", "INV-CD-06"]
        testIds: [TEST-CNS-365]
  - machine: ConsentContextReadiness
    aggregateType: ConsentContext
    partial: true
    partialNote: "Solo las dos transiciones de [N-SM] §1 que dependen de SchoolParticipation (guard (d), R7-1). El resto de la máquina no está cubierto (coverage.notCovered)."
    states:
      - id: READY
        initial: false
        terminal: false
        description: "Configuración completa y aprobada ([N-SM] §1)."
        governedBy: ["[N-SM] §1"]
        testIds: [TEST-CNS-366]
      - id: ACTIVE
        initial: false
        terminal: false
        description: "Contexto activo: parte de la fórmula de GRD-CM-05 (study.active)."
        governedBy: ["[N-SM] §1", "DEC-BR-016 §8"]
        testIds: [TEST-CNS-367]
      - id: PAUSED
        initial: false
        terminal: false
        description: "Bloquea invitaciones y decisiones; revocación y derechos disponibles ([N-SM] §1, ACCEPTED)."
        governedBy: ["[N-SM] §1", "SM-CNS-001 R0.5"]
        testIds: [TEST-CNS-368]
    transitions:
      - id: CX1
        from: READY
        to: ACTIVE
        command: ActivateContext
        actor: {actorType: SYSTEM_GUARD, note: "en IT0 el contexto cambia por fixture o migración revisada (SM:160; ADR-006 §2), pero la evaluación CONTEXT_READINESS se prueba igual"}
        routeClass: PLATFORM
        httpPost: false
        guards: [GRD-TC-05]
        effects: ["Solo cubre el guard (d): literal DEC-BR-015:42 evaluado como booleano; (a)–(c) fuera de H01."]
        emits: [CONSENT_CONTEXT_STATUS_CHANGED]
        idempotencyKey: "(contextRef, sequence)"
        errors: [ERR-TC-05]
        governedBy: ["SM-CNS-001 §6 (SM:160)", "DEC-BR-015:42", "ADR-006 §2", "[N-SM] §1 guard (d)"]
        testIds: [TEST-CNS-369]
      - id: CX2
        from: PAUSED
        to: ACTIVE
        command: ReactivateContext
        actor: {actorType: HUMAN, actorRole: CONTEXT_OWNER, alt: "PRIVACY_LEGAL (rol de plataforma)", note: "HUMAN only; nunca SYSTEM_GUARD, modelo ni agente ([N-SM] §1, ACCEPTED)"}
        routeClass: PLATFORM
        httpPost: true # consola PLATFORM
        guards: [GRD-CM-07, GRD-CM-10, GRD-TC-05, GRD-TC-06]
        effects:
          - "R7-1: exige ≥1 tenant con SchoolParticipation ACTIVE para (contextRef, productRef), evaluado como CONTEXT_READINESS (solo booleano, sin lectura cross-tenant); falso → rechazo sin evento y el contexto sigue PAUSED."
          - "Evaluación y transición en la misma tx, serializadas frente a la suspensión de la última participación (T-62); solo por función, sin DML."
          - "Nunca toca la vía de revocación (INV-6)."
        emits: [CONSENT_CONTEXT_STATUS_CHANGED]
        idempotencyKey: "(contextRef, sequence)"
        errors: [ERR-TC-05, ERR-CM-09, ERR-CM-10]
        governedBy: ["SM-CNS-001 §6 (SM:160)", "CARLOS r3 R7-1", "DEC-BR-015:45", "ADR-006 §2", "SEC-CNS-005 T-62, TS-16j"]
        testIds: [TEST-CNS-370]

guards:
  - id: GRD-TC-01
    name: tenant_status_reason_code
    rule: "Cambio de tenant.active solo por acto humano de plataforma (PLATFORM_ADMIN con MFA) registrado en ledger con reasonCode; ningún webhook ni billing_admin escribe app.tenant_status. Enum de reasonCode: OPEN-TC-01."
    onFail: ERR-TC-01
    governedBy: ["SM-CNS-001 §6 (SM:159)", "ADR-006 §12", "DEC-BR-016 §4, §5"]
    testIds: [TEST-CNS-371]
  - id: GRD-TC-02
    name: participation_authorization_evidence
    rule: "PENDING_AUTHORIZATION/SUSPENDED → ACTIVE exige authorization_evidence_ref y authorized_by_role; como máximo una participación no CLOSED por (tenant_id, context_ref)."
    onFail: ERR-TC-02
    governedBy: ["DEC-BR-016 §1, §4", "ADR-006 §2"]
    testIds: [TEST-CNS-372]
  - id: GRD-TC-03
    name: single_active_enrollment
    rule: "Como máximo un Enrollment ACTIVE por (tenant_id, subject_ref, participation_ref); subjectRef y participationRef del tenant resuelto."
    onFail: ERR-TC-03
    governedBy: ["ADR-006 §2", "DEC-BR-016 §1"]
    testIds: [TEST-CNS-373]
  - id: GRD-TC-04
    name: enrollment_close_reason
    rule: "close_reason ∈ {TRANSFERRED, LEFT_SCHOOL, PARTICIPATION_CLOSED} (LEFT_SCHOOL pendiente de confirmación Q-28); el cierre no toca ConsentDecision."
    onFail: ERR-TC-04
    governedBy: ["SM-CNS-001 §6 (SM:162)", "DEC-BR-016 §1"]
    testIds: [TEST-CNS-374]
  - id: GRD-TC-05
    name: context_readiness
    rule: "list_tenants_for('CONTEXT_READINESS') con SET LOCAL por tenant, ejecutado solo por worker (EXECUTE nunca app_rw ni platform_rw), job_kind cerrado, auditoría por corrida; devuelve solo un booleano (≥1 tenant con SchoolParticipation ACTIVE para (contextRef, productRef)); el contexto nunca lista tenants."
    onFail: ERR-TC-05
    governedBy: ["DEC-BR-015:42, :45", "ADR-006 §2 (NF-14, S5-09)", "SEC-CNS-005 T-50, TS-16h"]
    testIds: [TEST-CNS-375]
  - id: GRD-TC-06
    name: human_only_reactivation
    rule: "PAUSED → ACTIVE solo actorType HUMAN (Context Owner o Privacy Legal); guards (a)–(d) re-evaluados atómicamente; incidentes abiertos resueltos ([N-SM] §1)."
    onFail: ERR-CM-10
    governedBy: ["[N-SM] §1 PAUSED → ACTIVE (ACCEPTED 2026-09-23)"]
    testIds: [TEST-CNS-376]

errors:
  - id: ERR-TC-01
    code: TENANT_STATUS_CHANGE_REJECTED
    response: "Rechazo determinista (sin reasonCode, actor no humano de plataforma o vía no admitida)"
    emitsEvent: none
    governedBy: ["ADR-006 §12"]
    testIds: [TEST-CNS-371]
  - id: ERR-TC-02
    code: PARTICIPATION_AUTHORIZATION_INVALID
    response: "Rechazo determinista (sin evidencia o segunda participación no CLOSED)"
    emitsEvent: none
    governedBy: ["DEC-BR-016 §4", "ADR-006 §2"]
    testIds: [TEST-CNS-372]
  - id: ERR-TC-03
    code: ENROLLMENT_ALREADY_ACTIVE
    response: "Rechazo determinista (UNIQUE parcial)"
    emitsEvent: none
    governedBy: ["ADR-006 §2"]
    testIds: [TEST-CNS-373]
  - id: ERR-TC-04
    code: ENROLLMENT_CLOSE_REASON_INVALID
    response: "422: motivo fuera de enum"
    emitsEvent: none
    governedBy: ["DEC-BR-016 §1"]
    testIds: [TEST-CNS-374]
  - id: ERR-TC-05
    code: CONTEXT_NOT_READY
    response: "Rechazo sin evento; el contexto conserva su estado (READY o PAUSED); la respuesta no revela tenants ni conteos"
    emitsEvent: none
    governedBy: ["DEC-BR-015:45", "ADR-006 §2", "SEC-CNS-005 TS-16j"]
    testIds: [TEST-CNS-375]

events:
  - id: TENANT_STATUS_CHANGED
    stream: LEDGER
    emittedBy: [TN1, TN2]
    payload: [reasonCode]
    governedBy: ["SM-CNS-001 §6 (SM:159: 'TENANT_STATUS_CHANGED {reasonCode}')"]
    testIds: [TEST-CNS-352, TEST-CNS-353]
  - id: SCHOOL_PARTICIPATION_STATUS_CHANGED
    stream: LEDGER
    nameStatus: "PROPOSED — SM §6 no nombra el evento; taxonomía gaona-measure / H02 (OPEN-CM-02)"
    emittedBy: [SP1, SP2, SP3, SP4]
    payload: [participationRef, fromStatus, toStatus, authorizationEvidenceRef]
    governedBy: ["SM-CNS-001 §6 (SM:161)", "SM-CNS-001 R0.1 (sin cambio de estado sin evento)"]
    testIds: [TEST-CNS-358, TEST-CNS-361]
  - id: ENROLLMENT_STATUS_CHANGED
    stream: LEDGER
    nameStatus: "PROPOSED — SM §6 no nombra el evento; taxonomía gaona-measure / H02 (OPEN-CM-02)"
    emittedBy: [EN0, EN1]
    payload: [enrollmentRef, participationRef, subjectRef, toStatus, closeReason]
    governedBy: ["SM-CNS-001 §6 (SM:162)", "SM-CNS-001 R0.1"]
    testIds: [TEST-CNS-364, TEST-CNS-365]
  - id: CONSENT_CONTEXT_STATUS_CHANGED
    stream: PLATFORM_AUDIT
    nameStatus: "PROPOSED — [N-SM] §1 exige un evento de auditoría por transición sin nombrarlo; tabla y encadenado OPEN (ADR-011 / H02)"
    emittedBy: [CX1, CX2]
    payload: [contextRef, fromStatus, toStatus, actorType, reasonCode, incidentRef, ruleVersion]
    governedBy: ["[N-SM] §1 'Audit'"]
    testIds: [TEST-CNS-369, TEST-CNS-370]

invariants:
  - id: INV-TC-01
    statement: "Ningún estado de Tenant, SchoolParticipation, Enrollment ni ConsentContext impide revocar ni ejercer derechos; solo cambian eligibility_to_participate (prueba dinámica: revocation INV-6)."
    governedBy: ["RULE-CNS-TBD-01", "DEC-BR-016 §8", "SM-CNS-001 R0.6"]
    testIds: [TEST-CNS-377]
  - id: INV-TC-02
    statement: "Ningún traslado habilita tratamiento en el tenant destino: no hay vínculo entre tenants; el destino crea Student, Enrollment, Invitation y ConsentDecision nuevos (DEFERRED en IT0)."
    governedBy: ["SM-CNS-001 §6 (SM:163)", "INV-3", "LD-09", "LD-10"]
    testIds: [TEST-CNS-378]
  - id: INV-TC-03
    statement: "Que ninguna participación siga ACTIVE no pausa el contexto: Guard P bloquea por tenant; la reactivación de un contexto PAUSED exige la misma condición (R7-1)."
    governedBy: ["SM-CNS-001 §6 (SM:160)", "DEC-BR-015 Consecuencias (C-19, C-57/C-58)", "CARLOS r3 R7-1"]
    testIds: [TEST-CNS-379]

failClosed: >
  Estado de tenant, participación o Enrollment desconocido = no elegible en ISSUANCE/DECISION
  (GRD-CM-05) y sin efecto en RIGHTS. CONTEXT_READINESS falso o no evaluable → el contexto
  conserva su estado. Ninguna de estas transiciones toca ConsentDecision ni emite consent.revoked.

