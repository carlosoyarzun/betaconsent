    guards: [GRD-CM-01, GRD-CM-06, GRD-CM-07, GRD-CM-10, GRD-RV-09, GRD-RV-19, GRD-RV-23, GRD-RV-27, GRD-RV-28, GRD-RC-10, GRD-RC-12, GRD-RC-15] # SEC-CNS-013
    effects:
      - "R13-1: mismos dos pasos, step-up y tres humanos que RH2; verificación adicional sin retroceso (INV-16); luego RH3 con cuatro ojos."
    emits: [REVOCATION_VERIFIED]
    payloadValues: {authPath: RECOVERY, recoveryMethod: HUMAN_ASSISTED, caseRef: required, verifiedByRef: proposer, secondApproverRef: approver, assuranceLevel: "placeholder LD-02"}
    idempotencyKey: "(revocationRef, proposal_ref)"
    errors: [ERR-RV-07, ERR-RV-08, ERR-RV-19, ERR-RC-04, ERR-RC-05, ERR-CM-09, ERR-CM-01, ERR-CM-10, ERR-RC-10, ERR-RV-13, ERR-RV-15]
