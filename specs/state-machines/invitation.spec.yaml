# Máquina Invitation del subconjunto IT0 (H01 / CA-116), rev. 4 (R14-E: Q-18 opción A). Guards/errores/invariantes
# rev. 4d (2026-09-27, DEC-BR-018): alinea con DEC-BR-018 (ACCEPTED 2026-09-27) — OPEN-TC-07 pasa a DECIDED (A-09, A-35, A-36) como lectura de R14-E; cita de Q-18. Reemplaza citas de gobierno a scratchpad (CARLOS r3 R13-N/R14-X puros, S/PROPUESTA-Q18.md, S/R14-derivados.md) por DEC-BR-018; deja sin mapeo claro CARLOS r3 con codigos R1-R12/H1/C/F/(a), SM:NNN y DEC-BR-015:NN. Sin cambio de guards, errors ni semantica de consentimiento/revocacion/elegibilidad.
# transversales en common.spec.yaml (GRD-CM-*, ERR-CM-*, INV-CM-*). Cero PII.
# rev. 4c (2026-09-27): SEC-CNS-012 re-verificación rev. 4b N3-01 (GRD-CM-15 en la fuente SYSTEM de I9) y condición (iii) de GRD-TC-08 (GRD-IV-13: 404 uniforme en GET /i/; OPEN-TC-07 DECIDED, DEC-BR-018).
# rev. 4b (2026-09-27): SEC-CNS-012 re-verificación rev. 4 N2-01 (guardsBySource en I9), N2-05 (GRD-TC-07 en I1/I3/I3r/I4); AUDIT-H01-rev4 M-05.
specId: SPEC-CNS-SM-INVITATION
title: "State machine Invitation (IT0)"
smId: SM-CNS-001
smSection: "§2, §2.1, §2.2"
aggregateType: Invitation
version: "0.4.2"
status: PROPOSED
jiraStory: CA-116
owner: lampone-architect
reviewers: [lampone-security, lampone-qa, carlosoyarzun]
humanGate: "Solo Carlos cierra esta spec."
commonSpec: specs/state-machines/common.spec.yaml
governedBy:
  - "SM-CNS-001 v6 §2 (I1–I9, I3r, I7u), §2.1 (M1–M5, SEC F01), §2.2 (tokens fuera de la URL)"
  - "[N-SM] §2 Invitation (Notion State Machines — Build Draft; enmienda E-04 publicada vía DEC-BR-017, Fase 4)"
  - "DEC-BR-014 §1 (solo INSTITUTION_MEDIATED), §6 (token de invitación)"
  - "DEC-BR-015:42 (guard (d) + Guard P), DEC-BR-013, RULE-CNS-024, RULE-CNS-022"
  - "DEC-BR-016 §1, §4 (TENANT_ADMIN con capacidad INVITER), §7, §8"
  - "ADR-001 §2, §8; ADR-006 §6 (resolve_invitation)"
  - "SEC-CNS-006 P-10, P-11, P-12, P-31; SEC-CNS-005 T-01, T-06"

scope:
  it0: "Emisión por staff IT0_ONLY (TENANT_ADMIN/INVITER), invitationMode = INSTITUTION_MEDIATED, apertura, verificación DECISION, cierre por decisión, expiración y cancelación."
  notInIt0:
    - "I7u OPENED → DECLINED sin verificar: deshabilitada en BETA_2026_01 (NF-03, Q-15)"
    - "Emisor técnico y canal de entrega (issuerActor, deliveryChannel): parametrizados, sin fijar (EXT-B, F-014; DEC-BR-014 §7)"
  blockers:
    - "SEC F01 (P0, LD-01): el enlace es credencial al portador; bloquea todo uso de datos personales reales. IT0 solo sintético."

attributes:
  - invitationRef
  - tenantRef # tenant originador (inviterTenantRef, E-04)
  - participationRef
  - enrollmentRef
  - productRef
  - contextRef
  - subjectRef
  - consentVersion
  - tokenHash # SHA-256 del token; el token nunca persiste
  - expiresAt
  - recipientBinding # enum RECIPIENT_CHANNEL | UNBOUND
  - recipientChannelRef
  - boundDecisionMakerRef
  - reissueOfRef
  - issuerActor # enum INSTITUTION_OPERATOR | PLATFORM_ON_BEHALF (EXT-B, sin fijar)
  - deliveryChannel # enum SCHOOL_CHANNEL | CONSENT_APP_EMAIL (EXT-B, sin fijar)

parametersRef:
  note: "Valores solo en SEC-CNS-006 rev. 5 §1; aquí únicamente la referencia."
  used: [P-10, P-11, P-12, P-31]

states:
  - id: DRAFT
    initial: true
    terminal: false
    description: "Creada por el inviter; sin token emitido."
    governedBy: ["SM-CNS-001 §2", "[N-SM] §2"]
    testIds: [TEST-CNS-120]
  - id: READY
    initial: false
    terminal: false
    description: "consentVersion, expiresAt y recipientBinding fijados."
    governedBy: ["SM-CNS-001 §2 I2"]
    testIds: [TEST-CNS-121]
  - id: SENT
    initial: false
    terminal: false
    description: "Token emitido y entregado; el token solo resuelve mientras no expire ni rote."
    governedBy: ["SM-CNS-001 §2 I3"]
    testIds: [TEST-CNS-122]
  - id: OPENED
    initial: false
    terminal: false
    description: "Primer POST del portador tras el canje del token (nunca un GET)."
    governedBy: ["SM-CNS-001 §2 I4", "SEC F23"]
    testIds: [TEST-CNS-124]
  - id: VERIFIED
    initial: false
    terminal: false
    description: "Canal del decisor verificado (V3 scope DECISION); verificar no es consentir."
    governedBy: ["SM-CNS-001 §2 I5, R0.8", "[N-SM] §2 'Verification success does not equal consent'"]
    testIds: [TEST-CNS-125]
  - id: COMPLETED
    initial: false
    terminal: true
    description: "Decisión GRANTED registrada (C3) en la misma tx."
    governedBy: ["SM-CNS-001 §2 I6", "[N-SM] §2"]
    testIds: [TEST-CNS-126]
  - id: DECLINED
    initial: false
    terminal: true
    description: "Decisión DECLINED registrada (C5) en la misma tx."
    governedBy: ["SM-CNS-001 §2 I7", "[N-SM] §2"]
    testIds: [TEST-CNS-127]
  - id: EXPIRED
    initial: false
    terminal: true
    description: "Hora de servidor >= expiresAt (P-10)."
    governedBy: ["SM-CNS-001 §2 I8", "SEC-CNS-006 P-10"]
    testIds: [TEST-CNS-129]
  - id: CANCELLED
    initial: false
    terminal: true
    description: "Cancelada con reasonCode de enum cerrado."
    governedBy: ["SM-CNS-001 §2 I9"]
    testIds: [TEST-CNS-130]

transitions:
  - id: I1
    from: null
    to: DRAFT
    command: CreateInvitation
    actor: {actorType: HUMAN, actorRole: INVITER}
    routeClass: ISSUANCE_DECISION
    httpPost: true
    guards: [GRD-CM-01, GRD-CM-02, GRD-CM-03, GRD-CM-04, GRD-CM-05, GRD-CM-07, GRD-CM-08, GRD-CM-10, GRD-IV-01, GRD-IV-02, GRD-IV-11, GRD-TC-07]
    effects:
      - "Crea el agregado Invitation con tenantRef del inviter (resuelto en servidor, nunca del cliente)."
      - "Si reissueOfRef está presente: reemisión sujeta a GRD-IV-11 (P-11)."
    emits: [INVITATION_CREATED]
    idempotencyKey: "(tenantRef, clientRequestId)"
    errors: [ERR-CM-01, ERR-CM-02, ERR-CM-03, ERR-CM-04, ERR-CM-05, ERR-CM-09, ERR-CM-10, ERR-IV-02, ERR-IV-07]
    governedBy: ["SM-CNS-001 §2 I1, R0.5 (ISSUANCE I1–I4)", "DEC-BR-016 §4", "DEC-BR-015:42", "AUDIT F-A06, F-A07"]
    testIds: [TEST-CNS-120, TEST-CNS-316, TEST-CNS-443]
  - id: I2
    from: DRAFT
    to: READY
    command: MarkInvitationReady
    actor: {actorType: HUMAN, actorRole: INVITER}
    routeClass: ISSUANCE_DECISION
    httpPost: true
    guards: [GRD-CM-01, GRD-CM-02, GRD-CM-05, GRD-CM-07, GRD-CM-10, GRD-IV-03]
    effects: ["Fija consentVersion, expiresAt y recipientBinding (+ recipientChannelRef si RECIPIENT_CHANNEL)."]
    emits: [INVITATION_READY]
    idempotencyKey: "(invitationRef, sequence)"
    errors: [ERR-CM-05, ERR-CM-09, ERR-IV-03]
    governedBy: ["SM-CNS-001 §2 I2, R0.5", "AUDIT F-A06"]
    testIds: [TEST-CNS-121, TEST-CNS-316]
  - id: I3
    from: READY
    to: SENT
    command: SendInvitation
    actor: {actorType: HUMAN, actorRole: INVITER, evaluatedBy: SYSTEM_GUARD}
    routeClass: ISSUANCE_DECISION
    httpPost: true
    guards: [GRD-CM-01, GRD-CM-02, GRD-CM-03, GRD-CM-04, GRD-CM-05, GRD-CM-07, GRD-CM-10, GRD-IV-04, GRD-IV-05, GRD-TC-07]
    effects:
      - "Genera token opaco (P-31), no JWT; persiste solo tokenHash en tenant_resolve.invitation_token."
      - "Encola la entrega por el adaptador de email de IT0 (sink/allowlist, DEC-BR-014 §4.2); ningún SMTP externo."
    emits: [INVITATION_SENT]
    idempotencyKey: "invitationRef"
    errors: [ERR-CM-03, ERR-CM-04, ERR-CM-05, ERR-CM-09, ERR-IV-04]
    governedBy: ["SM-CNS-001 §2 I3", "RULE-CNS-022", "DEC-BR-013", "SEC-CNS-006 P-31", "DEC-BR-014 §4, §6"]
    testIds: [TEST-CNS-122, TEST-CNS-437]
  - id: I3r
    from: SENT
    to: SENT
    command: ResendInvitation
    actor: {actorType: HUMAN, actorRole: INVITER}
    routeClass: ISSUANCE_DECISION
    httpPost: true
    guards: [GRD-CM-01, GRD-CM-02, GRD-CM-03, GRD-CM-04, GRD-CM-05, GRD-CM-07, GRD-CM-10, GRD-IV-04, GRD-IV-05, GRD-IV-06, GRD-TC-07]
    effects: ["Rota el token: el anterior deja de resolver (404 uniforme); invalida handles y sesiones derivados (P-30)."]
    emits: [INVITATION_TOKEN_ROTATED]
    idempotencyKey: "(invitationRef, rotationNo)"
    errors: [ERR-IV-05, ERR-IV-10, ERR-CM-09]
    governedBy: ["SM-CNS-001 §2 I3r", "DEC-BR-017 E-04", "SEC-CNS-006 P-11, P-30"]
    testIds: [TEST-CNS-123, TEST-CNS-437]
  - id: I4
    from: SENT
    to: OPENED
    command: OpenInvitation
    actor: {ref: UNVERIFIED_BEARER} # definición única en common (OPEN-CM-05)
    routeClass: ISSUANCE_DECISION
    httpPost: true
    guards: [GRD-CM-01, GRD-CM-02, GRD-CM-05, GRD-CM-10, GRD-IV-07, GRD-IV-08, GRD-IV-13, GRD-TC-07]
    effects:
      - "GET /i/{token}: backend valida hash y GRD-IV-13 (participación/Enrollment CLOSED o cancelación en cascada pendiente → 404 uniforme sin handle), crea handle LANDING (P-12), Set-Cookie y 303 a ruta sin token; el GET no transiciona (INV-CM-08)."
      - "El primer POST con el handle transiciona a OPENED."
    emits: [INVITATION_OPENED]
    idempotencyKey: "invitationRef (INVITATION_OPENED una sola vez)"
    errors: [ERR-IV-01, ERR-CM-05, ERR-CM-09]
    governedBy: ["SM-CNS-001 §2 I4, §2.2", "ADR-001 §2", "SEC F23", "SEC-CNS-006 P-12", "SEC-CNS-012 re-verificación rev. 4b (3)(iii)"]
    testIds: [TEST-CNS-124, TEST-CNS-437, TEST-CNS-451]
  - id: I5
    from: OPENED
    to: VERIFIED
    command: "(interno) resultado de V3 scope DECISION"
    actor: {actorType: SYSTEM_GUARD, triggeredBy: "otp-challenge V3"}
    routeClass: ISSUANCE_DECISION
    httpPost: false
    guards: [GRD-CM-02, GRD-IV-09]
    effects:
      - "Fija boundDecisionMakerRef; con RECIPIENT_CHANNEL exige channelRef = recipientChannelRef (M1)."
      - "Se escribe en el mismo lote atómico que DECISION_MAKER_CHANNEL_VERIFIED."
    emits: [INVITATION_VERIFIED]
    idempotencyKey: "(invitationRef, verificationRef)"
    errors: [ERR-IV-06]
    governedBy: ["SM-CNS-001 §2 I5, §2.1 M1, M4"]
    testIds: [TEST-CNS-125]
  - id: I6
    from: VERIFIED
    to: COMPLETED
    command: "(interno) consent-decision C3"
    actor: {actorType: HUMAN, actorRole: DECISION_MAKER}
    routeClass: ISSUANCE_DECISION
    httpPost: false
    guards: [GRD-CM-02]
    effects: ["Mismo lote atómico que C3; invalida sesión DECISION (padre terminal, P-30)."]
    emits: [INVITATION_COMPLETED]
    idempotencyKey: "consentId + payloadHash (el de C3)"
    errors: [ERR-CM-06]
    governedBy: ["SM-CNS-001 §2 I6, §4 C3"]
    testIds: [TEST-CNS-126]
  - id: I7
    from: VERIFIED
    to: DECLINED
    command: "(interno) consent-decision C5"
    actor: {actorType: HUMAN, actorRole: DECISION_MAKER}
    routeClass: ISSUANCE_DECISION
    httpPost: false
    guards: [GRD-CM-02]
    effects: ["Mismo lote atómico que C5; invalida sesión DECISION."]
    emits: [INVITATION_DECLINED]
    idempotencyKey: "consentId + payloadHash (el de C5)"
    errors: [ERR-CM-06]
    governedBy: ["SM-CNS-001 §2 I7, §4 C5"]
    testIds: [TEST-CNS-127]
  - id: I7u
    from: OPENED
    to: DECLINED
    command: DeclineWithoutVerification
    enabled: false
    disabledReason: "Deshabilitada en BETA_2026_01 (NF-03; decisión pendiente Q-15, owner Carlos). Todo intento → ERR-IV-08."
    actor: null
    routeClass: ISSUANCE_DECISION
    httpPost: true
    guards: [GRD-CM-10]
    effects: []
    emits: []
    idempotencyKey: null
    errors: [ERR-IV-08]
    governedBy: ["SM-CNS-001 §2 I7u, §11 NF-03", "DEC-BR-017 E-04"]
    testIds: [TEST-CNS-128]
  - id: I8
    from: [READY, SENT, OPENED, VERIFIED]
    to: EXPIRED
    command: "(sistema) expiración lazy al acceder + barrido programado"
    actor: {actorType: SYSTEM_GUARD}
    routeClass: ISSUANCE_DECISION
    httpPost: false
    guards: [GRD-IV-12, GRD-CM-12]
    effects: ["El token deja de resolver; invalida handles/sesiones (P-30); la ConsentDecision PENDING asociada queda 'abandoned' (NF-06)."]
    emits: [INVITATION_EXPIRED]
    idempotencyKey: "invitationRef"
    errors: []
    governedBy: ["SM-CNS-001 §2 I8, §4 (NF-06)", "SEC-CNS-006 P-10"]
    testIds: [TEST-CNS-129]
  - id: I9
    from: [DRAFT, READY, SENT, OPENED, VERIFIED]
    to: CANCELLED
    command: CancelInvitation
    actor:
      byReasonCode:
        INVITER_WITHDRAWN: {source: HUMAN, actorType: HUMAN, actorRole: INVITER}
        SUBJECT_MISMATCH_REPORTED: {source: HUMAN, actorType: HUMAN, actorRole: DECISION_MAKER, precondition: "verificado (EXT-C)"}
        CONTESTED_BY_RECIPIENT: {source: HUMAN, actorType: HUMAN, actorRole: DECISION_MAKER, enabled: false, disabledReason: "M3: credencial del enlace 'yo no hice esta decisión' y efecto sin definir (LD-01; AUDIT F-A13); ver consent-decision M3."}
        TOKEN_COMPROMISED: {source: HUMAN, actorType: HUMAN, actorRole: INVITER}
        PARTICIPATION_CLOSED: {source: SYSTEM, actorType: SYSTEM_GUARD, enabled: true, trigger: "tenant-context SP4, en la misma transacción (Q-18 opción A, R14-E); reintento por job CASCADE_CANCEL_INVITATION solo si falla (GRD-TC-08, OPEN-TC-07 DECIDED, DEC-BR-018)"}
        ENROLLMENT_CLOSED: {source: SYSTEM, actorType: SYSTEM_GUARD, enabled: true, trigger: "tenant-context EN1, en la misma transacción (Q-18 opción A, R14-E); reintento por job CASCADE_CANCEL_INVITATION solo si falla (GRD-TC-08, OPEN-TC-07 DECIDED, DEC-BR-018)"}
    routeClass: ISSUANCE_DECISION
    httpPost: true
    httpPostBySource: {HUMAN: true, SYSTEM: false}
    httpPostNote: "Solo para los reasonCodes con actor HUMAN; PARTICIPATION_CLOSED y ENROLLMENT_CLOSED son internos (SYSTEM_GUARD, en la tx de SP4/EN1)."
    guards: [GRD-CM-07, GRD-IV-10] # comunes
    guardsBySource: # SEC-CNS-012 re-verificación rev. 4 N2-01 (mismo defecto que RC1): la cascada no tiene credencial, sesión ni POST
      HUMAN: [GRD-CM-01, GRD-CM-02, GRD-CM-10]
      SYSTEM: [GRD-TC-08, GRD-CM-15] # tenant_id desde el registro cerrado; fuente = rol worker (tx de SP4/EN1 o job de reintento), nunca un reasonCode de la request (N3-01)
    effects:
      - "El token deja de resolver; invalida handles/sesiones (P-30)."
      - "Habilitados en IT0: INVITER_WITHDRAWN, SUBJECT_MISMATCH_REPORTED, TOKEN_COMPROMISED, PARTICIPATION_CLOSED y ENROLLMENT_CLOSED (R14-E). Deshabilitado: CONTESTED_BY_RECIPIENT (LD-01)."
      - "PARTICIPATION_CLOSED/ENROLLMENT_CLOSED: todas las invitaciones no terminales afectadas se cancelan en la misma transacción que SP4/EN1; ninguna ConsentDecision cambia y no se emite consent.revoked (INV-7)."
    emits: [INVITATION_CANCELLED]
    idempotencyKey: "(invitationRef, reasonCode)"
    errors: [ERR-IV-09, ERR-IV-10, ERR-CM-09, ERR-CM-10]
    governedBy: ["SM-CNS-001 §2 I9, §2.1 M3, §6", "DEC-BR-018 R14-E (Q-18 opción A)", "DEC-BR-017 E-04 (sin condición, derivado D-17)", "DEC-BR-018 (R14-E, Q-18 opcion A; A-09, A-19, A-35, A-36)", "SEC-CNS-012 re-verificación rev. 4 N2-01, N2-05"]
    testIds: [TEST-CNS-130, TEST-CNS-317, TEST-CNS-418, TEST-CNS-419, TEST-CNS-420, TEST-CNS-428, TEST-CNS-438, TEST-CNS-444, TEST-CNS-445, TEST-CNS-449, TEST-CNS-450]

guards:
  - id: GRD-IV-01
    name: single_non_terminal_invitation
    rule: "No existe otra Invitation no terminal para (tenantRef, contextRef, subjectRef)."
    status: "ACCEPTED como regla de SM-CNS-001 §2 I1 (subconjunto IT0). La marca [Q1] remite a la pregunta LD-20 (AUDIT-consistencia-3 §7: 'SM:230 Q1', cita de SM v4; en v7 la fila [Q1] es SM:32, I1; DEC-BR-005): si cambia, la regla se revisa. Es la regla más restrictiva (fail-closed)."
    onFail: ERR-IV-02
    governedBy: ["SM-CNS-001 §2 I1 [Q1]", "LD-20"]
    testIds: [TEST-CNS-120, TEST-CNS-132]
  - id: GRD-IV-02
    name: subject_belongs_to_tenant
    rule: "subjectRef y enrollmentRef pertenecen al tenant resuelto (lectura bajo RLS)."
    onFail: ERR-CM-01
    governedBy: ["SM-CNS-001 §2 I1", "ADR-006 §4"]
    testIds: [TEST-CNS-120]
  - id: GRD-IV-03
    name: ready_fields_fixed
    rule: "consentVersion, expiresAt y recipientBinding presentes y válidos (recipientChannelRef obligatorio si RECIPIENT_CHANNEL)."
    onFail: ERR-IV-03
    governedBy: ["SM-CNS-001 §2 I2"]
    testIds: [TEST-CNS-121]
  - id: GRD-IV-04
    name: version_and_mode_guards
    rule: "Guards (a)–(c) de la ConsentVersion en vigor (RULE-CNS-022) y (d) invitationMode = INSTITUTION_MEDIATED; nulo o desconocido falla cerrado."
    onFail: ERR-IV-04
    governedBy: ["SM-CNS-001 §2 I3", "[N-SM] §1 guards (a)–(d)", "DEC-BR-015:42", "RULE-CNS-022", "DEC-BR-013"]
    testIds: [TEST-CNS-122]
  - id: GRD-IV-05
    name: opaque_token
    rule: "Token al portador opaco con la entropía de P-31, CSPRNG, no JWT; solo el hash persiste; igualdad exacta al resolver."
    onFail: ERR-CM-08
    governedBy: ["SM-CNS-001 §2 I3", "SEC-CNS-006 P-31", "SEC F04", "DEC-BR-014 §6"]
    testIds: [TEST-CNS-122, TEST-CNS-133]
  - id: GRD-IV-06
    name: rotation_limit
    rule: "Número de rotaciones (I3r) dentro del límite de P-11; superarlo se rechaza."
    onFail: ERR-IV-05
    governedBy: ["SEC-CNS-006 P-11", "SM-CNS-001 §2.1 M5"]
    testIds: [TEST-CNS-123]
  - id: GRD-IV-07
    name: token_resolves_not_expired
    rule: "tokenHash resuelve por resolve_invitation (igualdad exacta) y la invitación no está expirada ni rotada; si no → 404 uniforme."
    onFail: ERR-IV-01
    governedBy: ["SM-CNS-001 §2 I4", "ADR-006 §6", "REQ-CNS-TBD-07 AC-07.1"]
    testIds: [TEST-CNS-124]
  - id: GRD-IV-08
    name: first_post_only
    rule: "Solo un POST con handle LANDING transiciona; GET nunca; INVITATION_OPENED se registra una vez."
    onFail: ERR-CM-06
    governedBy: ["SM-CNS-001 §2 I4, §7", "SEC F23"]
    testIds: [TEST-CNS-124, TEST-CNS-134]
  - id: GRD-IV-13
    name: landing_blocked_while_cascade_pending
    rule: "SEC-CNS-012 re-verificación rev. 4b (3)(iii): la resolución de GET /i/{token}, tras resolve_invitation y SET LOCAL, antes de crear el handle LANDING, comprueba que la participación y el Enrollment de la invitación no estén CLOSED y que no exista un ops.job CASCADE_CANCEL_INVITATION pendiente para esa invitación; si falla, 404 uniforme de ERR-IV-01 (mismo cuerpo, código y tiempo acotado que un token inexistente), sin handle, sin Set-Cookie y sin evento. El resto de fallas de GRD-CM-05 (contexto PAUSED, participación SUSPENDED) conserva el comportamiento actual (el POST I4 se rechaza con el error de GRD-CM-05). Parte de la desviación de GRD-TC-08 frente a R14-E, DECIDIDA por Carlos (OPEN-TC-07, DEC-BR-018 A-09): el guard es más restrictivo y se aplica en todo caso."
    onFail: ERR-IV-01
    decidedRef: "OPEN-TC-07 (DEC-BR-018, 2026-09-27)"
    governedBy: ["SEC-CNS-012 re-verificación rev. 4b (3)(iii)", "DEC-BR-018 (R14-E, OPEN-TC-07)", "REQ-CNS-TBD-07 AC-07.1", "SEC-CNS-006 P-12", "INV-CM-08"]
    testIds: [TEST-CNS-451]
  - id: GRD-IV-09
    name: channel_binding_and_single_decision_maker
    rule: "Verificación de esta invitación y tenant; con RECIPIENT_CHANNEL, channelRef = recipientChannelRef; un segundo I5 con otro decisor → respuesta genérica + M2."
    onFail: ERR-IV-06
    governedBy: ["SM-CNS-001 §2 I5, §2.1 M1, M2", "LD-21"]
    testIds: [TEST-CNS-125]
  - id: GRD-IV-10
    name: cancel_reason_and_actor
    rule: "reasonCode ∈ {INVITER_WITHDRAWN, SUBJECT_MISMATCH_REPORTED, CONTESTED_BY_RECIPIENT, TOKEN_COMPROMISED, PARTICIPATION_CLOSED, ENROLLMENT_CLOSED}, el actor corresponde al reasonCode (tabla de I9) y el reasonCode está habilitado en IT0; la invitación no es terminal."
    onFail: ERR-IV-09
    governedBy: ["SM-CNS-001 §2 I9"]
    testIds: [TEST-CNS-130]
  - id: GRD-IV-11
    name: reissue_limit
    rule: "Reemisiones (I1 con reissueOfRef) por (tenant, contexto, sujeto) dentro de P-11 sin revisión humana; sobre el límite, rechazo hasta revisión humana."
    onFail: ERR-IV-07
    governedBy: ["SEC-CNS-006 P-11", "SM-CNS-001 §2.1 M5"]
    testIds: [TEST-CNS-120, TEST-CNS-131]
  - id: GRD-IV-12
    name: expiry_by_server_time
    rule: "Hora de servidor >= expiresAt; expiresAt = SENT + P-10."
    onFail: null # guard de disparo: si no se cumple, no hay transición
    governedBy: ["SM-CNS-001 §2 I8", "SEC-CNS-006 P-10"]
    testIds: [TEST-CNS-129]

