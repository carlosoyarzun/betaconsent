      - {object: "platform.grant_request, platform.rights_case_grant, platform.case_verification", status: "PR-5"}
      - {object: "platform.issue_action_nonce, platform.request_grant, platform.approve_grant, platform.open_case_session, platform.open_platform_session, platform.validate_session, platform.revoke_session", status: "PR-3..PR-5"}
    grantsGiven: [{to: transition_owner, privileges: "SELECT de grants, aserciones, nonces y sesiones CASE/PLATFORM; INSERT/UPDATE por columnas de platform.case_verification", status: PR-5}]
    note: "Rev. 4 (Q-18): grant_owner YA NO es dueño de funciones de transición ni tiene INSERT en el ledger (reemplaza el P1-9 de rev. 3)."
    setRoleBy:
      - {member: consent_owner, inherit: false, set: true, modes: [IT0B_SYNTHETIC], status: "PR-2 (Q15 c)"}
      - {member: ddl_breakglass, inherit: false, set: true, modes: [REAL_DATA], status: PR-7}

  - id: transition_owner
    class: OWNER
    login: false
    attributes: "NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION"
    status: "DECIDIDO (Q-18, Carlos 2026-10-11). PR-2 rol; PR-5 funciones y grants"
    owns: [{object: "Todas las funciones SECURITY DEFINER de transición de revocation y rights_case en case_state: titular y escuela (EXECUTE app_rw), operador (EXECUTE rights_operator), aprobador (EXECUTE platform_rw) y SYSTEM (EXECUTE solo worker, GRD-CM-15); y, por la opción A de Carlos (2026-10-14, Q-18-I9, 0044), case_state.cancel_invitation_subject_mismatch (I9 de Invitation, EXECUTE solo app_rw)", status: PR-5}]
    grantsHeld:
      - "UPDATE/INSERT por columnas en app.revocation y app.rights_case (todas las de transición; el trigger acota por función)"
      - "INSERT en integrity.audit_event (único escritor de eventos Revocation, RightsCase y CONSENT_REVOKED)"
      - "INSERT en app.outbox; UPDATE(state) en app.consent_decision solo para C6; UPDATE(consumed_at) en app.recovery_token"
      - "0044 (Q-18-I9): SELECT(tenant_id, invitation_ref, state, bound_decision_maker_ref) y UPDATE(state) en app.invitation, con policies invitation_transition_select (tenant) e invitation_transition_update (USING state IN VERIFIED/CANCELLED; WITH CHECK state = CANCELLED); EXECUTE de app.is_reserved_email(text) (lo evalúa el CHECK de la fila)"
      - "EXECUTE de funciones de tenant_resolve; SELECT/INSERT/UPDATE por columnas en tablas de grant_owner (ver grant_owner.grantsGiven)"
    mustNot: ["Ser dueño de las tablas que escribe (case_state_owner y consent_owner lo son)", "Ser asumido por roles de runtime", "SQL dinámico en sus funciones"]
    setRoleBy:
      - {member: consent_owner, inherit: false, set: true, modes: [IT0B_SYNTHETIC], status: "PR-2 (Q15 c)"}
      - {member: ddl_breakglass, inherit: false, set: true, modes: [REAL_DATA], status: PR-7}
    verifiedBy: {newTests: ["TEST-CNS-TBD-DBR-11: todas las funciones de case_state son de transition_owner, SECURITY DEFINER, search_path fijo, sin EXECUTE PUBLIC; EXECUTE exacto por rol (PR-5)"]}

  - id: case_state_owner
    class: OWNER
    login: false
    status: "PR-2 (rol); PR-5 (CREATE SCHEMA case_state AUTHORIZATION case_state_owner, para las funciones); PR-7 (ALTER TABLE app.revocation / app.rights_case SET SCHEMA case_state, Q16)"
    note: "Mientras las tablas sigan en app (dueño consent_owner), FN-6 sigue abierto y solo lo detecta la conciliación del verifier."
    setRoleBy:
      - {member: consent_owner, inherit: false, set: true, modes: [IT0B_SYNTHETIC], status: "PR-2 (Q15 c)"}
      - {member: ddl_breakglass, inherit: false, set: true, modes: [REAL_DATA], status: PR-7}

  - id: breakglass_log_owner
    class: OWNER
    login: false
    status: "PR-7 (rol y esquema breakglass, tabla breakglass.ceremony append-only ENABLE ALWAYS, sin tenant_id, sin purga; N5)"
    setRoleBy: []   # nadie, nunca: escribe el superusuario dentro de la ceremonia (§4.1.1)
    verifiedBy: {postClusterAssertion: "pg_auth_members sin filas con roleid = breakglass_log_owner (ambos modos)"}

  - id: db_owner_nologin
    class: OWNER
    login: false
    status: "PR-7 (rol + ALTER DATABASE … OWNER TO db_owner_nologin; §4.5.2)"
    setRoleBy: []
    verifiedBy: {postClusterAssertion: "datdba = db_owner_nologin; nadie miembro"}

  # ---------------------------------------------------------------- break-glass
  - id: ddl_breakglass
    class: BREAKGLASS
    login: "false por defecto; LOGIN PASSWORD <nueva> VALID UNTIL <= P-46 solo durante la ceremonia (lo abre el superusuario)"
    status: "PR-7"
    memberOf:
      - {roles: [integrity_owner, security_event_owner, tenant_resolve_owner, staff_roster_owner, outbox_claimer, platform_schema_owner, grant_owner, membership_owner, case_state_owner, transition_owner], inherit: false, set: true, note: "Q-19 (DECIDIDO)"}
    pgHba: "host <db> ddl_breakglass 127.0.0.1/32 scram-sha-256; sin línea peer ni cert"
    sessionAudit: "Q-20 (c), DECIDIDO: ALTER ROLE ddl_breakglass SET log_statement = 'all' y log_connections/log_disconnections activos; logs fuera del host (TP-08); el verifier alerta si rolcanlogin = true o hay sesiones de ddl_breakglass fuera de una ceremonia abierta. Sin event trigger."
    close: "ALTER ROLE ddl_breakglass NOLOGIN; pg_terminate_backend de sus sesiones; contraseña aleatoria descartada"
    evidence: "breakglass.ceremony (secundario) + checkpoint firmado del ancla antes y después (primario, Q13) + log de la sesión auditada"
    verifiedBy: {newTests: ["TEST-CNS-TBD-DBR-08: ensayo de ceremonia con evidencia (PR-7)", "TEST-CNS-TBD-DBR-12: el catálogo de ddl_breakglass tiene log_statement = 'all' (pg_db_role_setting) y NOLOGIN fuera de ceremonia (PR-7)"]}

membershipAssertion:   # ADR-010 §4.1.1 (Q-19); runner (posterior al cluster, migrate.ts) + startup-checks; igualdad EXACTA, fail-closed
  id: INV-DBR-03
  status: "PR-2 (mecanismo, lista IT0B y check en startup-checks); PR-7 (integrity_owner fuera de la lista y modo REAL_DATA)"
  IT0B_SYNTHETIC:
    - "consent_migrator -> consent_owner {inherit: true, set: true}"
    - "consent_migrator -> outbox_claimer {inherit: false, set: true}"
    - "consent_owner -> tenant_resolve_owner | staff_roster_owner | security_event_owner | platform_schema_owner | grant_owner | membership_owner | case_state_owner | transition_owner {inherit: false, set: true}"
    - "consent_owner -> integrity_owner {inherit: false, set: true}  # solo hasta PR-7"
    - "app_rw -> staff_roster_reader {inherit: false, set: true}"
    - "platform_rw -> rights_operator {inherit: false, set: true}  # desde PR-5"
    - "ddl_breakglass -> <los 10 owners de §4.1.1> {inherit: false, set: true}  # desde PR-7"
  REAL_DATA:
    - "consent_migrator -> consent_owner {inherit: true, set: true}"
    - "consent_owner -> (ningún owner de §4.1.1); consent_migrator -> (ninguno salvo consent_owner)"
    - "app_rw -> staff_roster_reader {inherit: false, set: true}"
    - "platform_rw -> rights_operator {inherit: false, set: true}"
    - "ddl_breakglass -> <los 10 owners de §4.1.1> {inherit: false, set: true}"
    - "breakglass_log_owner, db_owner_nologin: sin miembros"
  rule: "Cualquier fila extra o faltante en pg_auth_members para estos roles aborta el deploy y el arranque."

ledgerWriter:   # ADR-010 rev. 5 §4.2.b, PR-b (0046-0049); LG-1..LG-10, F-PR6-22/23/28/30
  roles:
    - {name: ledger_gen_owner, attrs: "NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION", owns: "esquema ledger_gen", members: "solo consent_owner con SET sin INHERIT en IT0B_SYNTHETIC (0046); en REAL_DATA solo ddl_breakglass (PR-7)"}
    - {name: ledger_writer, attrs: "igual", owns: "funciones ledger_gen.{canonical_json,ledger_append,guard_*,emit_*,seed_local_catalog_event}", members: "mismo patron; ningun proceso de runtime es miembro (directo ni transitivo)"}
  privileges:
    - {object: integrity.audit_event, privileges: ["SELECT", "INSERT(las mismas columnas que transition_owner)"], policies: "audit_event_ledger_select (tenant) y audit_event_ledger_insert (tenant + los 19 pares de ledger_writer)"}
    - {object: "tenant_resolve.handle", privileges: ["SELECT(tenant_id, revoked_decision_ref, rotated_at)"], note: "F-PRB-01: nunca handle_hash. Va a revision de seguridad."}
    - {object: "app.*", privileges: [], note: "Sin SELECT/UPDATE sobre tablas de app: las guardas BEFORE son SECURITY INVOKER (leen con el rol que escribe) y las emisiones AFTER leen OLD/NEW."}
  pairs:
    ledger_writer: ["Enrollment:ENROLLMENT_STATUS_CHANGED", "Invitation:{INVITATION_CREATED,READY,SENT,OPENED,VERIFIED,COMPLETED,DECLINED}", "DecisionMakerVerification:DECISION_MAKER_CHANNEL_VERIFIED", "ConsentDecision:{CONTEXT_INFORMATION_VIEWED,CONSENT_VERSION_VIEWED,DECISION_MAKER_AUTHORITY_DECLARED,SUBJECT_CONFIRMED,PURPOSE_DECISION_RECORDED,CONSENT_GRANTED,CONSENT_DECLINED,RECEIPT_CREATED}", "Tenant:TENANT_SEEDED", "SchoolParticipation:SCHOOL_PARTICIPATION_SEEDED"]
    transition_owner: ["Revocation:{REVOCATION_REQUESTED,VERIFIED,CONFIRMED,CONSENT_REVOKED,RECEIPT_CREATED,REVOCATION_DOWNSTREAM_EMITTED,REVOCATION_DELIVERED,DOWNSTREAM_ERASURE_ATTESTED,REVOCATION_FAILED,REVOCATION_PROPOSAL_WITHDRAWN}", "RightsCase:{RIGHTS_CASE_OPENED,CONTACTING,CLOSED}", "Invitation:INVITATION_CANCELLED"]
    app_rw: []
    rule: "Los conjuntos de ledger_writer (19) y transition_owner (14) son DISJUNTOS (union 33); lo asertan 0047, 0048 y 0049 y lo prueba TEST-CNS-1387. audit_event_transition_insert restringe su WITH CHECK a los 14 pares (0037:90-91 solo filtraba por tenant)."
  emission: "Triggers AFTER ROW ENABLE ALWAYS (SECURITY DEFINER de ledger_writer) sobre app.enrollment, app.otp_verification, app.invitation y app.consent_decision; emiten SOLO por la tabla OLD->NEW de specs/ledger-derivation.spec.yaml, sin depender de current_user ni de case_state.effect, con NEW.tenant_id = app.current_tenant_id()."
  guards: "Triggers BEFORE (SECURITY INVOKER, sin lock de ledger, 42501 uniforme sin valores): estado inicial fijo, grafo completo, campos inmutables, cruces entre filas (consistencia, NO autenticidad). bound_decision_maker_ref solo se escribe en la arista I5 y es inmutable desde VERIFIED (F-PR6-23). La arista I9 (* -> CANCELLED) es 'permitida sin emision de ledger_writer; emisor transition_owner (Q-18-I9)'; C6 (GRANTED -> REVOKED) igual, solo con una Revocation CONFIRMED del tenant."
  seed: "ledger_gen.seed_local_catalog_event(p_event_type, p_aggregate_id): unica funcion de ledger_gen con EXECUTE de app_rw; entorno LOCAL leido de ops.db_catalog, actor FIXTURE, payload constante {} (LG-4, F-PR6-28)."
  locks: "El lock de ledger por tenant (pg_advisory_xact_lock 'ledger-chain:<tenant>') se toma solo dentro de ledger_append y solo si hay evento (LG-6). Orden global: invitacion -> otp_verification | consent_decision -> ledger. La secuencia por agregado es max+1 en ambos ledger_append (ledger_gen y case_state): unica por (tenant, aggregate_id) (F-PR6-30)."
  tests: [TEST-CNS-1387, TEST-CNS-1440, TEST-CNS-1455, TEST-CNS-1456, TEST-CNS-1457, TEST-CNS-1458, TEST-CNS-1459, TEST-CNS-1460, TEST-CNS-1461, TEST-CNS-1462, TEST-CNS-1463, TEST-CNS-1464]
  residual: "capa 1 NO autentica (F-A10-30-S0, F-PR6-23): el GUC de tenant es libre (0001:33-38), app_rw escribe state/code_hash y el seudonimo del apoderado; cierre solo con la capa 2, opcion C (G-11), P0 antes de datos reales."

invariants:
  - {id: INV-DBR-01, statement: "Ningún rol de runtime (app_rw, platform_rw, worker, integrity_verifier) es superusuario, BYPASSRLS, miembro de un owner, ni tiene CREATE en ningún esquema.", status: "MAIN para 3 roles (startup-checks.ts:79-117); PR-2 suma integrity_verifier, outbox_claimer y los owners nuevos", testIds: [TEST-CNS-744, TEST-CNS-747]}
  - {id: INV-DBR-02, statement: "Cada proceso arranca solo con su rol exacto (expectedRole): web=app_rw, platform=platform_rw, worker=worker, verifier=integrity_verifier.", status: "MAIN solo web (F6); PR-6 el resto", testIds: [TEST-CNS-884]}
  - {id: INV-DBR-03, statement: "La membresía real coincide exactamente con membershipAssertion del modo declarado (runner y startup-checks).", status: "PR-2/PR-7 (Q-19)", testIds: [TEST-CNS-TBD-DBR-07]}
  - {id: INV-DBR-04, statement: "Toda transición de app.revocation y app.rights_case ocurre dentro de una función SECURITY DEFINER de transition_owner; ningún rol de runtime tiene INSERT/UPDATE directo. Q-18-I9 (opción A, 2026-10-14, 0044): también la transición I9 de app.invitation (state = CANCELLED) solo ocurre dentro de case_state.cancel_invitation_subject_mismatch; las policies de app_rw sobre app.invitation (INSERT/UPDATE con state <> 'CANCELLED', USING incluido) impiden que app_rw deje o des-cancele CANCELLED.", status: PR-5, testIds: [TEST-CNS-TBD-DBR-01]}
  - {id: INV-DBR-05, statement: "verified_recovery_method = HUMAN_ASSISTED, columnas RH2, attested_*, recorded_by_ref y cosigned_by_ref solo se escriben con current_user = transition_owner y case_state.effect = la función de efecto que las declara (trigger ENABLE ALWAYS).", status: PR-5, testIds: [TEST-CNS-TBD-RV-DB-01]}
  - {id: INV-DBR-06, statement: "Las funciones SYSTEM no tienen EXECUTE para PUBLIC, app_rw, platform_rw ni integrity_verifier (GRD-CM-15).", status: "MAIN como regla de spec (TEST-CNS-444); PR-5 para las funciones nuevas", testIds: [TEST-CNS-444]}
  - {id: INV-DBR-07, statement: "ADR-010 rev. 5 PR-b (0046-0049): solo ledger_writer (emision derivada de la fila OLD->NEW, pares disjuntos) y transition_owner (FN-RV/FN-RC y la transicion I9 de Invitation por Q-18-I9) hacen append en integrity.audit_event; app_rw NO tiene INSERT ni policy de INSERT, y ninguna via alcanzable por app_rw lleva un payload elegido por el llamador salvo las funciones case_state de transicion (payload fijo o derivado de filas) y la siembra LOCAL de payload constante {}. Historico: PR-a (0041) bajo la allowlist de app_rw de 24 a 19 pares y case_state.ledger_append hace dedupe estricto (RV002); 0047/0048 la bajaron a 17 y 10; 0049 retiro la policy audit_event_tenant_insert y el INSERT por columnas.", status: "PR-b 0046-0049 (ADR-010 rev. 5, aceptada 2026-10-15)", testIds: [TEST-CNS-1387, TEST-CNS-1440, TEST-CNS-1441, TEST-CNS-1442, TEST-CNS-1455, TEST-CNS-1459, TEST-CNS-1461]}
  - {id: INV-DBR-08, statement: "El verifier concilia en cada corrida estado de filas <-> eventos del ledger en ambos sentidos (fila sin evento, evento sin fila, valores distintos), incluido consent_decision REVOKED <-> CONSENT_REVOKED, y lo deja en el checkpoint.", status: PR-5, testIds: [TEST-CNS-TBD-DBR-09]}
  - {id: INV-DBR-09, statement: "En REAL_DATA, ddl_breakglass es NOLOGIN fuera de ceremonia, tiene log_statement = 'all' y es el único miembro SET de los owners de §4.1.1.", status: "PR-7 (Q-20 c)", testIds: [TEST-CNS-TBD-DBR-12]}

residuals:
  - {id: R-22 / F-X8-11, text: "consent_owner (y el migrador) puede asumir integrity_owner (SET ROLE) y controlar el ledger; consent_owner es datdba.", acceptedFor: IT0_SYNTHETIC, closesIn: "PR-7 (revoke, db_owner_nologin, ancla); reduce, no cierra (ADR-010 §5)"}
  - {id: R-21-1 (F-2), text: "consent_owner es dueño del esquema ops y puede DROP de tablas de ops aunque cambie el dueño de la tabla (0028:14-15, 0029:13).", acceptedFor: IT0B_SYNTHETIC, closesIn: "OPEN: Q-20 no lo cubre; revisar antes de datos reales (ADR-010 §4.5, OI-DBR-08)"}
  - id: "R-21-2 (= R-23 propuesto en el registro de riesgos)"
    text: "Quien pueda asumir security_event_owner (SET ROLE) puede borrar sin dejar rastro: DISABLE TRIGGER, NO FORCE ROW LEVEL SECURITY, DROP POLICY o DROP TABLE sobre security_event / retention_policy / purge_run / otp_budget; bajar la retención y con ello borrar OTP activos (incluido el lockout de app.otp_verification); o borrar otp_verification vencidas sin purge_run (0031:17-22, 0033:16)."
    acceptedFor: "IT0B_SYNTHETIC; pasa a P1 antes de datos reales"
    closesIn: "PR-7, mecanismo (c) DECIDIDO (Q-20): (1) en REAL_DATA nadie tiene SET sobre security_event_owner salvo ddl_breakglass (NOLOGIN fuera de ceremonia); (2) auditoría de sesiones de ddl_breakglass (log_statement = 'all', conexiones y desconexiones, logs fuera del host, alerta del verifier). SIN event trigger. 0031:18-19 y db/README.md:90 prometían un event trigger: 0031 no se edita, db/README.md se corrige."
    remaining: "El superusuario y root (R-16/R-03) siguen pudiendo borrar sin rastro en ops.*, que no está anclado; se cierra con Q1 opción C."
  - {id: FN-4, text: "La base no impone las máquinas de estado; app_rw escribe HUMAN_ASSISTED/RH2/sesiones CASE.", acceptedFor: "IT0 sintético vía R-10", closesIn: PR-5}
  - {id: FN-6, text: "consent_owner es dueño del esquema app y de app.revocation/app.rights_case: puede DISABLE TRIGGER o DROP y fabricar HUMAN_ASSISTED/RH2/RH3.", acceptedFor: "IT0B_SYNTHETIC (detecta la conciliación)", closesIn: "PR-7 (Q16, SET SCHEMA case_state); P0 si llegara a datos reales sin Q16"}
  - {id: RES-OTP-WEB, text: "web controla la vía OTP del titular (app.otp_verification, 0010:162; 0032): un RCE en web puede completar una revocación por OTP.", acceptedFor: "Por diseño del spec (ADR-010 §4.2)", closesIn: "No se cierra; mitigan SEC-CNS-021 (presupuesto) y el ledger"}
  - {id: RES-OTP-WEB-PRB, text: "ADR-010 rev. 5 (F-A10-30-S0 ampliado, F-PR6-23): con app.tenant_id como GUC libre, sin prueba de token ni de codigo en la base, app_rw escribiendo state/code_hash y el decision_maker_ref de I9 por parametro, un RCE en web puede (1) llevar a GRANTED cualquier invitacion SENT de cualquier tenant, (2) forzar una revocacion por OTP o por recovery token (con R4 en linea queda APPLIED en la misma tx) y (3) cancelar cualquier invitacion VERIFIED por I9 (atribucion falsificada HUMAN/DECISION_MAKER). La capa 1 (ledger derivado) lo registraria como fiel.", acceptedFor: "IT0 sintetico (P1)", closesIn: "capa 2, opcion C (G-11): P0 antes de datos reales; la opcion E (aceptacion escrita) queda eliminada"}
  - {id: RES-STAFF-WEB, text: "Q-17: sesiones STAFF en web con DML de app_rw y RLS. Un RCE en web puede fabricar una sesión STAFF de su tenant y actuar como TENANT_ADMIN/INVITER (invitaciones, matrículas, RC0). No alcanza efectos de revocación ni sesiones CASE. N7 (login ATTESTED) queda solo para CASE/PLATFORM hasta APR-IDP.", acceptedFor: "IT0B_SYNTHETIC (consecuencia de Q-17, a declarar en ADR-010 §5)", closesIn: "Re-evaluar con APR-IDP antes de datos reales"}
  - {id: "R-16 / R-03", text: "root obtiene superusuario por peer en el host único (Q2).", acceptedFor: "IT0b sintético/datos del equipo", closesIn: "Opción C antes de datos de titulares (Q1)"}

