    governedBy: ["SM-CNS-001 R0.3, §4.1 (4)", "MP §29"]
    testIds: [TEST-CNS-118]
  - id: ERR-CM-09
    code: CSRF_REJECTED
    response: "Rechazo sin efecto (POST sin CSRF, Origin ajeno, de otra consola o con sufijo parecido)"
    emitsEvent: none
    governedBy: ["SEC-CNS-005 T-03, T-04", "SEC-CNS-006 P-26"]
    testIds: [TEST-CNS-119]
  - id: ERR-CM-10
    code: ACTOR_NOT_ALLOWED
