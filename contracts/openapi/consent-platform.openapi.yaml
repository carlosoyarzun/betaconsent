openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Consent App - API HTTP del proceso platform (esqueleto)
  version: 0.0.1-outline
  x-api-id: API-CNS-TBD-P00
  x-status: OUTLINE
  x-it0-only: IT0b
  x-data-class: SYNTHETIC_ONLY
  x-governed-by:
    - "ADR-010 rev. 4 §4.1, §4.3, §4.4, §4.6 (PR-3 a PR-6)"
    - specs/db-roles.spec.yaml
    - specs/session.spec.yaml
    - "Q-17 (a), Carlos 2026-10-11: la consola STAFF del colegio (/staff/*) NO se mueve; sigue en consent-it0.openapi.yaml, servida por web con app_rw y RLS por tenant"
  x-human-gate: "Ningun contrato esta aprobado; cierre = human gate de Carlos."
  description: |
    Esqueleto: solo paths, scopes y estado de entrega. Los schemas completos se escriben en PR-3 a PR-5.
    Cubre solo al equipo de LectorPro (sesiones CASE y PLATFORM) en el proceso `platform`, sin egress. El verifier no expone HTTP.

    Operaciones movidas desde consent-it0.openapi.yaml conservan su `x-api-id`; alli quedan con `x-moved-to`.
    Las operaciones nuevas usan `API-CNS-TBD-Pnn` (rango 100-199 sin reconciliar con Notion, OPEN-CT-04).

    Reglas transversales (heredadas de API-CNS-100):
    - Cero PII en path y query.
    - Todo POST exige CSRF + Origin exacto (GRD-CM-10).
    - Ningun GET transiciona (INV-CM-08).
    - El actor se toma de la sesion, nunca del body.
    - Respuestas 404 uniformes.
    - Indisponibilidad de la base (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida): 503 uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, nunca 404 (ADR-010 PR-7a, F-PR7-10); 404 queda para recursos no validos o ajenos y para errores que no son de indisponibilidad.
    - Excepcion de tenantRef (F-A10-07; decision de Carlos 2026-10-11 (4)): API-CNS-100 dice "ningun request acepta tenantRef". La excepcion aplica SOLO en esta API del proceso `platform` (equipo de LectorPro, clase PLATFORM con step-up): el aprovisionamiento de membership (Q4) y de role-assignment (cross-tenant) necesita el tenant destino. La via web (consola STAFF, app_rw, `POST /staff/membership-requests` en consent-it0) NO lo acepta: lo deriva de la sesion STAFF.
    - Nadie aprueba su propio acceso (decision de Carlos 2026-10-11 (6)): la aprobacion de una membership o de un rol exige un aprobador distinto del solicitante Y distinto del principal que recibe el acceso; la base lo impone (CHECK approved_by_ref <> principal_ref y reason_code SELF_ACCESS). Un DENY responde un error generico uniforme: el motivo queda en platform.authorization_check, no en la respuesta (F-A10-13).
    - Enums de rol fijos (decision de Carlos 2026-10-11 (2)): membership TENANT_ADMIN | INVITER; plataforma PLATFORM | RIGHTS_OPERATOR | APPROVER (clase PRIVACY_LEGAL | SECURITY) | CONTEXT_OWNER. `principalRef` es un UUIDv4 opaco.

    Extensiones por operacion: `x-session`, `x-roles`, `x-step-up` (accion del nonce, P-36), `x-db-role`, `x-db-function` (las de case_state.* son de transition_owner, Q-18; las de platform.*, de grant_owner o membership_owner), `x-authorize` (platform.authorize(), 4.6; por definir), `x-delivery` (PR de entrega).
  x-pending:
    - "OPEN-CT-04: rango API-CNS reconciliar con Notion."
    - "F-A10-07: excepcion tenantRef para la clase PLATFORM — decidida por Carlos el 2026-10-11 (4): solo en esta API; falta revision de lampone-security."
    - "P-26 / APR-IDP: nombres de cookie y parametros del IdP pendientes (PENDING - Carlos / studio)."
  x-not-exposed:
    - "Canje del code, ATTESTED/REJECTED, checkpoints y alertas de break-glass: proceso verifier, sin HTTP."
    - "Bootstrap y re-bootstrap de principals PLATFORM (Q10): LOCAL = fixture sintetico (db/fixtures/local/0002_platform_bootstrap.sql, decision de Carlos 2026-10-11 (3)); STAGING y datos reales = ceremonia de break-glass de PR-7, no implementada."
    - "Vinculo principal_ref <-> sub_hmac (platform.principal_identity): sin operacion HTTP; fuera de LOCAL queda pendiente (OI-DBR-09 de specs/db-roles.spec.yaml)."
    - "platform.record_assertion, platform.record_login_assertion, claim_oidc_exchange y purge_expired_oidc_exchange: las ejecutan el verifier y el worker; platform solo inicia y completa con platform.begin_oidc_authorization / complete_oidc_callback (sin SELECT sobre la cola; enqueue_oidc_exchange se retiro en 0051)."
    - "Funciones SYSTEM (R4-R7, R9+RC1, RC2+RV0): las ejecuta worker."
    - "R8h y RC1c: deshabilitadas (LEGAL DECISION LD-03/LD-04)."
  x-stays-in-it0: "/i/, /m/, /r/, /invitation/open, /otp/*, /decision/*, /manage/revocation*, /manage/recovery-link, /recovery/revoke, /rights-case/*, y toda la consola STAFF (/staff/*; staffSession, RLS por tenant). Solicitud de membership de un TENANT_ADMIN: ruta nueva POST /staff/membership-requests en consent-it0 (fuera de este PR); la aprobacion es siempre la operacion approveMembership."
servers:
  - url: https://platform.invalid
    description: placeholder; sin host real
tags:
  - name: platform
paths:
  /platform/auth/login:
    get:
      operationId: platformAuthLogin
      x-api-id: API-CNS-TBD-P01
      tags: [platform]
      summary: "platformAuthLogin - Query kind={CASE|PLATFORM} (+ caseRef si kind=CASE). 302 al IdP (code + PKCE S256, scope openid, max_age=0 y prompt=login: reautenticacion obligatoria, G-5) y cookie `state` (SameSite=Lax)."
      description: |
        ADR-010 rev. 5 §5.2 (PR-6b). Sin sesion previa (kind=PLATFORM): el principal NO existe todavia; la base lo resuelve por sub_hmac en el callback.
        kind=CASE exige sesion PLATFORM vigente (cookie `platformSession`, validada EN LA BASE; F-PR6-36) y `caseRef` destino (se envia solo su sha256 como target_ref_hash; F-PR6-27, G-7). Entregado en PR-6c. Aplica P-50.
        Limite P-49 (por IP truncada, en memoria, sin persistir) y tope global P-53. Excedidos: 404 uniforme.
      x-roles: "none"
      x-step-up: "LOGIN_<kind>"
      x-db-role: "platform_rw"
      x-db-function: "platform.begin_oidc_authorization"
      x-delivery: "PR-6b (kind=PLATFORM); PR-6c (kind=CASE, entregado)"
      parameters:
        - {name: kind, in: query, required: true, schema: {type: string, enum: [PLATFORM, CASE]}}
        - {name: caseRef, in: query, required: false, description: "Solo kind=CASE (PR-6c): case_ref destino; la base guarda sha256(caseRef) como target_ref_hash.", schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/auth/callback:
    get:
      operationId: platformAuthCallback
      x-api-id: API-CNS-TBD-P02
      tags: [platform]
      summary: "platformAuthCallback - Compara la cookie `state` con el query en tiempo constante; platform.complete_oidc_callback (AWAITING_CALLBACK a PENDING); 303 a una ruta sin code ni ref y Referrer-Policy no-referrer."
      description: |
        G-8 (Carlos, 2026-10-15): el `exchangeRef` NUNCA va en la URL. Se entrega solo en la cookie `__Host-` (HttpOnly, Secure, SameSite=Strict) `oidcExchange`. No se acepta en cuerpo, headers ni parametros.
        Si `state` falta, es ajeno, esta reusado o vencido: no se encola nada y se responde 404 uniforme (cuenta para P-49).
      x-session: oidcState
      x-roles: "none"
      x-step-up: "none"
      x-db-role: "platform_rw"
      x-db-function: "platform.complete_oidc_callback"
      x-delivery: "PR-6b"
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      security: [{oidcState: []}]
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/auth/continue:
    get:
      operationId: platformAuthContinue
      x-api-id: API-CNS-TBD-P01c
      tags: [platform]
      summary: "platformAuthContinue - Destino del 303 del callback (sin code ni ref en la URL). Marcador de PR-6b; la pagina que abre la sesion PLATFORM llega en PR-6c."
      x-roles: "none"
      x-step-up: "none"
      x-db-role: "platform_rw"
      x-db-function: "(ninguna)"
      x-delivery: "PR-6b (marcador); PR-6c (UI y open_platform_session)"
      responses:
        '200':
          description: "{status: login_in_progress}. Cache-Control no-store, Referrer-Policy no-referrer."
        '404':
          description: Respuesta uniforme (origen fuera de la allowlist).
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/auth/exchange:
    get:
      operationId: platformAuthExchangeStatus
      x-api-id: API-CNS-TBD-P03
      tags: [platform]
      summary: "platformAuthExchangeStatus - Estado de la solicitud (AWAITING_CALLBACK/PENDING/ATTESTED/REJECTED), sin code ni claims. Sin parametros: el exchangeRef sale SOLO de la cookie `oidcExchange` (G-8)."
      description: |
        Cambio de contrato (G-8): antes `/platform/auth/exchanges/{exchangeRef}`. Ahora la ruta no lleva la ref en la URL; se exigen ambas cookies (`oidcState` y `oidcExchange`) y la base verifica sha256(state) = state_hash.
      x-session: oidcState
      x-roles: "none"
      x-step-up: "none"
      x-db-role: "platform_rw"
      x-db-function: "platform.exchange_status"
      x-delivery: "PR-6b"
      security: [{oidcState: [], oidcExchange: []}]
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/sessions/platform:
    post:
      operationId: openPlatformSession
      x-api-id: API-CNS-TBD-P04
      tags: [platform]
      summary: "openPlatformSession - Consume la asercion LOGIN_PLATFORM (cookies oidcState + oidcExchange) en la misma tx que crea la sesion. Origin = mismo origen. 200 sin sid en el cuerpo; Set-Cookie platformSession (Strict) y borra oidcState y oidcExchange."
      x-session: oidcState
      x-roles: "PRIVACY_LEGAL, SECURITY, CONTEXT_OWNER, RIGHTS_OPERATOR (OPEN-TC-06, OI-DBR-06)"
      x-step-up: "LOGIN_PLATFORM"
      x-db-role: "platform_rw"
      x-db-function: "platform.open_platform_session"
      x-delivery: "PR-6c"
      security: [{oidcState: []}]
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/sessions/case:
    post:
      operationId: openCaseSession
      x-api-id: API-CNS-TBD-P05
      tags: [platform]
      summary: "openCaseSession - Body {caseRef}. Requiere sesion PLATFORM vigente del mismo principal, asercion LOGIN_CASE ligada al caso, RIGHTS_OPERATOR y grant atestado vigente. Origin = mismo origen. Set-Cookie caseSession (Strict). P-50."
      x-session: platformSession
      x-roles: "RIGHTS_OPERATOR"
      x-step-up: "LOGIN_CASE"
      x-db-role: "platform_rw"
      x-db-function: "platform.open_case_session"
      x-delivery: "PR-6c (F-PR6-40: sin grants no abre sesion)"
      security: [{platformSession: []}]
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/case-session/logout:
    post:
      operationId: caseSessionLogout
      x-api-id: API-CNS-193
      tags: [platform]
      summary: "caseSessionLogout - Movido desde consent-it0."
      x-session: caseSession
      x-roles: "any"
      x-step-up: "none"
      x-db-role: "platform_rw"
      x-db-function: "platform.revoke_session"
      x-delivery: "PR-5"
      x-moved-from: consent-it0.openapi.yaml
      security: [{caseSession: []}]
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/logout:
    post:
      operationId: platformLogout
      x-api-id: API-CNS-TBD-P06
      tags: [platform]
      summary: "platformLogout"
      x-session: platformSession
      x-roles: "any"
      x-step-up: "none"
      x-db-role: "platform_rw"
      x-db-function: "platform.revoke_session"
      x-delivery: "PR-5"
      security: [{platformSession: []}]
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/step-up:
    post:
      operationId: issueStepUp
      x-api-id: API-CNS-TBD-P07
      tags: [platform]
      summary: "issueStepUp - Sesion platformSession (P-36, 4.3.1, Q11). PR-6d parte 1: acciones REQUEST_GRANT y APPROVE_GRANT. Body {action, targetRef} (REQUEST_GRANT: caseRef; APPROVE_GRANT: grantRequestRef; PROPOSE_/APPROVE_/WITHDRAW_CASE_VERIFICATION: targetRef = proposalRef MAS caseRef obligatorio; el step-up queda ligado a (caseRef, proposalRef), P2-6). El principal sale de la sesion validada en la base, NUNCA de la request. Origin = mismo origen. P-50. P-51 (5 / 10 min) en la base."
      x-session: platformSession
      x-roles: "RIGHTS_OPERATOR (REQUEST_GRANT, PROPOSE_CASE_VERIFICATION, WITHDRAW_CASE_VERIFICATION), APPROVER (APPROVE_GRANT, APPROVE_CASE_VERIFICATION)"
      x-step-up: "(body: action + destino opaco; 303 al IdP con max_age=0 + prompt=login y el nonce emitido por la base, ligado a operador, accion y sha256(destino))"
      x-db-role: "platform_rw"
      x-db-function: "platform.issue_step_up_nonce + platform.begin_oidc_authorization(STEP_UP)"
      x-delivery: "PR-6d parte 1 (REQUEST_GRANT, APPROVE_GRANT); 6d parte 2 (acciones de RH2)"
      security: [{platformSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, targetRef]
              additionalProperties: false
              properties:
                action: {type: string, enum: [REQUEST_GRANT, APPROVE_GRANT, PROPOSE_CASE_VERIFICATION, APPROVE_CASE_VERIFICATION, WITHDRAW_CASE_VERIFICATION]}
                targetRef: {type: string, format: uuid}
                caseRef: {type: string, format: uuid, description: "Obligatorio SOLO en PROPOSE_/APPROVE_/WITHDRAW_CASE_VERIFICATION (liga el step-up al caso); prohibido en REQUEST_GRANT y APPROVE_GRANT."}
      responses:
        '303':
          description: "Location = autorizacion del IdP (max_age=0, prompt=login). Set-Cookie oidcState (Lax). Sin cuerpo."
        '404':
          description: Respuesta uniforme (origen, sesion, accion, rol, destino o limite).
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/rights-cases/{caseRef}:
    get:
      operationId: getRightsCase
      x-api-id: API-CNS-TBD-P08
      tags: [platform]
      summary: "getRightsCase"
      x-session: caseSession
      x-roles: "RIGHTS_OPERATOR"
      x-step-up: "none"
      x-db-role: "platform_rw->rights_operator"
      x-db-function: "(vistas case_scope() + ops.access_log)"
      x-delivery: "PR-5"
      security: [{caseSession: []}]
      parameters:
        - {name: caseRef, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/rights-cases/{caseRef}/verification-proposals:
    post:
      operationId: proposeCaseVerification
      x-api-id: API-CNS-136
      tags: [platform]
      summary: "proposeCaseVerification - Movido desde consent-it0."
      x-session: caseSession
      x-roles: "RIGHTS_OPERATOR"
      x-step-up: "PROPOSE_CASE_VERIFICATION"
      x-db-role: "platform_rw->rights_operator"
      x-db-function: "case_state.propose_case_verification"
      x-delivery: "PR-5; 6d parte 2 (0066-0071): actor, tenant y Revocation derivados de la sesion en la base; una transaccion por accion"
      x-moved-from: consent-it0.openapi.yaml
      security: [{caseSession: []}]
      parameters:
        - {name: caseRef, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposalRef, verificationScriptVersion]
              additionalProperties: false
              properties:
                proposalRef: {type: string, format: uuid}
                verificationScriptVersion: {type: string, pattern: '^[A-Za-z0-9._-]{1,32}$'}
      responses:
        '201':
          description: "RH2 paso 1 registrado (sin efecto sobre la Revocation). Step-up PROPOSE_CASE_VERIFICATION (destino proposalRef) consumido en la misma tx."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  proposalRef: {type: string, format: uuid}
                  attestation: {type: string, enum: [PENDING]}
        '403':
          description: "ERR-RV-07 RH2_SEPARATION_OF_DUTIES_VIOLATION o ERR-CM-10 ACTOR_NOT_ALLOWED (code + status + correlationId + rightsPathsAvailable)."
        '409':
          description: "Guard de dominio (ERR-CM-06 INVALID_TRANSITION, ERR-RV-18 RH3_FOUR_EYES_REQUIRED, ERR-RV-20 RH3_NOT_BOUND_TO_RH2, ERR-RC-10 ROSTER_INSUFFICIENT, ERR-RC-03 CASE_CLOSE_PRECONDITION_FAILED); un cuerpo con claves ajenas tambien es 409."
        '429':
          description: "P-50 (limite del operador)."
        '404':
          description: Respuesta uniforme (sesion, origen, caso o propuesta ajena o no valida, step-up ausente o rechazado, ERR-CM-01). Sin cuerpo distinguible.
        '503':
          description: "ADR-010 PR-7a (F-PR7-10): la base no esta disponible (SQLSTATE de clase 08, 40, 53, 57 o 55P03, conexion perdida). Error uniforme SERVICE_UNAVAILABLE {code, status, correlationId}, identico para cualquier recurso (no es 'no existe'; sin oraculo). Los demas errores no de dominio ni de autorizacion siguen en 404 uniforme."
  /platform/rights-cases/{caseRef}/verification-proposals/{proposalRef}/approval:
    post:
      operationId: approveCaseVerification
      x-api-id: API-CNS-137
      tags: [platform]
      summary: "approveCaseVerification - Movido desde consent-it0."
      x-session: platformSession
      x-roles: "PRIVACY_LEGAL, SECURITY"
      x-step-up: "APPROVE_CASE_VERIFICATION"
      x-db-role: "platform_rw"
      x-db-function: "case_state.approve_case_verification"
      x-delivery: "PR-5; 6d parte 2 (0066-0071): actor, tenant y Revocation derivados de la sesion en la base; una transaccion por accion"
      x-moved-from: consent-it0.openapi.yaml
      security: [{platformSession: []}]
      parameters:
        - {name: caseRef, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: proposalRef, in: path, required: true, schema: {type: string, format: uuid}}
      x-step-up-detail: "RH2 exige step-up APPROVE_CASE_VERIFICATION (destino caseRef:proposalRef) del APPROVER, consumido en la misma tx (GRD-RC-12); cruce GRD-RC-10: el aprobador no es aprobador ni receptor de ningun grant del caso (ERR-RV-07, 403)."
      responses:
        '200':
          description: "RH2 aprobada: Revocation VERIFIED (HUMAN_ASSISTED)."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  attestation: {type: string, enum: [ATTESTED]}
                  revocationState: {type: string, enum: [VERIFIED]}
        '403':
