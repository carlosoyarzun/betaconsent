      proposer: "RIGHTS_OPERATOR con sesión CASE del caso (verifiedByRef)"
      approver: "PRIVACY_LEGAL o SECURITY en su propia sesión PLATFORM (secondApproverRef), tercer humano"
    routeClass: RIGHTS
