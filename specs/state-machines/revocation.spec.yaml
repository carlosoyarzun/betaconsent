    governedBy: ["DEC-BR-017 §8", "REQ-CNS-TBD-08 AC-08.1", "SEC-CNS-005 TS-22"]
    testIds: [TEST-CNS-263]
  - id: ERR-RV-05
    code: RECOVERY_TOKEN_INVALID
    response: "Respuesta uniforme (segundo uso, expirado, de otro tenant o ligado a la decisión de un ciclo anterior, SEC N2-04), sin revelar revocationRef. Si expiró, la respuesta indica usar el enlace de gestión para pedir otro (REQUESTER_ASKED desde /m/, alcance R13-3); un /r/ expirado no crea handle ni emite nada. GET /r/ responde siempre 303 idéntico; la uniforme es la página 33:106 de /recovery/confirm, única para todas las clases; sin evento."
    emitsEvent: none
    governedBy: ["REQ-CNS-TBD-03 AC-03.3", "DEC-BR-017 §5", "SEC-CNS-012 P1-03, P2-06"]
    testIds: [TEST-CNS-231, TEST-CNS-337]
    changeNote: "Carlos 2026-09-28 opción (a) + fe de erratas ADR-006 §6/§6.2; sin cambio de semántica."
  - id: ERR-RV-06
    code: RECOVERY_TOKEN_SCOPE_VIOLATION
