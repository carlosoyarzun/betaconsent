    effort: high
    max_turns: 50
    may_write_code: false
    may_write_jira: false
    may_write_notion: false

  - name: lampone-security
    master_plan_role: LAMPONE
    tier: T1
    model: claude-opus-5
    effort: high
    max_turns: 50
    may_write_code: false
