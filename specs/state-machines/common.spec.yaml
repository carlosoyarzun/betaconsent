  - "SEC-CNS-005 rev. 5 (T-26, T-27, T-28, T-36, T-38, T-39, T-44); SEC-CNS-006 rev. 5 (P-26, P-30, P-31, P-33, P-40)"
  - "Master Plan §29 (fail closed), §32 (límites de IA), §39 (append + proyección + outbox en una tx) — solo por referencia"

scope:
  it0: >
    Un colegio = un tenant funcional + >=2 tenants fixture para aislamiento (DEC-BR-014 §1).
    Solo datos sintéticos; producción NOT PROVISIONED; todo evento NON-EVIDENTIARY y SYNTHETIC.
  deferred:
    - "Organization/sostenedor, Membership ORGANIZATION (DEC-BR-016 §3)"
    - "BillingSubscription (DEC-BR-016 §5): en IT0 nunca afecta ninguna máquina"
    - "Reporting cross-tenant / reporting_runner (DEC-BR-016 §6)"
    - "Intake humano sin enlace (DEC-BR-017 §3, adición r3 (a))"
    - "Flujo de traslado en el tenant destino (DEC-BR-014 §1; LD-09)"

tenancy:
  isolationKey: tenant_id # única clave de aislamiento (DEC-BR-015 §1; DR2 D2)
  contractName: tenantRef # nombre en contratos y eventos (ADR-006 §1)
  forbiddenKeys: ["organization_*", "organizationRef", "billing_subscription*", "rbd"]
  resolution: >
    tenant_id se resuelve SIEMPRE en servidor desde tokenHash, handle, sesión o credencial vía
    la allowlist SECURITY DEFINER de ADR-006 §6; nunca desde tenantRef, organizationRef ni RBD
    enviados por el cliente. Tras resolver: tx nueva, SET LOCAL app.tenant_id y relectura bajo RLS.
  uniqueConstraints: "Todo UNIQUE de tabla TENANT incluye tenant_id, salvo hashes de tenant_resolve (ADR-006 §4)."

routeClasses:
  - id: ISSUANCE_DECISION
    appliesTo: "I1–I4, V1 scope DECISION, C1–C5 (I1 e I2 incluidos: SM-CNS-001 R0.5; AUDIT F-A06)"
    rule: >
      Fórmula conjuntiva de DEC-BR-016 §8, evaluada sin caché: study.active AND tenant.active AND
      schoolParticipation.active AND enrollment.active AND consent.valid AND NOT revoked AND
      NOT suspended. Estado desconocido, desactualizado o con error = false (fail-closed).
      'suspended' vale false por construcción en IT0 (LD-04, no modelado).
    guard: GRD-CM-05
  - id: PLATFORM
    appliesTo: "actos de plataforma sobre tenant, SchoolParticipation y ConsentContext (tenant-context TN*, SP*, CX*)"
    rule: "Solo roles de plataforma humanos (o FIXTURE en LOCAL/CI); no evalúan la fórmula de elegibilidad; nunca tocan ConsentDecision ni la vía de revocación."
    guard: GRD-CM-07
  - id: STAFF_ADMIN
    appliesTo: "actos administrativos del staff del colegio sin emisión ni decisión (tenant-context EN0, EN1)"
    rule: "Membership TENANT vigente del tenant resuelto (GRD-CM-01/02/07); no evalúan la fórmula de elegibilidad (AUDIT-H01-rev3 N-13)."
    guard: GRD-CM-07
  - id: RIGHTS
    appliesTo: "/m/, consulta, MANAGE, Revocation (OTP y RECOVERY), RightsCase, entrega de consent.revoked"
    rule: >
      Solo exige que el tenant EXISTA y la cadena del titular (chainRef) resuelta en servidor.
      Nunca lee tenant.active, study.active, SchoolParticipation, Enrollment, BillingSubscription
      ni estado del contexto (DEC-BR-016 §8; ADR-006 §6; RULE-CNS-TBD-01).
    guard: GRD-CM-06

actorModel:
  actorType: [HUMAN, SYSTEM_GUARD, FIXTURE]
  actorRole: [DECISION_MAKER, INVITER, CONTEXT_OWNER, PLATFORM_ADMIN, RIGHTS_OPERATOR, UNVERIFIED_BEARER] # UNVERIFIED_BEARER: R13-5 (SM v7 R0.2)
  approverRoles: [PRIVACY_LEGAL, SECURITY] # aprobadores de grants y de RH2 (R6-5); roles de plataforma, no de ledger
  fixture:
    rule: "R14-F: actorType FIXTURE permitido exclusivamente en LOCAL y CI, para seed sintético; rechazado en DEV, STAGING y PRODUCTION. CI corre con environment = LOCAL (el enum de ADR-002 §2 no tiene CI; OPEN-CM-07). SEC N2-06, defensa en profundidad: (1) CHECK de DB en integrity.audit_event (ledgerEnvelope.checks); (2) environment fijado en el catálogo de la DB al aprovisionar, nunca por configuración (GRD-CM-11, GRD-CM-13); (3) rol/credencial de seed creado solo por el bootstrap LOCAL, más lista blanca de transiciones FIXTURE (GRD-CM-14). Un CHECK rechaza actores IA. DEC-BR-014 §6 quedó enmendada para reflejar R14-F (DEC-BR-018 A-15, A-16; cierra OPEN-CM-08 y el derivado P-01)."
    guard: GRD-CM-13
    seedGuard: GRD-CM-14
    allowlist: [TN1, TN2, SP1, SP2, SP3, SP4, EN0, EN1] # únicas transiciones con origen FIXTURE (GRD-CM-14)
  unverifiedBearer:
    id: UNVERIFIED_BEARER
    definition: >
      DECIDIDO R13-5 (SM-CNS-001 v7 R0.2): valor del enum actorRole para el portador de un token o
      handle (/i/ LANDING, /m/ MANAGE_ENTRY, /r/ RECOVERY) que aún no pasó V3 ni consumió un enlace
      de recuperación.
    actorType: HUMAN
    actorRole: UNVERIFIED_BEARER
    may: ["invitation I4", "otp-challenge V1, V2, V2r (solo al canal ligado)", "revocation RV0 con trigger del portador", "rights-case RC1, RC1c (deshabilitada), RC2u", "rights-case RC3/RC3a y revocation RC3/R12 (intención en la página del caso; P-v7-3 ACCEPTED, R14-A)", "consent-decision M3 (deshabilitada)"]
    mayNot: ["C1–C5", "R1, R2, R3, R8, R8h", "RH2, RH2v, RH3", "declarar TOKEN_COMPROMISED", "ver menor, colegio, finalidades o estado"]
    becomesDecisionMaker: "solo con V3 (OTP), con el consumo del enlace en R1r/R2r/R10/R11 (control del canal ligado) o con RH2/RH2v"
    governedBy: ["SM-CNS-001 v7 R0.2", "DEC-BR-018 R13-5", "SM-CNS-001 §2 I4 (SM:36)", "SM-CNS-001 §5.2 RC1 (SM:152)"]
    testIds: [TEST-CNS-313, TEST-CNS-396]
  rules:
    - "Actor derivado de la identidad autenticada en servidor; nunca de un campo enviado por el cliente (SM R0.2)."
    - "SYSTEM_GUARD = evaluador determinista versionado del backend; nunca un modelo ni agente IA (MP §32; [N-SM] §1)."
    - "Credenciales de IA sin permiso en ninguna transición; CHECK rechaza actor IA (SEC F21; DEC-BR-014 §6)."
    - "Roles de plataforma solo IT0_ONLY, MFA, principal_kind='HUMAN' (ADR-001 §10; R6-5)."
  transitionConventions:
    httpPost: "Toda transición declara httpPost. Si es true, lleva GRD-CM-10 (CSRF + Origin); el checker lo exige (SEC P2-12)."
    actorRef: "actor: {ref: UNVERIFIED_BEARER} referencia la definición única de arriba (R13-5)."
    guardsBySource: >
      SEC-CNS-012 re-verificación rev. 4 N2-01: una transición con más de una fuente de disparo (actor.bySource, o
      actor.byReasonCode con 'source') declara guardsBySource y httpPostBySource con las mismas fuentes. 'guards' lista
      solo los comunes a todas; una fuente sin POST (SYSTEM, FIXTURE) nunca exige handle, credencial ni CSRF
      (GRD-CM-01, GRD-CM-10, GRD-RC-14, GRD-RV-06, GRD-RV-18, GRD-RV-20) y resuelve el tenant desde el registro
      del agregado que la dispara, en la misma tx. SEC N3-01: la fuente se deriva de la identidad de ejecución
      (rol de DB de la conexión + entrypoint del proceso), nunca de un campo de la request; toda fuente sin POST
      lleva GRD-CM-15. El checker lo exige.
    acceptsIntegrityFailure: "Transición que INV-RV-07 obliga a aceptar con falla de clave/integridad (R4): ninguno de sus guards puede tener rejectsOnIntegrity (SEC N2-02); el checker lo exige."

ledgerEnvelope:
  table: integrity.audit_event
  fields: [eventId, eventType, schemaVersion, ruleVersion, tenantRef, productRef, contextRef, aggregateType, aggregateId, sequence, occurredAt, actor, payload, payloadHash, previousEventHash, eventHash, idempotencyKeyHash, environment, evidentiary, dataClass]
  actorFields: [actorType, actorRole, actorRef, recordedByRef]
  environmentEnum: [LOCAL, DEV, STAGING, PRODUCTION] # PRODUCTION NOT PROVISIONED (ADR-003 §2)
  checks:
    - "CHECK (evidentiary = false OR environment = 'PRODUCTION') (ADR-002 §2)"
    - "CHECK (data_class = 'SYNTHETIC') con DEFAULT; roles runtime sin grant de columna (ADR-002 §8)"
    - "UNIQUE (tenant_id, aggregate_id, sequence) (ADR-002 §2)"
    - "CHECK (actor_type <> 'FIXTURE' OR environment = 'LOCAL') (R14-F, SEC N2-06); CI corre como LOCAL (OPEN-CM-07): si ADR-002 §2 agrega CI al enum, pasa a environment IN ('LOCAL','CI')"
    - "environment de cada fila = DEFAULT del catálogo de la DB fijado al aprovisionar (como data_class, ADR-002 §8); los roles runtime no tienen grant de columna sobre environment (SEC N2-06)"
  concurrency: "Toda transición de un agregado se aplica con expectedSequence (sequence esperado del agregado); el conflicto se reintenta o se rechaza con el error de la transición."
  payloadPolicy: >
    Lista blanca por eventType con test de CI; fuente única en contracts/ (H02 / CA-117).
    Prohibidos: email, nombre, RUT, token, OTP, IP, HMAC y texto libre. Enums de finalidad sí.
    Refs = UUIDv4 aleatorios mapeados a PII solo en pii (SM §1; ADR-002 §3).
  streams:
    LEDGER: "integrity.audit_event (append-only; cadena SHA-256 por tenant en IT0; ADR-011/DEC-BR-009 para HMAC/ancla)"
    SECURITY: "ops.security_event (RLS por tenant, solo refs; no es ledger de consentimiento; SEC F03; retención LD-15). CA-141 (0025): login/logout/rotación de sesiones STAFF y CASE (STAFF_LOGIN, STAFF_LOGOUT, CASE_LOGIN, CASE_LOGOUT, SESSION_REVOKED_BY_ROTATION; session.spec GRD-SE-14); SEC-CNS-021 PR-2 (0030): OTP_ISSUED/FAILED/LOCKED/EXPIRED/BUDGET_EXHAUSTED, MANAGEMENT_TOKEN_ROTATED y RECOVERY_TOKEN_ISSUED se escriben aqui (0029, misma tx que la transicion) y el ledger los rechaza con 23514 (ya no son TRANSITORIOS; DECISION_MAKER_CHANNEL_VERIFIED sigue en el ledger); retención P-34 (0031, SEC-CNS-021 PR-3): SECURITY_EVENT_RETENTION = CNS_RETENTION_SECURITY_EVENT_DAYS, 30 días es PLACEHOLDER (LD-15 abierta); la purga solo vía ops.purge_p34 y queda en ops.purge_run"
    OUTBOX: "outbox transaccional at-least-once con dedupe por eventId; entrega firmada anti-replay (SM §7)"
    PLATFORM_AUDIT: "auditoría de transiciones de catálogo PLATFORM (ConsentContext); tabla y encadenado OPEN (ADR-011 / H02)"

failClosed:
  default: >
    Toda transición cuyo guard falle, no pueda evaluarse o encuentre estado desconocido se rechaza
    de forma determinista, SIN estado parcial y SIN evento de ledger (SM R0.3; MP §29, P16).
    Si el evaluador de guards falla (no disponible, timeout, error) la operación se rechaza y se
    alerta; no es evidencia de que un guard falló y no pausa el contexto ([N-SM] §1 'Not a context pause').
  exception: >
    Revocación: R4 se acepta con receipt y efecto más restrictivo aunque falle una clave o la
    integridad (P16, [N-SM] §1 PROPOSED). Validez de esa evidencia: LEGAL DECISION LD-05.
    Ningún guard de ISSUANCE/DECISION se aplica a rutas RIGHTS (INV-CM-06).

globalErrors: # aplican a toda transición de todas las specs (el checker los cuenta como usados)
  - ERR-CM-06 # INVALID_TRANSITION
  - ERR-CM-12 # GUARD_EVALUATOR_UNAVAILABLE
  - ERR-CM-13 # LIST_QUERY_INVALID (solo lecturas de lista, API-CNS-116; se lista aqui para el checker H01: no hay otra clave de uso)
startupChecks: # chequeos de arranque, no de transición (el checker los cuenta como usados)
  - GRD-CM-11

parametersRef:
  note: "Solo por referencia a SEC-CNS-006 rev. 5 §1 (valores aprobados R6-8 / R11-B3). Esta spec no fija valores. P-45 NO aprobado y no se usa."
  used: [P-26, P-30, P-31, P-33, P-40]

guards:
  - id: GRD-CM-01
    name: tenant_resolved_server_side
    rule: "tenant_id resuelto por función de la allowlist de ADR-006 §6 desde credencial (hash exacto); vacío/expirado/rotado → 404 uniforme."
    onFail: ERR-CM-01
    governedBy: ["SM-CNS-001 R0.4", "ADR-006 §6", "DEC-BR-015 §1"]
    testIds: [TEST-CNS-111]
  - id: GRD-CM-02
    name: guard_T_tenant_consistency
    rule: "tenant(token) = tenant(sesión) = tenant(agregado); token del tenant X con sesión del tenant Y, o token del contexto A usado en B, se rechaza."
    onFail: ERR-CM-02
    governedBy: ["SM-CNS-001 R0.4 (Guard T)", "ADR-006 §2"]
    testIds: [TEST-CNS-112]
  - id: GRD-CM-03
    name: guard_P_school_participation_active
    rule: "El tenant de la request tiene SchoolParticipation ACTIVE para (contextRef, productRef); se evalúa por request (literal DEC-BR-015:42)."
    onFail: ERR-CM-03
    governedBy: ["SM-CNS-001 R0.4 (Guard P)", "DEC-BR-015 Consecuencias (guard (d) + Guard P)", "RULE-CNS-024", "DEC-BR-013"]
    testIds: [TEST-CNS-113]
  - id: GRD-CM-04
    name: guard_E_enrollment_active
    rule: "Enrollment ACTIVE del subjectRef en esa SchoolParticipation."
    onFail: ERR-CM-04
    governedBy: ["SM-CNS-001 R0.4 (Guard E)", "DEC-BR-016 §1, §8"]
    testIds: [TEST-CNS-114]
  - id: GRD-CM-05
    name: route_class_issuance_decision
    rule: "Fórmula conjuntiva de DEC-BR-016 §8 sin caché; desconocido = false. PAUSED/SUSPENDED de contexto o participación → CONTEXT_NOT_ACTIVE o el código de R0.4, sin volver nada terminal."
    onFail: ERR-CM-05
    governedBy: ["SM-CNS-001 R0.5", "DEC-BR-016 §8", "ADR-006 §6"]
    testIds: [TEST-CNS-115]
  - id: GRD-CM-06
    name: route_class_rights
    rule: "Solo tenant existe + cadena del titular resuelta en servidor; nunca *.active ni status de tenant, participación, Enrollment, contexto ni BillingSubscription. Un tenant SUSPENDED sigue resolviendo /m/ y /r/ (AC-02.3)."
    onFail: ERR-CM-01
    governedBy: ["SM-CNS-001 R0.5, R0.6", "DEC-BR-016 §8", "RULE-CNS-TBD-01", "REQ-CNS-TBD-01 AC-01.3, AC-01.4", "REQ-CNS-TBD-02 AC-02.3", "ADR-006 §6"]
    testIds: [TEST-CNS-107, TEST-CNS-116, TEST-CNS-315]
  - id: GRD-CM-07
    name: actor_derived_and_allowed
    rule: "Actor derivado de la identidad autenticada; rol permitido por transición; actor IA o identidad de servicio como HUMAN → rechazo por CHECK. SEC-CNS-013: con recordedActor fijo (RH2, RH2v, RH3), el guard se aplica a los principales ejecutores (verifiedByRef, secondApproverRef, recordedByRef, cosignedByRef), derivados de la sesión y principal_kind HUMAN; actorType/actorRole del evento lo fija la spec, nunca un parámetro."
    onFail: ERR-CM-10
    governedBy: ["SM-CNS-001 R0.2, INV-12", "DEC-BR-014 §6", "DEC-BR-017 §8", "MP §32", "SEC-CNS-013"]
    testIds: [TEST-CNS-106]
  - id: GRD-CM-08
    name: idempotency_key
    rule: "Idempotency-Key ligada a (tenantRef, principal, operación), almacenada como hash con TTL P-33; replay solo al mismo principal; misma key + mismo payloadHash → misma respuesta; misma key + otro hash → conflicto."
    onFail: ERR-CM-07
    governedBy: ["SM-CNS-001 §7", "SEC-CNS-006 P-33"]
    testIds: [TEST-CNS-117]
  - id: GRD-CM-09
    name: integrity_and_keys_available
    rule: "Clave de firma/cifrado presente e integridad del ledger verificable; si no, la operación se rechaza (salvo R4 de revocación, LD-05)."
    rejectsOnIntegrity: true # prohibido en transiciones acceptsIntegrityFailure (R4)
    onFail: ERR-CM-08
    governedBy: ["SM-CNS-001 R0.3, §4.1", "MP §29", "[N-SM] §1 P16"]
    testIds: [TEST-CNS-118]
  - id: GRD-CM-10
    name: csrf_and_origin
    rule: "Todo POST (httpPost: true) exige token CSRF y Origin/Host por igualdad exacta; cookies __Host- según P-26; consolas STAFF/PLATFORM con cookie y CSRF propios."
    onFail: ERR-CM-09
    governedBy: ["SM-CNS-001 §3.1", "ADR-001 §2", "SEC-CNS-006 P-26", "SEC-CNS-005 T-03, T-04"]
    testIds: [TEST-CNS-119]
  - id: GRD-CM-11
    name: synthetic_only_environment
    rule: "data_class = 'SYNTHETIC', environment ∈ {LOCAL, DEV, STAGING}, evidentiary = false; si el catálogo no lo garantiza el servicio no arranca (chequeo de arranque, no de transición). SEC N2-06: el environment efectivo es el del catálogo de la DB (fijado al aprovisionar), no el de la configuración; si la configuración declara otro valor, el servicio no arranca."
    onFail: ERR-CM-11
    governedBy: ["DEC-BR-014 §4", "ADR-002 §2, §8", "ADR-001 §10", "SEC-CNS-012 re-verificación rev. 4 N2-06"]
    testIds: [TEST-CNS-104, TEST-CNS-440]
  - id: GRD-CM-12
    name: server_time_only
    rule: "Toda comparación temporal (expiresAt, TTL, SLA) usa la hora del servidor; nunca el reloj del cliente ni del consumidor. Reloj según P-40."
    onFail: null # guard de disparo: sin la condición temporal no hay transición
    governedBy: ["SM-CNS-001 §2 I8, §3 V5, §5 R9", "SEC-CNS-006 P-40", "[N-SM] §1 (pausedAt)"]
    testIds: [TEST-CNS-310]
  - id: GRD-CM-13
    name: fixture_actor_environment
    rule: "R14-F: actorType FIXTURE solo con environment = LOCAL (incluye las corridas de CI); en DEV, STAGING y PRODUCTION se rechaza (ERR-CM-10). SEC N2-06: el environment comparado es el del catálogo de la DB, nunca la configuración (un STAGING mal etiquetado LOCAL por configuración no habilita FIXTURE), y además lo impone el CHECK de DB de ledgerEnvelope.checks, de modo que el guard solo no es la única barrera."
    onFail: ERR-CM-10
    governedBy: ["DEC-BR-018 R14-F", "DEC-BR-014 §6 (literal contradicho: derivado P-01)", "DEC-BR-014 §5 (DEC-BR-014:84: SchoolParticipation y tenant.active por fixture o migración revisada)", "ADR-002 §2, §8", "SEC-CNS-012 re-verificación rev. 4 N2-06"]
    testIds: [TEST-CNS-311, TEST-CNS-421, TEST-CNS-439, TEST-CNS-440]
  - id: GRD-CM-14
    name: fixture_seed_channel
    rule: "SEC N2-06: el origen FIXTURE solo existe por el rol/credencial de seed que crea el bootstrap LOCAL (el aprovisionamiento de DEV, STAGING y PRODUCTION no lo crea) y solo para actorModel.fixture.allowlist (TN1, TN2, SP1–SP4, EN0, EN1); cualquier otra transición con origen FIXTURE se rechaza. En la fuente FIXTURE el tenant_id sale del manifiesto de seed con SET LOCAL app.tenant_id y relectura bajo RLS: sin credencial de portador, sin POST ni CSRF. Sin origen FIXTURE, el guard no aplica."
    onFail: ERR-CM-10
    governedBy: ["DEC-BR-018 R14-F", "DEC-BR-014 §1, §5, §6", "ADR-002 §8", "SEC-CNS-012 re-verificación rev. 4 N2-06"]
    testIds: [TEST-CNS-429, TEST-CNS-441]
  - id: GRD-CM-15
    name: source_from_execution_identity
    rule: "SEC N3-01: la fuente de guardsBySource se deriva de la identidad de ejecución (rol de DB de la conexión + entrypoint del proceso), nunca de un campo, header, parámetro, reasonCode, origin ni actorType enviado en la request. BEARER/STAFF/HUMAN = entrypoint web con app_rw (consola PLATFORM: platform_rw) y sesión resuelta por session_hash. SYSTEM = rol worker, solo dentro de la tx de la transición que la dispara (R9 → RC1; SP4/EN1 → I9; RightsCase RC2 tras RC1; RV0 con trigger CASE_CONTACT/SCHOOL_REPORTED, SEC-CNS-013 N-4c-01/N-4c-02) o en el job durable de kind cerrado que la reintenta (ops.claim_due_jobs; GRD-TC-08). FIXTURE = rol de seed del bootstrap LOCAL (GRD-CM-14). Las funciones de las ramas SYSTEM y FIXTURE (RC1 desde R9, RC2, RV0-sistema, cascada I9 y su job, EN0/EN1 por seed; nombres en H02 / ADR-006 §6) son SECURITY DEFINER con REVOKE EXECUTE FROM PUBLIC y sin EXECUTE para app_rw ni platform_rw (chequeo de catálogo, igual que CONTEXT_READINESS en GRD-TC-05). Una request HTTP que declare origin REQUEST_EXPIRED, reasonCode PARTICIPATION_CLOSED/ENROLLMENT_CLOSED, actorType SYSTEM_GUARD/FIXTURE o una marca de fuente se rechaza sin efecto ni evento; la base rechaza la llamada con permission denied si el código la intentara."
    onFail: ERR-CM-10
    governedBy: ["SEC-CNS-012 re-verificación rev. 4b N3-01", "SM-CNS-001 R0.2 (actor derivado en servidor)", "ADR-002 §5 (roles app_rw, worker, platform_rw)", "ADR-006 §2 (EXECUTE por job_kind), §6 (allowlist SECURITY DEFINER)", "DEC-BR-018 R14-F", "SEC-CNS-013 N-4c-01, N-4c-02"]
    testIds: [TEST-CNS-444, TEST-CNS-445, TEST-CNS-446]
    testNotes:
      TEST-CNS-444: "Catálogo: las funciones de las ramas SYSTEM (RC1 desde R9, RC2, RV0-sistema con trigger CASE_CONTACT/SCHOOL_REPORTED, cascada I9 y job CASCADE_CANCEL_INVITATION) y FIXTURE (EN0/EN1 por seed) no tienen EXECUTE para PUBLIC, app_rw ni platform_rw; llamarlas con esas conexiones da permission denied y no deja fila ni evento."
      TEST-CNS-445: "HTTP intenta la rama SYSTEM: POST RC1 con handle válido y origin=REQUEST_EXPIRED / actorType=SYSTEM_GUARD / marca de fuente, POST I9 en la consola STAFF con reasonCode PARTICIPATION_CLOSED o ENROLLMENT_CLOSED, y POST RV0 desde web con trigger=CASE_CONTACT/SCHOOL_REPORTED (SEC-CNS-013 N-4c-01) → rechazo (ERR-CM-10 o ERR-RC-02) sin caso, sin cancelación, sin envío y sin evento; el ledger nunca registra SYSTEM_GUARD desde el entrypoint web."
      TEST-CNS-446: "HTTP intenta la rama FIXTURE: POST EN0/EN1 en la consola STAFF con actorType=FIXTURE o marca de seed, en LOCAL y en DEV → se evalúa como STAFF (sin credencial: 404/CSRF) o se rechaza con ERR-CM-10; nunca actor FIXTURE en el ledger; el proceso web no tiene la credencial del rol de seed."

