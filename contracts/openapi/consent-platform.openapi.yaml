      description: Movido desde consent-it0. Sesion PLATFORM; documenta la asercion ATTESTED del login (N7). Nombre de cookie ilustrativo (P-26).
    oidcState:
      type: apiKey
      in: cookie
      name: __Host-cns-oidc
      description: Nuevo. Estado PKCE con vida de minutos. Nombre de cookie ilustrativo (P-26).
