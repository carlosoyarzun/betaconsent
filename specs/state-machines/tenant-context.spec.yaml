invariants:
  - id: INV-TC-01
    statement: "Ningún estado de Tenant, SchoolParticipation, Enrollment ni ConsentContext impide revocar ni ejercer derechos; solo cambian eligibility_to_participate (prueba dinámica: revocation INV-6)."
    governedBy: ["RULE-CNS-TBD-01", "DEC-BR-016 §8", "SM-CNS-001 R0.6"]
    testIds: [TEST-CNS-377]
  - id: INV-TC-02
    statement: "Ningún traslado habilita tratamiento en el tenant destino: no hay vínculo entre tenants; el destino crea Student, Enrollment, Invitation y ConsentDecision nuevos (DEFERRED en IT0)."
    governedBy: ["SM-CNS-001 §6 (SM:174)", "INV-3", "LD-09", "LD-10"]
    testIds: [TEST-CNS-378]
  - id: INV-TC-03
    statement: "Que ninguna participación siga ACTIVE no pausa el contexto: Guard P bloquea por tenant; la reactivación de un contexto PAUSED exige la misma condición (R7-1)."
    governedBy: ["SM-CNS-001 §6 (SM:171)", "DEC-BR-015 Consecuencias (C-19, C-57/C-58)", "CARLOS r3 R7-1"]
    testIds: [TEST-CNS-379]

failClosed: >
  Estado de tenant, participación o Enrollment desconocido = no elegible en ISSUANCE/DECISION
  (GRD-CM-05) y sin efecto en RIGHTS. CONTEXT_READINESS falso o no evaluable → el contexto
  conserva su estado. Ninguna de estas transiciones toca ConsentDecision ni emite consent.revoked.

