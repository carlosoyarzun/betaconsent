events:
  - id: REVOCATION_REQUESTED
    stream: LEDGER
    emittedBy: [R1, R1r, RC3, R12, "rights-case:RC3", "rights-case:RC3a"]
    payload: [revocationRef, revokedDecisionRef, scope, authPath, recoveryMethod, originPurposeRef, initiatedVia, recoveryRef, caseRef] # revokedDecisionRef: R14-C, P-02 DECIDED para DEC-BR-017 §6 (DEC-BR-018 A-50); recoveryMethod?, recoveryRef?, caseRef?
    governedBy: ["DEC-BR-017 §6"]
    testIds: [TEST-CNS-230, TEST-CNS-231, TEST-CNS-294]
  - id: REVOCATION_VERIFIED
    stream: LEDGER
    emittedBy: [R2, R2r, RH2, R10, RH2v]
    payload: [revocationRef, authPath, recoveryMethod, assuranceLevel, verificationRef, recoveryRef, caseRef, verifiedByRef, secondApproverRef]
    governedBy: ["DEC-BR-017 §6"]
    testIds: [TEST-CNS-233, TEST-CNS-234, TEST-CNS-235]
  - id: REVOCATION_CONFIRMED
    stream: LEDGER
    emittedBy: [R3, R3r, RH3]
    payload: [revocationRef, recordedByRef, cosignedByRef] # recordedByRef? y cosignedByRef? solo HUMAN_ASSISTED (RH3); cosignedByRef = campo nuevo de DEC-BR-017 §6 (F-R14-04, OPEN-RV-11 DECIDED por DEC-BR-018 A-57)
    governedBy: ["DEC-BR-017 §6", "DEC-BR-018 R14-B (co-firma)", "F-R14-04"]
    testIds: [TEST-CNS-236, TEST-CNS-237, TEST-CNS-238, TEST-CNS-447, TEST-CNS-448]
  - id: REVOCATION_DOWNSTREAM_EMITTED
    stream: LEDGER
    emittedBy: [R5]
    payload: [revocationRef, subscriptionRefs] # subscriptionRefs = destinos congelados (SEC P2-08); lista blanca final en H02
    governedBy: ["DEC-BR-017 §6 (sin cambios respecto de DEC-BR-006)", "SEC-CNS-012 P2-08"]
    testIds: [TEST-CNS-240, TEST-CNS-338]
  - id: REVOCATION_DELIVERED
    stream: LEDGER
    emittedBy: [R6]
    payload: [revocationRef, ackRef]
    governedBy: ["DEC-BR-017 §6"]
    testIds: [TEST-CNS-241]
  - id: DOWNSTREAM_ERASURE_ATTESTED
    stream: LEDGER
    emittedBy: [R7]
    payload: [revocationRef]
    payloadStatus: "Lista blanca final en contracts/ (H02; sin cambios respecto de DEC-BR-006)"
    governedBy: ["DEC-BR-017 §6", "[N-SM] §6"]
    testIds: [TEST-CNS-242]
  - id: REVOCATION_FAILED
    stream: LEDGER
    emittedBy: [R8, R8h]
    payload: [revocationRef, reasonCode] # reasonCode = failReason = WITHDRAWN_BY_REQUESTER
    governedBy: ["DEC-BR-017 §6"]
    testIds: [TEST-CNS-243]
  - id: REVOCATION_ESCALATED
    stream: LEDGER
    emittedBy: [R9, "rights-case:RC1"]
    payload: [revocationRef, caseRef, reasonCode] # reasonCode = escalationReason; una sola emisión por disparo (AUDIT F-A11)
    governedBy: ["DEC-BR-017 §6", "SM-CNS-001 §5 R9", "AUDIT F-A11"]
    testIds: [TEST-CNS-244, TEST-CNS-344]
  - id: REVOCATION_PROPOSAL_WITHDRAWN
    stream: LEDGER
    emittedBy: [RH2w]
    payload: [revocationRef, caseRef, proposalRef, verificationScriptVersion, withdrawnByRef] # solo refs UUIDv4; withdrawnByRef = proposedByRef (solo el proponente retira, solo PENDING); la propuesta queda WITHDRAWN (terminal) y la Revocation sigue REQUESTED, nunca FAILED (INV-6)
    governedBy: ["CA-128 X6 P2 (Carlos, 2026-10-01)", "GRD-RV-09"]
    testIds: [TEST-CNS-1013, TEST-CNS-1014, TEST-CNS-1015, TEST-CNS-1016, TEST-CNS-1017, TEST-CNS-1018, TEST-CNS-1019, TEST-CNS-1020]
  - id: RECOVERY_TOKEN_ISSUED
    stream: SECURITY
    emittedBy: [RV0, "rights-case:RC2"]
    payload: [recoveryRef, trigger] # trigger ∈ {REQUESTER_ASKED, LIMIT_REACHED, CASE_CONTACT, SCHOOL_REPORTED}
    governedBy: ["DEC-BR-017 §6 (fuera del ledger)", "SM-CNS-001 §5.1 RV0"]
    testIds: [TEST-CNS-245]

invariants:
  - id: INV-6
    statement: "D5: con tenant SUSPENDED, SchoolParticipation SUSPENDED o CLOSED, Enrollment TRANSFERRED/LEFT_SCHOOL, contexto PAUSED y OTP agotado/LOCKED, una revocación verificada llega a APPLIED y emite consent.revoked."
    governedBy: ["SM-CNS-001 §7 INV-6", "RULE-CNS-TBD-01", "REQ-CNS-TBD-01 AC-01.1", "DEC-BR-014 X6", "SEC-CNS-005 TS-20"]
    testIds: [TEST-CNS-246]
  - id: INV-8
    statement: "RECOVERY nunca crea sesión MANAGE/DECISION ni modifica ops.otp_budget ni verification.attempts (un LOCKED sigue LOCKED)."
    governedBy: ["SM-CNS-001 §7 INV-8", "CARLOS r2 D6", "REQ-CNS-TBD-04 AC-04.3"]
    testIds: [TEST-CNS-247]
  - id: INV-9
    statement: "Ningún actor distinto del DecisionMaker (colegio, RIGHTS_OPERATOR, SYSTEM_GUARD, IA) produce R3, R3r ni RH3. (RH3 registrado por el operador: LEGAL DECISION LD-03, OPEN-RV-06.)"
    governedBy: ["SM-CNS-001 §7 INV-9", "DEC-BR-017 §8", "SEC-CNS-012 P1-07"]
    testIds: [TEST-CNS-248]
  - id: INV-10
    statement: "No hay transición a FAILED salvo R8 (y R8h, deshabilitada); ningún timer cierra una Revocation ni un RightsCase."
    governedBy: ["SM-CNS-001 §7 INV-10", "DEC-BR-017 §0.3, §5", "RULE-CNS-TBD-02"]
    testIds: [TEST-CNS-249]
  - id: INV-11
    statement: "OTP de REVOCATION/MANAGE, RV0, enlace rotado y avisos van solo al channelRef ligado; pii.case_contact nunca recibe envíos (la cola de envíos solo admite FK a pii.channel)."
    governedBy: ["SM-CNS-001 §7 INV-11", "ADR-002 §10", "DEC-BR-017 §3", "SEC-CNS-005 TS-17"]
    testIds: [TEST-CNS-250]
  - id: INV-RV-01
    statement: "≤1 Revocation no terminal por decisión revocada (revokedDecisionRef, UNIQUE parcial; R14-C); idempotencia por revocationRef en todas las vías; recoveryRef N:1 y caseRef 1:1; un solo CONSENT_REVOKED efectivo por decisión revocada; cada verificationRef verifica a lo sumo una revocación."
    governedBy: ["SM-CNS-001 §7", "DEC-BR-017 §0.6", "REQ-CNS-TBD-06 AC-06.2", "SEC-CNS-012 P1-05, P2-05"]
    testIds: [TEST-CNS-251, TEST-CNS-329, TEST-CNS-335]
  - id: INV-RV-02
    statement: "No existe FAILED después de APPLIED y nunca se vuelve a GRANTED; volver atrás solo con un consentimiento nuevo (T10)."
    governedBy: ["[N-SM] §6", "DEC-BR-017 §0.3, §0.12"]
    testIds: [TEST-CNS-252]
  - id: INV-RV-03
    statement: "DELIVERED ≠ COMPLETED: DELIVERED significa recibido, COMPLETED significa supresión atestada por el consumidor; la reconciliación nunca fija COMPLETED."
    governedBy: ["RULE-CNS-026", "[N-SM] §6"]
    testIds: [TEST-CNS-253]
  - id: INV-RV-04
    statement: "En BETA_2026_01 toda revocación es scope = ALL con originPurposeRef (código o ALL, nunca nulo), también por RECOVERY."
    governedBy: ["CARLOS r3 H1, adición (b)", "DEC-BR-017 §6", "REQ-CNS-TBD-05 AC-05.2"]
    testIds: [TEST-CNS-254]
  - id: INV-RV-05
    statement: "Una revocación verificada nunca se somete a throttle; ningún rate limit elimina la vía (OTP → enlace → humano); un token /m/ o /r/ válido siempre resuelve."
    governedBy: ["DEC-BR-017 §0.1, §9", "RULE-CNS-TBD-02", "REQ-CNS-TBD-07 AC-07.2", "SEC-CNS-006 P-21, P-22"]
    testIds: [TEST-CNS-255]
  - id: INV-RV-06
    statement: "Enlace de gestión: vida = la de la cadena; rota solo por RECEIPT_REISSUED o FAILURE_CAP; TOKEN_COMPROMISED lo declara solo el DecisionMaker con sesión MANAGE verificada o la plataforma (RIGHTS_OPERATOR con grant o Security humano), nunca TENANT_ADMIN; reemisión solo al canal ligado; la supresión no revoca el token (LD-22)."
    governedBy: ["SM-CNS-001 §5.0", "ADR-006 §6.1", "DEC-BR-017 §1", "SEC-CNS-006 P-13", "REQ-CNS-TBD-08 AC-08.1"]
    testIds: [TEST-CNS-258, TEST-CNS-265]
  - id: INV-RV-07
    statement: "R4 nunca se rechaza por falla de clave o integridad: se acepta con receipt y efecto más restrictivo (AuthorizationCheck NOT_AUTHORIZED inmediato para la cadena, registro durable y reconciliación); validez: LD-05. Ningún guard de R4 rechaza por integridad (acceptsIntegrityFailure; GRD-RV-29 deriva authPath y actor, SEC N2-02)."
    governedBy: ["[N-SM] §1 P16", "SM-CNS-001 R0.3, R4", "LD-05", "SEC-CNS-012 P2-07", "SEC-CNS-012 re-verificación rev. 4 N2-02"]
    testIds: [TEST-CNS-256, TEST-CNS-430]
  - id: INV-RV-08
    statement: "El colegio nunca ejecuta R1–R4, nunca aporta ni cambia el canal y solo ve 'en trámite'; no recibe aviso de la revocación (default PROVISIONAL LD-23)."
    governedBy: ["DEC-BR-017 §7, §8", "REQ-CNS-TBD-08 AC-08.2", "LD-23"]
    testIds: [TEST-CNS-257]
  - id: INV-16
    statement: "Un adjunto (R10, R11, R12, RH2v, rights-case RC3a) nunca hace retroceder el estado de la Revocation ni crea una segunda Revocation abierta en la cadena."
    governedBy: ["SM-CNS-001 v7 §7 INV-16", "DEC-BR-018 R13-1"]
    testIds: [TEST-CNS-384]
  - id: INV-17
    statement: "Interino IT0: ningún RH3 surte efecto sin la co-firma de un segundo RIGHTS_OPERATOR distinto del que la registra."
    governedBy: ["SM-CNS-001 v7 §7 INV-17", "DEC-BR-018 R13-4"]
    testIds: [TEST-CNS-386]
  - id: INV-RV-10
    statement: "R14-C: re-consentir sobre la misma decisionChainKey y revocar la decisión nueva siempre llega a APPLIED, aunque la revocación del ciclo anterior siga en APPLIED, DOWNSTREAM_PENDING (incluido deliveryFailed) o DELIVERED; cada Revocation revoca solo su revokedDecisionRef."
    governedBy: ["DEC-BR-018 R14-C", "SM-CNS-001 v7 §5, §7 (NF-22)", "RULE-CNS-TBD-02", "AUDIT-H01-rev3 N-01"]
    testIds: [TEST-CNS-414, TEST-CNS-415, TEST-CNS-416, TEST-CNS-417]
  - id: INV-RV-11
    statement: "F-R14-04: todo REVOCATION_CONFIRMED de RH3 lleva recordedByRef y cosignedByRef (refs opacas UUIDv4 del principal de plataforma; nunca email, nombre ni el sub del IdP), distintos entre sí e iguales a recorded_by_ref / cosigned_by_ref de la confirmación; los cuatro ojos constan en la evidencia del ledger, no solo en una columna. Un append de RH3 sin cosignedByRef o con cosignedByRef = recordedByRef falla (sin CONFIRMED ni job); R3 y R3r no llevan ninguno de los dos (lista blanca)."
    governedBy: ["F-R14-04", "DEC-BR-018 (R14-B)", "SM-CNS-001 v7 §5.2 RH3, INV-17 (OPEN-RV-11 DECIDED, DEC-BR-018 A-58)", "DEC-BR-017 §6 (DEC-BR-018 A-57)", "INV-CM-05"]
    testIds: [TEST-CNS-447, TEST-CNS-448]
    testNotes:
      TEST-CNS-447: "RH3 completa: el REVOCATION_CONFIRMED del ledger trae recordedByRef y cosignedByRef UUIDv4, distintos, iguales a las columnas de la confirmación, sin PII (escáner); el verificador del ledger reconstruye los cuatro ojos solo desde el evento."
      TEST-CNS-448: "Append de RH3 sin cosignedByRef o con cosignedByRef = recordedByRef → falla sin CONFIRMED ni job APPLY_REVOCATION; R3/R3r con cosignedByRef o recordedByRef → rechazo por lista blanca (INV-CM-05)."
  - id: INV-RV-09
    statement: "Toda Revocation CONFIRMED tiene un job APPLY_REVOCATION pendiente o ya aplicado; no existe CONFIRMED huérfano, y una caída entre la confirmación y R4 termina en APPLIED al reanudar el worker."
    governedBy: ["SEC-CNS-012 P1-01 (técnico)", "SM-CNS-001 R0.1"]
    testIds: [TEST-CNS-331]

failClosed: >
  Rutas RIGHTS: todo fallo de credencial devuelve la respuesta uniforme y ofrece la vía siguiente
  (OTP → enlace → caso humano); nunca se deniega ni se lleva a FAILED por bloqueo, reloj o límite.
  Fallos de guard en R1–R3/R8/RH2/RH3 rechazan sin evento y conservan el estado. R4 es la única
  transición que se acepta con falla de clave (INV-RV-07). Ante duda sobre quién revoca o sobre
  la suficiencia de la verificación, el sistema no decide: el caso queda abierto (LD-02, LD-03).
  Las vías de salida de VERIFIED/CONFIRMED están definidas (R10, R11, R12, RH2v; R13-1); si ninguna es ejecutable (p. ej. dotación <4 personas, GRD-RC-15), la revocación conserva su estado y el caso queda abierto; nunca FAILED.

