failClosed: >
  Cualquier guard no satisfecho o no evaluable rechaza la transición sin evento (ERR-CM-06 /
  código específico). Token desconocido, expirado, rotado o de otro tenant → 404 uniforme.
  Contexto o participación no activos → la invitación conserva su estado (no pasa a terminal).

