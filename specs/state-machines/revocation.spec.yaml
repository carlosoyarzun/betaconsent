      - "P-v7-2 ACCEPTED (R14-A): no reinicia requestedAt ni limpia flags (SEC N-03)."
      - "El caso lo resuelve el servidor desde la cadena del handle; un caseRef del cliente se ignora (GRD-RC-14, SEC N-01)."
      - "Sobre VERIFIED: la verificación humana continúa con RH2v. Sobre CONFIRMED: R4 corre por job durable; el caso cierra con RC4/RC5."
    emits: [REVOCATION_REQUESTED]
    payloadValues: {scope: ALL, authPath: RECOVERY, recoveryMethod: HUMAN_ASSISTED, initiatedVia: "derivado en servidor (GRD-RV-25)", caseRef: required}
    idempotencyKey: "(revocationRef, caseRef)"
    errors: [ERR-RV-19, ERR-CM-09, ERR-CM-01, ERR-RV-13, ERR-RV-15, ERR-RV-04, ERR-RC-09]
    governedBy: ["SM-CNS-001 v7 §5.2 R12, RC3a", "DEC-BR-018 R13-1", "AUDIT F-H01-02", "SEC-CNS-013", "SEC-CNS-014"]
    testIds: [TEST-CNS-382, TEST-CNS-389, TEST-CNS-398, TEST-CNS-401, TEST-CNS-411]
    changeNote: "SEC-CNS-013 (P1, propuesta re-evaluada contra rev. 4c): antepone GRD-CM-01 (tenant resuelto en servidor); errors += ERR-CM-01 (onFail de GRD-CM-01, completitud F-SEC-013-02). Sin cambio de semántica. SEC-CNS-014 (2026-09-27, aprobado por Carlos, cierra OPEN-RV-12 sobre esta transición): errors += ERR-RV-13 (onFail de GRD-RV-19/GRD-RV-25/GRD-RV-28), ERR-RV-15 (onFail de GRD-RV-23), ERR-RV-04 (onFail de GRD-RC-08), ERR-RC-09 (onFail de GRD-RC-14). Sin cambio de semántica."
  - id: RH2v
