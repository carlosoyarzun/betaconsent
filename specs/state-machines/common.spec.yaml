invariants:
  - id: INV-CM-01
    statement: "El estado de todo agregado es proyección del ledger append-only; append + proyección + outbox en una sola transacción; no hay UPDATE de estado sin evento."
    governedBy: ["SM-CNS-001 R0.1", "ADR-002 §2, §4", "DEC-BR-014 §6", "MP §39"]
    testIds: [TEST-CNS-100]
  - id: INV-CM-02
    statement: "tenant_id es la única clave de aislamiento; organization_* nunca aparece en RLS, SET LOCAL, middleware, scopes, claves de cache ni UNIQUE de tablas TENANT."
    governedBy: ["DEC-BR-015 §1", "DEC-BR-016 §2", "ADR-006 §1", "DR2 D2"]
    testIds: [TEST-CNS-101]
  - id: INV-3
    statement: "Ninguna autorización cruza contexto ni tenant (0 accesos cross-tenant exitosos, incluida la reutilización de conexión A→B)."
    governedBy: ["SM-CNS-001 §7 INV-3", "ADR-006 §4–§6", "SEC-CNS-005 T-26", "DEC-BR-014 X5", "REQ-CNS-TBD-02 AC-02.3 (A→B: 0 filas)"]
    testIds: [TEST-CNS-102]
  - id: INV-CM-03
    statement: "Fail closed sin estado parcial ni evento; la única excepción es la revocación (R4, LD-05)."
    governedBy: ["SM-CNS-001 R0.3", "MP §29"]
    testIds: [TEST-CNS-103]
  - id: INV-CM-04
    statement: "Todo evento lleva environment ∈ {LOCAL, DEV, STAGING}, evidentiary = false y dataClass = 'SYNTHETIC' en IT0."
    governedBy: ["ADR-002 §2, §8", "DEC-BR-014 §4.5", "SEC-CNS-005 T-39"]
    testIds: [TEST-CNS-104]
  - id: INV-CM-05
    statement: "Payload de cada eventType = lista blanca de contracts/; un campo fuera de la lista o un valor fuera de enum hace fallar el append; cero PII, token, OTP, IP, HMAC o texto libre."
    governedBy: ["SM-CNS-001 §1", "ADR-002 §10, §11", "DEC-BR-017 §6", "REQ-CNS-TBD-05 AC-05.1", "SEC-CNS-005 T-38"]
    testIds: [TEST-CNS-105]
  - id: INV-12
    statement: "Ningún agente IA ni identidad de servicio pide, aprueba, habilita o recibe un grant de caso o diagnóstico, ni es actor HUMAN de una transición."
    governedBy: ["SM-CNS-001 §7 INV-12", "DEC-BR-017 §8", "MP §32"]
    testIds: [TEST-CNS-106]
  - id: INV-CM-06
    statement: "eligibility_to_participate != eligibility_to_revoke: ninguna ruta RIGHTS consulta estado/active de tenant, Study, SchoolParticipation, Enrollment, contexto ni BillingSubscription (revisión estática); la prueba dinámica es INV-6 (revocation)."
    governedBy: ["RULE-CNS-TBD-01", "DR2 D5", "DEC-BR-016 §8", "DEC-BR-017 §10", "REQ-CNS-TBD-01 AC-01.4", "SM-CNS-001 R0.6"]
    testIds: [TEST-CNS-107]
  - id: INV-CM-07
    statement: "Todos los guards son código determinista versionado; ningún modelo decide consentimiento, validez de OTP, autoridad del apoderado, revocación ni suficiencia de verificación."
    governedBy: ["SM-CNS-001:7", "MP §32", "CLAUDE.md Límites de IA"]
    testIds: [TEST-CNS-108]
  - id: INV-CM-08
    statement: "Un GET nunca consume un token ni transiciona un agregado (/i/, /m/, /r/ se canjean en backend con 303 a ruta sin token). /r/ responde 303 sin evaluar el token; la validez solo se revela en la página destino."
    governedBy: ["SM-CNS-001 §2.2", "ADR-001 §2", "SEC-CNS-005 T-01, T-20"]
    testIds: [TEST-CNS-109]
  - id: INV-CM-09
    statement: "Todas las refs (subjectRef, decisionMakerRef, invitationRef, chainRef, revocationRef, caseRef, channelRef, ...) son UUIDv4 aleatorios; channelHmac = HMAC(K, tenant_id ‖ email normalizado) vive solo en pii.channel, de modo que la misma dirección en dos tenants no coincide; decisionMakerRef (excepción: derivado, no aleatorio) = UUIDv4 de HMAC(K_dmref, dominio ‖ len(tenant_id) ‖ tenant_id ‖ canal normalizado), KEY_VERSION 2 (LEGAL DECISION, Carlos 2026-10-01, (a) por tenant: refs distintos y no correlacionables entre colegios, mismo ref dentro del mismo colegio; resuelto); integrity no tiene FKs a pii/app. OPEN-CM-09 (Carlos 2026-10-06): la version de clave del decisionMakerRef NO viaja en el valor (sigue UUIDv4) sino en el payload de los eventos de ledger que lo llevan (INVITATION_VERIFIED, DECISION_MAKER_CHANNEL_VERIFIED) como decisionMakerRefKeyVersion (entero 2..1000), OBLIGATORIO en el esquema de los eventos nuevos (Carlos 2026-10-06) y emitido desde la clave {key, keyVersion} que recibe el emisor; "ausente = v2" solo al LEER eventos previos (resolveDecisionMakerRefKeyVersion); el verificador falla cerrado si la version registrada supera la conocida; OPEN-CM-10: la clave se resuelve en un keyring version->secreto (un secreto propio y distinto por version; HKDF con info por version), con UNA version activa que calcula refs nuevos y las demas solo para verificar; el verificador lee la version del evento (ausente = v2) y recomputa con la clave de esa version, sin probarlas todas ni re-derivar con la clave vigente; version ausente, desconocida o invalida en el keyring -> error uniforme fail-closed que no revela cual; los errores y la serializacion del keyring nunca contienen secretos; config por entorno CNS_DECISION_MAKER_REF_SECRET (v2, legado: sola = keyring {2} activo 2), CNS_DECISION_MAKER_REF_SECRET_V<N> (N>=3, base64 >=32 bytes) y CNS_DECISION_MAKER_REF_ACTIVE_VERSION (obligatoria si hay secretos versionados); nombres versionados ^CNS_DECISION_MAKER_REF_SECRET_V([1-9]\d{0,3})$ (cualquier otra variable con ese prefijo, o una version repetida, falla cerrado), ACTIVE_VERSION ^[1-9]\d{0,3}$, base64 estricto (ida y vuelta); dos versiones con el mismo secreto se rechazan; fuera de LOCAL cualquier falta aborta. Los eventos historicos no se reescriben y el algoritmo de payloadHash/eventHash no cambia."
    governedBy: ["SM-CNS-001 §1", "ADR-002 §3", "DEC-BR-016 §2", "DR2 D8", "REQ-CNS-TBD-02 AC-02.2", "LEGAL DECISION, Carlos 2026-10-01, (a) por tenant"]
    testIds: [TEST-CNS-110, TEST-CNS-314, TEST-CNS-933, TEST-CNS-1050, TEST-CNS-1051, TEST-CNS-1052, TEST-CNS-1053, TEST-CNS-1054, TEST-CNS-1055, TEST-CNS-1056, TEST-CNS-1057, TEST-CNS-1210, TEST-CNS-1211, TEST-CNS-1212, TEST-CNS-1213, TEST-CNS-1214, TEST-CNS-1215]
  - id: INV-CM-10
    statement: "Ningún portador no verificado queda registrado como DECISION_MAKER; su actorRole es UNVERIFIED_BEARER y solo ejecuta las transiciones de actorModel.unverifiedBearer.may (= SM v7 INV-19)."
    governedBy: ["SM-CNS-001 v7 R0.2, §7 INV-19", "DEC-BR-018 R13-5", "AUDIT F-A03"]
    testIds: [TEST-CNS-313]
  - id: INV-CM-11
    statement: "Ninguna request HTTP ejecuta una rama SYSTEM ni FIXTURE de una transición: la fuente la fija la identidad de ejecución (GRD-CM-15) y app_rw y platform_rw no tienen EXECUTE sobre las funciones de esas ramas."
    governedBy: ["SEC-CNS-012 re-verificación rev. 4b N3-01", "SM-CNS-001 R0.2", "ADR-006 §6"]
    testIds: [TEST-CNS-444, TEST-CNS-445, TEST-CNS-446]

