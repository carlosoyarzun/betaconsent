      - "Acuse inmediato con revocationRef y recibo al canal ligado (REQ-CNS-033). Por RECOVERY, además aviso de 'revocación registrada' al canal ligado; la opción 'yo no hice esto' NO se emite en IT0 (rights-case RC1c enabled: false; LD-03/LD-04)."
