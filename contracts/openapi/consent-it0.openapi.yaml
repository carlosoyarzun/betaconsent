      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/api-payloads.schema.json#/$defs/SubmitOtpRequest'}
      responses:
        '200':
          description: V3 — verificado.
          content:
            application/json:
              schema: {$ref: '../schemas/api-payloads.schema.json#/$defs/OtpVerified'}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/UniformNotFound'}
        '422':
