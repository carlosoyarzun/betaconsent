scope:
  it0: >
    Revocación normal (authPath OTP), recuperación por enlace al canal ya ligado (RECOVERY /
    CHANNEL_LINK) y verificación humana con doble control y tercer humano (RECOVERY /
    HUMAN_ASSISTED), hasta COMPLETED contra el stub interno de producto consumidor (R5-1).
  notInIt0:
    - "Intake humano sin enlace (DEFERRED, adición r3 (a))"
    - "Revocación parcial por finalidad (RULE-CNS-027, contextos futuros): no modelada"
    - "SUSPENDED protector del caso abierto y diferir borrado downstream en HUMAN_ASSISTED (LD-04)"
    - "R8h: retiro de una revocación HUMAN_ASSISTED (enabled: false, OPEN-RV-07, LD-03)"
    - "Opción 'yo no hice esto' tras R4 (enabled: false, rights-case RC1c, LD-03/LD-04)"
  availability: >
    Disponible en cualquier estado de Study, tenant, SchoolParticipation, Enrollment,
    ConsentContext (incluido PAUSED) y BillingSubscription (DEFERRED): solo exige tenant existente
    y cadena del titular (R0.6, INV-6).
  blocksDataReal: "Sí: LD-02, LD-03 (definitivos de RH3 y R8h), LD-04, LD-05, LD-12, LD-22, LD-23, el cierre formal de SM v7 y la re-evaluación de NF-21 (R14-G) antes de datos reales."

vocabulary: # DEC-BR-017 §6; la lista blanca rechaza cualquier otro valor (incluidos los de la tabla de correspondencia)
  id: CFG-RV-VOCABULARY
  authPath: [OTP, RECOVERY]
  recoveryMethod: [CHANNEL_LINK, HUMAN_ASSISTED] # obligatorio si y solo si authPath = RECOVERY
  originPurposeRef: [STUDY_PARTICIPATION, AUDIO_RECORDING, AUTOMATED_ANALYSIS, HUMAN_REVIEW, ALL] # nunca null
  initiatedVia: [DECISION_MAKER, SCHOOL_REPORT] # SCHOOL_REPORT iff el caso tiene origin = SCHOOL_REPORTED; derivado en servidor
  escalationReason: [LIMIT_REACHED, CHANNEL_UNREACHABLE, REQUESTER_ASKED, SCHOOL_REPORTED, REQUEST_EXPIRED]
  failReason: [WITHDRAWN_BY_REQUESTER]
  scope: [ALL] # BETA_2026_01
  assuranceLevel: "LEGAL DECISION LD-02 (placeholder versionado en IT0; el código no fija un valor 'suficiente')"
  rejectedLegacyValues: ["authPath=HUMAN_ASSISTED", triggeringPurpose, method, RV0_LIMIT, NO_CHANNEL_ACCESS, "SCHOOL_REPORT (como origin)", "EXPIRED (como origin)"]
  guard: GRD-RV-19
  governedBy: ["DEC-BR-017 §6", "ADR-002 §10", "REQ-CNS-TBD-05 AC-05.1"]
  testIds: [TEST-CNS-262]

attributes:
  - revocationRef
  - tenantRef
  - chainRef # decisionChainKey resuelta en servidor
  - consentId
  - revokedDecisionRef # R14-C: consentId de la decisión GRANTED que esta Revocation revoca; derivado en servidor; la cadena (decisionChainKey) se conserva
  - scope
  - authPath
  - recoveryMethod
  - originPurposeRef
  - initiatedVia
  - recoveryRef # N:1 hacia la única revocationRef abierta (F-412)
  - caseRef # 1:1 hacia la revocationRef abierta
  - verificationRef # UNIQUE: un verificationRef verifica a lo sumo una revocación (SEC P1-05)
  - verifiedAuthPath # proyección del último REVOCATION_VERIFIED, escrita en su misma tx; CHECK NOT NULL si state ∈ {VERIFIED, CONFIRMED, APPLIED, DOWNSTREAM_PENDING, DELIVERED, COMPLETED} (SEC N2-02, GRD-RV-29)
  - verifiedRecoveryMethod # ídem; NOT NULL si verifiedAuthPath = RECOVERY
  - effectiveAt
  - requestedAt # base de P-19
  - sequence # expectedSequence en toda transición (GRD-RV-23)

flags:
  - id: FLAG-deliveryFailed
    appliesTo: [DOWNSTREAM_PENDING]
    guard: GRD-RV-12
    rule: "Se marca al agotar reintentos de entrega de consent.revoked (DLQ + alerta humana); no es estado ni terminal; nunca FAILED."
    governedBy: ["[N-SM] §6", "SM-CNS-001 §5"]
    testIds: [TEST-CNS-259]
  - id: FLAG-overdue
    appliesTo: [DOWNSTREAM_PENDING, DELIVERED]
    guard: GRD-CM-12
    rule: "Se marca al vencer el plazo de supresión (DEC-BR-006 LEGAL DECISION 1, sin valor en código): receipt 'pendiente de confirmación' + alerta humana."
    governedBy: ["[N-SM] §6", "DEC-BR-006 LEGAL DECISION 1"]
    testIds: [TEST-CNS-260]
  - id: FLAG-escalated
    appliesTo: [REQUESTED, VERIFIED, CONFIRMED]
    guard: GRD-RV-16
    rule: "Se marca cuando se abre o adjunta un RightsCase (R9, rights-case RC1); no es estado ni terminal; idempotente."
    governedBy: ["DEC-BR-017 §0.5, §4", "SM-CNS-001 §5 R9, §5.2 RC1"]
    testIds: [TEST-CNS-261]

knownConflicts:
  - id: OPEN-RV-05
    topic: "Alcance del handle MANAGE_ENTRY (SEC-CNS-012 P1-04)"
    sideA: "SM-CNS-001 §5.0 (SM:131) y ADR-006 §6.1 (A6:57): el handle 'habilita solo' V1 MANAGE/REVOCATION y RV0 (= GRD-RV-20)."
    sideB: "SM-CNS-001 §5.2 RC1 (SM:152), RC2u (SM:154), RC3 (SM:155) y DEC-BR-017 §3 (R5-4, decidido por Carlos): el mismo handle abre el caso, vuelve a la página del caso y expresa la intención."
    resolution: "DECIDIDO por Carlos (R13-3, CARLOS r3 :116): erratum SM-CNS-001 v7 §5.0 y ADR-006 §6.1 — el handle /m/ habilita V1, RV0 (trigger del portador), RC1, RC2u y RC3/RC3a, siempre al canal ligado. GRD-RV-20 refleja el alcance final."
    status: DECIDED
    blocksDataReal: false
    owner: Carlos

parametersRef:
  note: "Valores solo en SEC-CNS-006 rev. 5 §1."
  used: [P-13, P-14, P-15, P-16, P-17, P-18, P-19, P-21, P-23, P-28, P-30, P-31, P-36, P-37, P-38]

states:
  - id: REQUESTED
    initial: true
    terminal: false
    description: "Solicitud explícita registrada (R1 OTP, R1r RECOVERY link o RC3 HUMAN_ASSISTED)."
    governedBy: ["SM-CNS-001 §5 R1, §5.1 R1r, §5.2 RC3", "DEC-BR-017 §1"]
    testIds: [TEST-CNS-230, TEST-CNS-231, TEST-CNS-232]
  - id: VERIFIED
    initial: false
    terminal: false
    description: "Verificada por una vía de DEC-BR-017 §0.1 (OTP REVOCATION nuevo, enlace consumido o RH2 doble control). Si la vía se pierde, RECOVERY (R10) o el caso (R12 + RH2v) se adjuntan sin retroceso (R13-1)."
    governedBy: ["DEC-BR-017 §0.1", "SM-CNS-001 §5 R2, §5.1 R2r, §5.2 RH2"]
    testIds: [TEST-CNS-233, TEST-CNS-234, TEST-CNS-235]
  - id: CONFIRMED
    initial: false
    terminal: false
    description: "Confirmación explícita de retiro total por el DecisionMaker. Siempre con un job APPLY_REVOCATION durable encolado en la misma tx (INV-RV-09): no queda huérfano."
    governedBy: ["SM-CNS-001 §5 R3, §5.1 R3r, §5.2 RH3", "SEC-CNS-012 P1-01 (fix técnico)"]
    testIds: [TEST-CNS-236, TEST-CNS-237, TEST-CNS-238, TEST-CNS-331]
  - id: APPLIED
    initial: false
    terminal: false
    description: "CONSENT_REVOKED + outbox en una tx; effectiveAt = hora del append; acuse inmediato."
    governedBy: ["SM-CNS-001 §5 R4", "RULE-CNS-025", "REQ-CNS-033"]
    testIds: [TEST-CNS-239]
  - id: DOWNSTREAM_PENDING
    initial: false
    terminal: false
    description: "consent.revoked emitido al conjunto congelado de EventSubscriptions del tenant."
    governedBy: ["SM-CNS-001 §5 R5"]
    testIds: [TEST-CNS-240]
  - id: DELIVERED
    initial: false
    terminal: false
    description: "ACK firmado de toda EventSubscription del conjunto congelado; recibido, no suprimido (RULE-CNS-026)."
    governedBy: ["SM-CNS-001 §5 R6", "RULE-CNS-026"]
    testIds: [TEST-CNS-241]
  - id: COMPLETED
    initial: false
    terminal: true
    description: "Supresión atestada por el consumidor (erasure.confirmed verificado); nunca 'verificada'."
    governedBy: ["SM-CNS-001 §5 R7", "[N-SM] §6"]
    testIds: [TEST-CNS-242]
  - id: FAILED
    initial: false
    terminal: true
    description: "Solo por retiro explícito del solicitante (WITHDRAWN_BY_REQUESTER); después se admite una solicitud nueva."
    governedBy: ["DEC-BR-017 §0.3, §5", "SM-CNS-001 §5 R8"]
    testIds: [TEST-CNS-243]

transitions:
  - id: R1
    from: null
    to: REQUESTED
    command: RequestRevocation
    authPath: OTP
    actor: {actorType: HUMAN, actorRole: DECISION_MAKER}
    routeClass: RIGHTS
    httpPost: true
    guards: [GRD-CM-01, GRD-CM-02, GRD-CM-06, GRD-CM-07, GRD-CM-10, GRD-RV-01, GRD-RV-02, GRD-RV-04, GRD-RV-08, GRD-RV-19, GRD-RV-21, GRD-RV-23]
    revokedDecisionRef: "la decisión GRANTED vigente de la cadena, fijada en servidor (R14-C)"
    effects: ["Solo con POST explícito 'quiero revocar' desde sesión MANAGE verificada (V3 scope MANAGE desde el handle de /m/) cuyo parentRef es la cadena a revocar; abrir una página no crea solicitud."]
    emits: [REVOCATION_REQUESTED]
    payloadValues: {scope: ALL, authPath: OTP, initiatedVia: "derivado en servidor (GRD-RV-25 no aplica: sin caso → DECISION_MAKER)", originPurposeRef: "código de finalidad o ALL"}
    idempotencyKey: revocationRef
    errors: [ERR-CM-02, ERR-CM-01, ERR-CM-09, ERR-RV-01, ERR-RV-04, ERR-RV-14]
    governedBy: ["SM-CNS-001 §5 R1", "DEC-BR-017 §1 (S4-06c)", "REQ-CNS-TBD-02 AC-02.1", "SEC-CNS-012 P1-05"]
    testIds: [TEST-CNS-230, TEST-CNS-414, TEST-CNS-415, TEST-CNS-416]
  - id: R1r
    from: [null, REQUESTED]
    fromNote: "∅, o la REQUESTED abierta de la decisión vigente con cualquier authPath (OTP o HUMAN_ASSISTED; SEC N-02, R13-1). Desde VERIFIED rige R10; desde CONFIRMED, R11."
    to: REQUESTED
    command: RevokeWithRecoveryLink
    authPath: RECOVERY
    recoveryMethod: CHANNEL_LINK
    actor: {actorType: HUMAN, actorRole: DECISION_MAKER, credential: "portador del handle RECOVERY (P-18); el token prueba el control del canal ligado (DEC-BR-017 §8: actor DECISION_MAKER en todas las vías)"}
    routeClass: RIGHTS
    httpPost: true
    guards: [GRD-CM-01, GRD-CM-06, GRD-CM-10, GRD-RV-02, GRD-RV-04, GRD-RV-06, GRD-RV-18, GRD-RV-19, GRD-RV-23, GRD-RV-25]
    effects:
      - "Único POST con handle RECOVERY (cookie __Host-, creada por GET /r/<token> sin consumir); R1r, R2r y R3r ocurren en ese mismo POST."
      - "el GET /r/<token> solo fija el hash, sin validar ni consumir (303 uniforme); GRD-RV-06 se evalúa en este POST."
      - "Cada recoveryRef se consume una vez y se adjunta a la única revocación abierta de la decisión a la que el token está ligado (N:1; SEC N2-04: revoked_decision_ref del token = decisión del ciclo vigente, GRD-RV-06)."
      - "Replay: solo el mismo POST (misma Idempotency-Key y mismo handle RECOVERY dentro de P-18) devuelve la misma respuesta; cualquier otro uso de un token consumido da la respuesta uniforme de ERR-RV-05, nunca la revocationRef (SEC P2-06)."
      - "initiatedVia se deriva en servidor del origin del caso abierto de la cadena (SCHOOL_REPORT iff SCHOOL_REPORTED); nunca del cliente (SEC P2-17)."
    emits: [REVOCATION_REQUESTED]
    payloadValues: {scope: ALL, authPath: RECOVERY, recoveryMethod: CHANNEL_LINK, originPurposeRef: ALL, initiatedVia: "derivado en servidor (GRD-RV-25)", recoveryRef: required}
    idempotencyKey: "Idempotency-Key + handle RECOVERY (recoveryRef N:1 hacia la revocationRef abierta)"
    errors: [ERR-RV-05, ERR-RV-06, ERR-CM-09]
    governedBy: ["SM-CNS-001 v7 §5.1 R1r (cualquier authPath)", "SEC-CNS-012 re-verificación N-02", "DEC-BR-017 §2, §6", "REQ-CNS-TBD-03 AC-03.3, AC-03.5", "ADR-006 §6.2", "SEC-CNS-012 P2-06, P2-17"]
    testIds: [TEST-CNS-231, TEST-CNS-337, TEST-CNS-339, TEST-CNS-400, TEST-CNS-434]
    changeNote: "Carlos 2026-09-28 opción (a) + fe de erratas ADR-006 §6/§6.2; sin cambio de semántica."
  - id: RC3
    from: null
    fromNote: "Solo si la cadena no tiene Revocation abierta (SM:155). Con una Revocation ya abierta en cualquier estado no terminal aplica R12 (R13-1)."
    to: REQUESTED
    command: "Lado Revocation de rights-case RC3 (intención expresa del DecisionMaker en la página del caso)"
    authPath: RECOVERY
    recoveryMethod: HUMAN_ASSISTED
    sameLotAs: "rights-case:RC3"
    actor: {ref: UNVERIFIED_BEARER, writtenBy: "web (nunca el operador)", note: "P-v7-3 ACCEPTED (R14-A): el DecisionMaker queda probado por RH2"}
    routeClass: RIGHTS
    httpPost: true
    guards: [GRD-CM-01, GRD-CM-06, GRD-CM-07, GRD-CM-10, GRD-RV-02, GRD-RV-04, GRD-RV-19, GRD-RV-23, GRD-RV-25, GRD-RC-08, GRD-RC-14] # SEC-CNS-013: antepone GRD-CM-01 (GRD-RC-14 no cubre handle rotado/revocado)
    effects: ["Mismo lote atómico que la transición RC3 del RightsCase; caseRef 1:1 con la revocationRef."]
    emits: [REVOCATION_REQUESTED]
    payloadValues: {scope: ALL, authPath: RECOVERY, recoveryMethod: HUMAN_ASSISTED, initiatedVia: "derivado en servidor del origin del caso (GRD-RV-25)", caseRef: required}
    idempotencyKey: "revocationRef (caseRef 1:1)"
    errors: [ERR-RV-04, ERR-CM-09, ERR-CM-01, ERR-RV-02, ERR-RC-09, ERR-RV-13, ERR-RV-15]
    governedBy: ["SM-CNS-001 §5.2 RC3", "DEC-BR-017 §3, §6 (F-510)", "AUDIT F-H01-02", "SEC-CNS-013", "SEC-CNS-014"]
    testIds: [TEST-CNS-294, TEST-CNS-398]
    changeNote: "SEC-CNS-013 (P1, propuesta re-evaluada contra rev. 4c): antepone GRD-CM-01 (tenant resuelto en servidor); errors += ERR-CM-01, ERR-RV-02 (onFail de GRD-CM-01 y GRD-RV-02, GRD-RV-02 ya presente sin su error, completitud F-SEC-013-02), ERR-RC-09 (propuesta). GRD-RC-14 sigue sin cubrir handle rotado/revocado; solo GRD-CM-01 lo hace (residual anotado por la propuesta). Sin cambio de semántica. SEC-CNS-014 (2026-09-27, aprobado por Carlos, cierra el hueco de OPEN-RV-12 sobre esta transición): errors += ERR-RV-13 (onFail de GRD-RV-19 y GRD-RV-25), ERR-RV-15 (onFail de GRD-RV-23). Sin cambio de semántica."
  - id: R2
    from: REQUESTED
    to: VERIFIED
    command: VerifyRevocationOtp
    authPath: OTP
    actor: {actorType: HUMAN, actorRole: DECISION_MAKER}
    routeClass: RIGHTS
    httpPost: true
    guards: [GRD-CM-02, GRD-CM-06, GRD-CM-07, GRD-CM-10, GRD-RV-05, GRD-RV-08, GRD-RV-19, GRD-RV-21, GRD-RV-23]
    effects: ["Consume el V3 scope REVOCATION de la misma cadena, posterior a R1; nunca se aplica throttle a una revocación verificada (T10/T11)."]
    emits: [REVOCATION_VERIFIED]
    payloadValues: {authPath: OTP, verificationRef: required, assuranceLevel: "placeholder LD-02"}
    idempotencyKey: revocationRef
    errors: [ERR-CM-02, ERR-RV-03, ERR-RV-14, ERR-CM-09]
    governedBy: ["SM-CNS-001 §5 R2", "DEC-BR-017 §0.1 (a), §1", "CARLOS r3 R5-3", "REQ-CNS-TBD-02 AC-02.4", "SEC-CNS-012 P1-05"]
    testIds: [TEST-CNS-233, TEST-CNS-327, TEST-CNS-329]
  - id: R2r
    from: REQUESTED
    to: VERIFIED
    command: "(mismo POST de R1r)"
    authPath: RECOVERY
    recoveryMethod: CHANNEL_LINK
    actor: {actorType: HUMAN, actorRole: DECISION_MAKER}
    routeClass: RIGHTS
    httpPost: false # parte del POST de R1r, que ya lleva GRD-CM-10
    guards: [GRD-RV-06, GRD-RV-18, GRD-RV-19, GRD-RV-23]
    effects: ["Token de recuperación consumido en la tx (consumed_at); control del canal ligado = factor verificado; equivalencia con 'same strength': LD-02."]
    emits: [REVOCATION_VERIFIED]
    payloadValues: {authPath: RECOVERY, recoveryMethod: CHANNEL_LINK, recoveryRef: required, assuranceLevel: "placeholder LD-02"}
    idempotencyKey: "revocationRef (recoveryRef consumido una vez)"
    errors: [ERR-RV-05]
    governedBy: ["SM-CNS-001 §5.1 R2r", "DEC-BR-017 §0.1 (b)", "LD-02"]
    testIds: [TEST-CNS-234]
  - id: RH2
    from: REQUESTED
    to: VERIFIED
    command: "propose_case_verification + approve_case_verification (funciones SECURITY DEFINER)"
    authPath: RECOVERY
    recoveryMethod: HUMAN_ASSISTED
    actor:
