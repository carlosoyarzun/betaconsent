components:
  securitySchemes:
    caseSession:
      type: apiKey
      in: cookie
      name: __Host-cns-case
      description: Movido desde consent-it0 (sesion CASE, specs/session.spec.yaml). Nombre de cookie ilustrativo (P-26).
    platformSession:
      type: apiKey
      in: cookie
      name: __Host-cns-platform
      description: Movido desde consent-it0. Sesion PLATFORM; documenta la asercion ATTESTED del login (N7). Nombre de cookie ilustrativo (P-26).
    oidcState:
      type: apiKey
      in: cookie
      name: __Host-cns-oidc
      description: Nuevo. `state` del flujo OIDC con vida de minutos (HttpOnly, Secure, SameSite=Lax: necesario para el retorno top-level desde el IdP). Nombre de cookie ilustrativo (P-26).
    oidcExchange:
      type: apiKey
      in: cookie
      name: __Host-cns-oidc-ex
      description: G-8. Unico portador del exchangeRef (HttpOnly, Secure, SameSite=Strict). Nunca en URL, cuerpo ni headers. Nombre de cookie ilustrativo (P-26).
