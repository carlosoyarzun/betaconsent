    emitsEvent: none
    governedBy: ["REQ-CNS-TBD-03 AC-03.4", "SEC-CNS-005 T-18"]
    testIds: [TEST-CNS-247]
  - id: ERR-RV-07
    code: RH2_SEPARATION_OF_DUTIES_VIOLATION
    response: "Rechazo (mismo principal, aprobador de un grant del caso, receptor, rol inválido, Membership TENANT); el caso sigue abierto, sin timer que lo cierre. Dotación menor que 4 personas: ERR-RC-10 (GRD-RC-15, R14-B)"
    emitsEvent: none
    governedBy: ["ADR-006 §6.3", "SEC-CNS-006 P-38", "SEC-CNS-005 TS-16e"]
    testIds: [TEST-CNS-235]
  - id: ERR-RV-08
    code: ASSERTION_NOT_ATTESTED
    response: "Sin efecto hasta ATTESTED; aserción rechazada revoca la propuesta/grant y alerta; PENDING por JWKS no incorporado = fallo cerrado"
    emitsEvent: none
    governedBy: ["INV-13", "SEC-CNS-006 P-36", "ADR-006 §6.3"]
    testIds: [TEST-CNS-238, TEST-CNS-297]
  - id: ERR-RV-10
    code: DOWNSTREAM_ACK_INVALID
    response: "El stub rechaza firma inválida o repetida; ACK/atestación falsos no avanzan el estado"
    emitsEvent: none
    governedBy: ["SEC-CNS-005 T-40, TS-29"]
    testIds: [TEST-CNS-241]
  - id: ERR-RV-11
    code: REVOCATION_FAIL_NOT_ALLOWED
    response: "Rechazo de cualquier intento de FAILED distinto de R8 (timer, OTP inválido/agotado, post-APPLIED); nunca volver a GRANTED"
