    testIds: [TEST-CNS-333]
  - id: ERR-RV-16
    code: REVOCATION_NOT_CONFIRMED
    response: "El job APPLY_REVOCATION termina sin efecto (la revocación ya no está CONFIRMED: FAILED por R8 o ya APPLIED); nunca un segundo CONSENT_REVOKED"
