version: 1
policy_precedence: "docs/agentic/model-routing.md > this file"

supervisor:
  model: claude-fable-5-1
  role: orchestrator
  may_read_sources: false
  may_edit_product_code: false

tiers:
  T0:
    name: Supervisor
    model: claude-fable-5-1
  T1:
    name: Reasoning
    model: claude-opus-5
  T2:
    name: Execution
    model: claude-sonnet-5
  T3:
    name: Retrieval
    model: claude-haiku-4-5

agents:
  - name: medina-scout
    master_plan_role: MEDINA
    tier: T3
    model: claude-haiku-4-5
    effort: low
    max_turns: 30
    may_write_code: false
    may_write_jira: false
    may_write_notion: false

  - name: medina-synth
    master_plan_role: MEDINA
    tier: T2
    model: claude-sonnet-5
    effort: medium
    max_turns: 40
    may_write_code: false
    may_write_jira: false
    may_write_notion: false

  - name: santos-product
    master_plan_role: SANTOS
    tier: T1
    model: claude-opus-5
    effort: high
    max_turns: 40
    may_write_code: false
    may_write_jira: false
    may_write_notion: false

  - name: ravena-ux
    master_plan_role: RAVENA
    tier: T2
    model: claude-sonnet-5
    effort: medium
    max_turns: 40
    may_write_code: false
    may_write_jira: false
    may_write_notion: false

  - name: gaona-measure
    master_plan_role: GAONA
    tier: T2
