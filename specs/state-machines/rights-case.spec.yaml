events:
  - id: RIGHTS_CASE_OPENED
    stream: LEDGER
    emittedBy: [RC0, RC1, RC1c]
    payload: [caseRef, reasonCode, initiatedVia] # reasonCode = escalationReason
    governedBy: ["DEC-BR-017 §6"]
    testIds: [TEST-CNS-290, TEST-CNS-291]
  - id: RIGHTS_CASE_CONTACTING
    stream: LEDGER
    emittedBy: [RC2, RC2u]
    payload: [caseRef, recoveryRef] # recoveryRef ausente si origin = CHANNEL_UNREACHABLE
    governedBy: ["DEC-BR-017 §6", "ADR-002 §10"]
    testIds: [TEST-CNS-292, TEST-CNS-293]
  - id: RIGHTS_CASE_CLOSED
    stream: LEDGER
    emittedBy: [RC4.RESOLVED, RC4.WITHDRAWN, RC5, RC6]
    payload: [caseRef, outcome]
    governedBy: ["DEC-BR-017 §6"]
    testIds: [TEST-CNS-295, TEST-CNS-296]

invariants:
  - id: INV-13
    statement: "Ningún grant ni RH2 surte efecto sin las aserciones del IdP atestadas por integrity_verifier; tras atestar o rechazar, grant_assertion guarda solo el hash del ID token + claims verificados."
    governedBy: ["SM-CNS-001 §7 INV-13", "ADR-006 §6.3 (S6-01)", "CARLOS r3 R6-4"]
    testIds: [TEST-CNS-297]
  - id: INV-14
    statement: "Ningún RH2 surte efecto si su aprobador es el receptor o el aprobador de algún grant del caso (tres humanos)."
    governedBy: ["SM-CNS-001 §7 INV-14", "CARLOS r3 R7-4", "SEC-CNS-006 P-38"]
    testIds: [TEST-CNS-298]
  - id: INV-15
    statement: "Toda renovación de un rights_case_grant tiene el approved_by_ref del grant original (FK compuesta + CHECK)."
    governedBy: ["SM-CNS-001 §7 INV-15", "CARLOS r3 R7-5", "ADR-006 §6.3", "REQ-CNS-TBD-06 AC-06.6"]
    testIds: [TEST-CNS-299]
  - id: INV-RC-01
    statement: "El RightsCase no tiene estado de expiración ni de rechazo; ningún timer lo cierra (INV-10); nunca deniega."
    governedBy: ["SM-CNS-001 §5.2", "DEC-BR-017 §4, §5", "RULE-CNS-TBD-02", "ADR-002 §10"]
    testIds: [TEST-CNS-300]
  - id: INV-RC-02
    statement: "Todo caso tiene chainRef; no existe rights_case con chain_ref nulo ni intake sin enlace en IT0."
    governedBy: ["SM-CNS-001 §5.2", "ADR-002 §10", "SEC-CNS-005 TS-24"]
    testIds: [TEST-CNS-301]
  - id: INV-RC-03
    statement: "El solicitante ve solo 'en revisión' y el paso del guion versionado; la página del caso no muestra plazo ni fecha comprometida."
    governedBy: ["DEC-BR-017 §3, §4", "CARLOS r3 R7-2", "SEC-CNS-005 TS-24d"]
    testIds: [TEST-CNS-302]
  - id: INV-RC-04
    statement: "Cada transición del caso va al ledger con caseRef; cada lectura del operador va a ops.access_log (append-only, sin PII), no al ledger."
    governedBy: ["SM-CNS-001 §5.2 (S4-16)", "ADR-002 §10", "ADR-006 §6.3", "DEC-BR-014 X6"]
    testIds: [TEST-CNS-303]
  - id: INV-RC-06
    statement: "Todo caso cuya Revocation de la cadena llegó a APPLIED o FAILED sale de CONTACTING/IN_VERIFICATION por RC4, RC5 o RC6; ningún caso queda en CONTACTING tras el cierre de su revocación."
    governedBy: ["CARLOS r3 R13-1", "SM-CNS-001 v7 §5.2"]
    testIds: [TEST-CNS-391, TEST-CNS-392]
  - id: INV-RC-05
    statement: "El colegio (INVITER/TENANT_ADMIN, School Champion) solo reporta: nunca ejecuta R1–R4 ni RH2/RH3, nunca aporta ni cambia canal y solo ve 'en trámite'; sin aviso al colegio por defecto (LD-23)."
    governedBy: ["DEC-BR-017 §7, §8", "CARLOS r3 C", "REQ-CNS-TBD-08 AC-08.2"]
    testIds: [TEST-CNS-304]

failClosed: >
  Ante cualquier fallo de guard del operador (sesión, grant, atestación, separación de funciones,
  step-up) la acción se rechaza sin efecto y el caso sigue abierto; nunca se degrada a menos
  humanos ni a una decisión automática. Vencido el SLA placeholder solo se marca overdue.
  El sistema no decide si quien pide es el apoderado ni la suficiencia de la verificación.

