openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Consent App - API HTTP del proceso platform (esqueleto)
  version: 0.0.1-outline
  x-api-id: API-CNS-TBD-P00
  x-status: OUTLINE
  x-it0-only: IT0b
  x-data-class: SYNTHETIC_ONLY
  x-governed-by:
    - "ADR-010 rev. 4 §4.1, §4.3, §4.4, §4.6 (PR-3 a PR-6)"
    - specs/db-roles.spec.yaml
    - specs/session.spec.yaml
    - "Q-17 (a), Carlos 2026-10-11: la consola STAFF del colegio (/staff/*) NO se mueve; sigue en consent-it0.openapi.yaml, servida por web con app_rw y RLS por tenant"
  x-human-gate: "Ningun contrato esta aprobado; cierre = human gate de Carlos."
  description: |
    Esqueleto: solo paths, scopes y estado de entrega. Los schemas completos se escriben en PR-3 a PR-5.
    Cubre solo al equipo de LectorPro (sesiones CASE y PLATFORM) en el proceso `platform`, sin egress. El verifier no expone HTTP.

    Operaciones movidas desde consent-it0.openapi.yaml conservan su `x-api-id`; alli quedan con `x-moved-to`.
    Las operaciones nuevas usan `API-CNS-TBD-Pnn` (rango 100-199 sin reconciliar con Notion, OPEN-CT-04).

    Reglas transversales (heredadas de API-CNS-100):
    - Cero PII en path y query.
    - Todo POST exige CSRF + Origin exacto (GRD-CM-10).
    - Ningun GET transiciona (INV-CM-08).
    - El actor se toma de la sesion, nunca del body.
    - Respuestas 404 uniformes.
    - Excepcion de tenantRef (F-A10-07; decision de Carlos 2026-10-11 (4)): API-CNS-100 dice "ningun request acepta tenantRef". La excepcion aplica SOLO en esta API del proceso `platform` (equipo de LectorPro, clase PLATFORM con step-up): el aprovisionamiento de membership (Q4) y de role-assignment (cross-tenant) necesita el tenant destino. La via web (consola STAFF, app_rw, `POST /staff/membership-requests` en consent-it0) NO lo acepta: lo deriva de la sesion STAFF.
    - Nadie aprueba su propio acceso (decision de Carlos 2026-10-11 (6)): la aprobacion de una membership o de un rol exige un aprobador distinto del solicitante Y distinto del principal que recibe el acceso; la base lo impone (CHECK approved_by_ref <> principal_ref y reason_code SELF_ACCESS). Un DENY responde un error generico uniforme: el motivo queda en platform.authorization_check, no en la respuesta (F-A10-13).
    - Enums de rol fijos (decision de Carlos 2026-10-11 (2)): membership TENANT_ADMIN | INVITER; plataforma PLATFORM | RIGHTS_OPERATOR | APPROVER (clase PRIVACY_LEGAL | SECURITY) | CONTEXT_OWNER. `principalRef` es un UUIDv4 opaco.

    Extensiones por operacion: `x-session`, `x-roles`, `x-step-up` (accion del nonce, P-36), `x-db-role`, `x-db-function` (las de case_state.* son de transition_owner, Q-18; las de platform.*, de grant_owner o membership_owner), `x-authorize` (platform.authorize(), 4.6; por definir), `x-delivery` (PR de entrega).
  x-pending:
    - "OPEN-CT-04: rango API-CNS reconciliar con Notion."
    - "F-A10-07: excepcion tenantRef para la clase PLATFORM — decidida por Carlos el 2026-10-11 (4): solo en esta API; falta revision de lampone-security."
    - "P-26 / APR-IDP: nombres de cookie y parametros del IdP pendientes (PENDING - Carlos / studio)."
  x-not-exposed:
    - "Canje del code, ATTESTED/REJECTED, checkpoints y alertas de break-glass: proceso verifier, sin HTTP."
    - "Bootstrap y re-bootstrap de principals PLATFORM (Q10): LOCAL = fixture sintetico (db/fixtures/local/0002_platform_bootstrap.sql, decision de Carlos 2026-10-11 (3)); STAGING y datos reales = ceremonia de break-glass de PR-7, no implementada."
    - "Vinculo principal_ref <-> sub_hmac (platform.principal_identity): sin operacion HTTP; fuera de LOCAL queda pendiente (OI-DBR-09 de specs/db-roles.spec.yaml)."
    - "platform.record_assertion, platform.record_login_assertion, claim_oidc_exchange y purge_expired_oidc_exchange: las ejecutan el verifier y el worker; platform solo inicia y completa con platform.begin_oidc_authorization / complete_oidc_callback (sin SELECT sobre la cola; enqueue_oidc_exchange se retiro en 0051)."
    - "Funciones SYSTEM (R4-R7, R9+RC1, RC2+RV0): las ejecuta worker."
    - "R8h y RC1c: deshabilitadas (LEGAL DECISION LD-03/LD-04)."
  x-stays-in-it0: "/i/, /m/, /r/, /invitation/open, /otp/*, /decision/*, /manage/revocation*, /manage/recovery-link, /recovery/revoke, /rights-case/*, y toda la consola STAFF (/staff/*; staffSession, RLS por tenant). Solicitud de membership de un TENANT_ADMIN: ruta nueva POST /staff/membership-requests en consent-it0 (fuera de este PR); la aprobacion es siempre la operacion approveMembership."
servers:
  - url: https://platform.invalid
    description: placeholder; sin host real
tags:
  - name: platform
paths:
  /platform/auth/login:
    get:
      operationId: platformAuthLogin
      x-api-id: API-CNS-TBD-P01
      tags: [platform]
      summary: "platformAuthLogin - Query kind={CASE|PLATFORM} (+ caseRef si kind=CASE). 302 al IdP (code + PKCE S256, scope openid, max_age=0 y prompt=login: reautenticacion obligatoria, G-5) y cookie `state` (SameSite=Lax)."
      description: |
        ADR-010 rev. 5 §5.2 (PR-6b). Sin sesion previa (kind=PLATFORM): el principal NO existe todavia; la base lo resuelve por sub_hmac en el callback.
        kind=CASE exige sesion PLATFORM vigente y `caseRef` destino (se envia solo su sha256 como target_ref_hash; F-PR6-27, G-7). kind=CASE se entrega en PR-6c.
        Limite P-49 (por IP truncada, en memoria, sin persistir) y tope global P-53. Excedidos: 404 uniforme.
      x-roles: "none"
      x-step-up: "LOGIN_<kind>"
      x-db-role: "platform_rw"
      x-db-function: "platform.begin_oidc_authorization"
      x-delivery: "PR-6b (kind=PLATFORM); PR-6c (kind=CASE)"
      parameters:
        - {name: kind, in: query, required: true, schema: {type: string, enum: [PLATFORM, CASE]}}
        - {name: caseRef, in: query, required: false, description: "Solo kind=CASE (PR-6c): case_ref destino; la base guarda sha256(caseRef) como target_ref_hash.", schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
  /platform/auth/callback:
    get:
      operationId: platformAuthCallback
      x-api-id: API-CNS-TBD-P02
      tags: [platform]
      summary: "platformAuthCallback - Compara la cookie `state` con el query en tiempo constante; platform.complete_oidc_callback (AWAITING_CALLBACK a PENDING); 303 a una ruta sin code ni ref y Referrer-Policy no-referrer."
      description: |
        G-8 (Carlos, 2026-10-15): el `exchangeRef` NUNCA va en la URL. Se entrega solo en la cookie `__Host-` (HttpOnly, Secure, SameSite=Strict) `oidcExchange`. No se acepta en cuerpo, headers ni parametros.
        Si `state` falta, es ajeno, esta reusado o vencido: no se encola nada y se responde 404 uniforme (cuenta para P-49).
      x-session: oidcState
      x-roles: "none"
      x-step-up: "none"
      x-db-role: "platform_rw"
      x-db-function: "platform.complete_oidc_callback"
      x-delivery: "PR-6b"
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      security: [{oidcState: []}]
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
  /platform/auth/exchange:
    get:
      operationId: platformAuthExchangeStatus
      x-api-id: API-CNS-TBD-P03
      tags: [platform]
      summary: "platformAuthExchangeStatus - Estado de la solicitud (AWAITING_CALLBACK/PENDING/ATTESTED/REJECTED), sin code ni claims. Sin parametros: el exchangeRef sale SOLO de la cookie `oidcExchange` (G-8)."
      description: |
        Cambio de contrato (G-8): antes `/platform/auth/exchanges/{exchangeRef}`. Ahora la ruta no lleva la ref en la URL; se exigen ambas cookies (`oidcState` y `oidcExchange`) y la base verifica sha256(state) = state_hash.
      x-session: oidcState
      x-roles: "none"
      x-step-up: "none"
      x-db-role: "platform_rw"
      x-db-function: "platform.exchange_status"
      x-delivery: "PR-6b"
      security: [{oidcState: [], oidcExchange: []}]
      responses:
        '200':
          description: OUTLINE - respuesta por definir en PR-3 a PR-5.
        '404':
          description: Respuesta uniforme.
