      tags: [bearer-otp]
      summary: V2/V3 — enviar código (CODE_SENT → CODE_SENT | VERIFIED); V4/V6/V6r/V6c internos
      description: |
        V3 (acierto) rota el ID de sesión (P-30) y, en scope DECISION, dispara I5 (OPENED → VERIFIED)
        en el mismo lote. Verificar no es consentir (INV-OT-01; INV-IV-05). El código es writeOnly.
        El rechazo no revela intentos restantes ni estado del presupuesto; en scope REVOCATION/MANAGE
        lleva rightsPathsAvailable y nunca «denegado» (ERR-OT-07).
      x-governed-by: ["otp-challenge.spec V2, V3, V4, V6, V6r, V6c", "SM-CNS-001 §3 V2, V3, §3.1", "SEC-CNS-006 P-03, P-04, P-27, P-28, P-30", "AUDIT F-A02", "SEC-CNS-012 P2-02"]
      x-state-transition:
