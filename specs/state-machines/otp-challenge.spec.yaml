    testIds: [TEST-CNS-153]

invariants:
  - id: INV-OT-01
    statement: "VERIFIED prueba solo control del canal (email); no prueba identidad civil ni autoridad legal; verificar ≠ consentir."
    governedBy: ["SM-CNS-001 R0.8", "[N-SM] §3", "P03"]
    testIds: [TEST-CNS-159]
  - id: INV-OT-02
    statement: "El código OTP nunca se guarda ni registra en claro (solo codeHmac); no aparece en ledger, security stream, logs ni evidencia."
    governedBy: ["[N-SM] §3", "SEC-CNS-006 P-08", "ADR-002 §3"]
    testIds: [TEST-CNS-160]
  - id: INV-OT-03
    statement: "Bajo intentos concurrentes nunca se superan N por código ni G por clave (reserva atómica previa a la comparación)."
    governedBy: ["SM-CNS-001 §3 'Atomicidad'", "SEC-CNS-005 T-08, TS-10"]
    testIds: [TEST-CNS-161]
  - id: INV-OT-04
    statement: "El presupuesto es independiente por scope_class: agotar DECISION no reduce el cupo RIGHTS y viceversa."
    governedBy: ["SEC-CNS-006 P-05", "CARLOS r3 R6-2", "REQ-CNS-TBD-07 AC-07.2", "SEC-CNS-005 T-09"]
    testIds: [TEST-CNS-162]
  - id: INV-OT-05
    statement: "'3 LOCKED → FAILED' existe solo en DECISION; en RIGHTS ningún conteo de LOCKED produce FAILED."
    governedBy: ["SEC-CNS-006 P-07", "SM-CNS-001 §3 V6, V6r"]
    testIds: [TEST-CNS-163]
  - id: INV-OT-06
    statement: "Ningún límite RIGHTS elimina la vía de revocación: todo agotamiento deriva a RECOVERY, RightsCase o enlace rotado; nunca a denegación ni a Revocation FAILED."
    governedBy: ["SM-CNS-001 R0.7", "RULE-CNS-TBD-02", "DEC-BR-017 §9", "CARLOS r3 F"]
    testIds: [TEST-CNS-164]
  - id: INV-OT-07
    statement: "Transiciones inválidas: EXPIRED/LOCKED/FAILED → VERIFIED; replay de un challenge consumido; ligar a un id del cliente; usar VERIFIED DECISION para revocar."
    governedBy: ["SM-CNS-001 §3 'Inválidas'"]
    testIds: [TEST-CNS-165]
  - id: INV-18
    statement: "Un challenge LOCKED no tiene transiciones de salida; '3 LOCKED' y los presupuestos se cuentan en el padre (V6a)."
    governedBy: ["SM-CNS-001 v7 §7 INV-18", "CARLOS r3 R13-7"]
    testIds: [TEST-CNS-394]
  - id: INV-OT-08
    statement: "El security stream no es ledger de consentimiento: solo refs (channelRef, signalRef), RLS por tenant; la señal de red vive como HMAC en pii.network_signal."
    governedBy: ["SM-CNS-001 §3 'Security stream'", "SEC F03", "ADR-002 §3"]
    testIds: [TEST-CNS-166]

failClosed: >
  Cualquier reserva atómica (intento o presupuesto) que no devuelva fila rechaza sin comparar.
  Canal no ligado, padre inválido o scope incorrecto → respuesta uniforme sin envío. En clase
  RIGHTS el cierre nunca es denegación de la revocación: la respuesta ofrece RECOVERY y caso humano.

