        - {machine: DecisionMakerVerification, id: V3, from: CODE_SENT, to: VERIFIED, sideEffects: ["invitation I5 (scope DECISION)"]}
        - {machine: DecisionMakerVerification, id: V4, from: CODE_SENT, to: LOCKED, internal: true}
        - {machine: DecisionMakerVerification, id: V6, from: CODE_SENT, to: FAILED, internal: true}
        - {machine: DecisionMakerVerification, id: V6r, from: CODE_SENT, to: FAILED, internal: true}
