  - "[N-SM] §6 Revocation enmendada por DEC-BR-017 §0 (0.1–0.8; publicada en Notion, Fase 4)"
  - "DEC-BR-017 §1–§10 (ACCEPTED 2026-09-25) — vocabulario canónico §6"
