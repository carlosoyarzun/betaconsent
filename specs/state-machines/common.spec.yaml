# Reglas transversales de las máquinas de estado IT0 (H01 / CA-116), rev. 4 (SM-CNS-001 v7 + R14-A, R14-F).
# rev. 4g (2026-10-07, OPEN-CM-10): keyring version->secreto para la clave de decisionMakerRef; OPEN-CM-10 RESUELTO (implementado; revision de lampone-security pendiente); INV-CM-09 actualizado; TEST-CNS-1238..1241.
# rev. 4f (2026-10-06, OPEN-CM-09, Carlos 2026-10-06): decisionMakerRefKeyVersion OBLIGATORIO en el payload de INVITATION_VERIFIED y DECISION_MAKER_CHANNEL_VERIFIED (ausente = v2 solo al leer); OPEN-CM-09 resuelto; OPEN-CM-10 nuevo; INV-CM-09 y TEST-CNS-1210..1215.
# rev. 4e (2026-09-27, DEC-BR-018): alinea con DEC-BR-018 (ACCEPTED 2026-09-27) — OPEN-CM-08 pasa a DECIDED (cierra F-007, deriva de A-15/A-16); citas R13-5/R14-F. Reemplaza citas de gobierno a scratchpad (CARLOS r3 R13-N/R14-X puros, S/PROPUESTA-Q18.md, S/R14-derivados.md) por DEC-BR-018; deja sin mapeo claro CARLOS r3 con codigos R1-R12/H1/C/F/(a), SM:NNN y DEC-BR-015:NN. Sin cambio de guards, errors ni semantica de consentimiento/revocacion/elegibilidad.
# rev. 4d (2026-09-27): SEC-CNS-013 (lampone-security, propuesta re-evaluada contra rev. 4c): aclara GRD-CM-07
# para recordedActor fijo (RH2/RH2v/RH3) y añade a ERR-CM-10 la nota de respuesta externa uniforme en
# rutas del portador; suma RV0-sistema y RC2 a la lista de funciones cubiertas por GRD-CM-15.
# rev. 4c (2026-09-27): SEC-CNS-012 re-verificación rev. 4b N3-01 (fuente SYSTEM/FIXTURE desde la identidad de ejecución: GRD-CM-15, INV-CM-11).
# rev. 4b (2026-09-27): SEC-CNS-012 re-verificación rev. 4 N2-01 (convención guardsBySource), N2-02 (rejectsOnIntegrity), N2-06 (FIXTURE: CHECK de DB, environment de catálogo, canal de seed).
# rev. 2 (2026-09-27): correcciones de SEC-CNS-012 (SEC-review-CA116) y AUDIT-H01.
# Las demás specs referencian por ID los guards (GRD-CM-*), errores (ERR-CM-*),
# invariantes (INV-CM-*, INV-3, INV-12) y el actor UNVERIFIED_BEARER declarados aquí. Cero PII.
# rev. 0.4.4 (2026-10-02, API-CNS-116, DEC-BR-019): ERR-CM-13 LIST_QUERY_INVALID; extension de ERR-CM-12 (503 del GET /staff/roster). Regla de GET STAFF: sin token CSRF (INV-CM-08, no transiciona); JSON exige Sec-Fetch-Site same-origin y Origin identico si viene (404 uniforme), porque la cookie de sesion es SameSite=Lax.
specId: SPEC-CNS-SM-COMMON
title: "State machines IT0 — reglas transversales (tenancy, clases de ruta, ledger, actor, fail-closed)"
smId: SM-CNS-001
smSection: "§0, §1, §7 (el §6 se modela en tenant-context.spec.yaml, solo en lo que afecta a las cinco máquinas)"
version: "0.4.4"
status: PROPOSED
jiraStory: CA-116
owner: lampone-architect
reviewers:
  - lampone-security # tenancy, OTP, ledger y rutas RIGHTS (ruta crítica)
  - lampone-qa # dueño de la numeración TEST-CNS-### (rango propuesto pendiente de reconciliar)
  - carlosoyarzun # human gate: cierre de la spec y de todo ítem OPEN / LEGAL DECISION
humanGate: "Solo Carlos cierra esta spec (status PROPOSED hasta revisión humana; CLAUDE.md, human gates)."
reviewInputs: ["SEC-CNS-012 (SEC-review-CA116.md, 2026-09-27)", "AUDIT-H01.md (2026-09-27)"]
governedBy:
  - "SM-CNS-001 v6 §0 (R0.1–R0.10), §1, §7 — ACCEPTED para el subconjunto IT0 (Carlos, r3 'Aprobación formal', 2026-09-25)"
  - "SM-CNS-001 v7 R0.2 (UNVERIFIED_BEARER, R13-5), INV-16…INV-19 — contenido aprobado en R13 (CARLOS r3 :112-120); enmienda PROPOSED hasta cierre"
  - "DEC-BR-014 rev. 8 §1 (alcance IT0), §4 (synthetic-only), §6 (ledger básico, actor, FIXTURE) — ACCEPTED 2026-09-26 (R11-A)"
  - "DEC-BR-015 §1–§5 (tenant = colegio, tenant_id única clave) — ACCEPTED 2026-09-25"
  - "DEC-BR-016 §1, §2, §4, §8 (partes IT0; invariante D5) — ACCEPTED 2026-09-25"
  - "DEC-BR-017 §6, §8, §10 — ACCEPTED 2026-09-25"
  - "REQ-CNS-TBD-01, REQ-CNS-TBD-02, REQ-CNS-TBD-07, RULE-CNS-TBD-01 (REQ-REC; IDs placeholder hasta registro en Notion, E-12)"
