# Gobierna: DEC de Carlos "Reconstrucción mínima de Consent App para un colegio beta" (2026-10-19), plan v2 H1-01.
# Workflow propio de beta/: no toca tests.yml ni guardrails.yml. Sin secretos; credenciales efímeras por corrida.

name: beta

on:
  pull_request:
    paths:
      - "beta/**"
      - ".github/workflows/beta.yml"
  push:
    paths:
      - "beta/**"
      - ".github/workflows/beta.yml"

permissions:
  contents: read

concurrency:
  group: beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.21.0"

jobs:
  beta-unit:
    name: beta-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: beta
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (frozen lockfile, sin scripts de ciclo de vida)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  beta-integration:
    name: beta-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: beta
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          # Credencial efímera de esta corrida (no es un secreto de GitHub ni de producto). Solo datos sintéticos.
          POSTGRES_USER: beta_ci_super
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U beta_ci_super -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (frozen lockfile, sin scripts de ciclo de vida)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Integration tests (PostgreSQL 16, UTF8, solo sintético)
        env:
          # Superusuario del service container: crea roles y bases desechables (bootstrap-roles.sql).
          TEST_DATABASE_URL: postgresql://beta_ci_super:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres
        run: npm run test:integration

      - name: Contract tests de puertos (memoria y PostgreSQL 16, mismos casos)
        env:
          TEST_DATABASE_URL: postgresql://beta_ci_super:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres
        run: npm run test:contract
