  - {id: OPEN-TC-02, item: "Si SP4 (participación CLOSED) cierra en cascada los Enrollments con motivo PARTICIPATION_CLOSED; SM §6 no lo dice.", owner: Carlos, status: OPEN}
  - {id: OPEN-TC-03, item: "Q-28: nombre LEFT_SCHOOL y 'la revocación no cierra el Enrollment'.", owner: Carlos, status: OPEN}
  - {id: OPEN-TC-04, item: "F-313: si el Context Owner autoriza la SchoolParticipation con Privacy Legal como segundo aprobador.", owner: Carlos, status: OPEN}
  - {id: OPEN-TC-06, item: "PRIVACY_LEGAL puede reactivar el contexto ([N-SM] §1) pero no está en el enum actorRole (SM v7 R0.2); agregarlo o registrarlo como actorRole CONTEXT_OWNER con rol de plataforma (AUDIT-H01-rev3 N-13).", owner: Carlos, status: OPEN}
  - id: OPEN-TC-07
    item: "Desviación spec↔decisión P2 (SEC-CNS-012 re-verificación rev. 4b (3)): R14-E dice 'I9 en la misma transacción que SP4/EN1'; GRD-TC-08 admite que la cancelación de una invitación concreta que falla se reintente por job CASCADE_CANCEL_INVITATION para no abortar el cierre (abortarlo dejaría la participación ACTIVE: fail-open para la emisión). Condiciones aplicadas en la spec: (i) lista cerrada de fallas que revierten el SAVEPOINT y lock timeout reintentado primero dentro de la tx; (ii) job idempotente, reintentos acotados y alerta; (iii) GET /i/ con 404 uniforme sin handle LANDING mientras quede pendiente (GRD-IV-13). DECIDIDO por Carlos, 2026-09-27 («confirmo la decisión 9, OPEN-RV-11 y OPEN-TC-07 como están»; DEC-BR-018 A-09, A-35, A-36): la desviación queda como lectura de R14-E. Sigue PENDING solo el parámetro de tope/backoff del job en SEC-CNS-006. No bloquea IT0."
    owner: Carlos
    status: "DECIDED (DEC-BR-018); tope/backoff del job PENDING (SEC-CNS-006)"
    refs: ["GRD-TC-08", "GRD-IV-13", "DEC-BR-018 (R14-E)"]
    blocksDataReal: false
  - {id: OPEN-TC-05, item: "Nombres de SCHOOL_PARTICIPATION_STATUS_CHANGED, ENROLLMENT_STATUS_CHANGED y CONSENT_CONTEXT_STATUS_CHANGED, y almacén de la auditoría PLATFORM (ADR-011).", owner: "gaona-measure / lampone-architect; cierre Carlos", status: OPEN}
