        routeClass: PLATFORM
        httpPost: false
        guards: [GRD-TC-05]
        effects: ["Solo cubre el guard (d): literal DEC-BR-015:42 evaluado como booleano; (a)–(c) fuera de H01."]
        emits: [CONSENT_CONTEXT_STATUS_CHANGED]
        idempotencyKey: "(contextRef, sequence)"
        errors: [ERR-TC-05]
        governedBy: ["SM-CNS-001 §6 (SM:171)", "DEC-BR-015:42", "ADR-006 §2", "[N-SM] §1 guard (d)"]
