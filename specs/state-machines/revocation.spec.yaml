    testIds: [TEST-CNS-241]
  - id: GRD-RV-14
    name: verified_erasure_attestation
    rule: "Solo erasure.confirmed verificado de cada subscriptionRef congelado; la reconciliación nunca fija COMPLETED."
    onFail: ERR-RV-10
    governedBy: ["SM-CNS-001 §5 R7", "[N-SM] §6"]
    testIds: [TEST-CNS-242]
  - id: GRD-RV-15
    name: explicit_withdrawal_only
    rule: "FAILED solo por retiro explícito del solicitante con sesión RIGHTS vigente de la cadena (R8), sin depender del authPath proyectado (SEC N-03); ningún timer, OTP inválido, OTP agotado ni expiración produce FAILED."
    onFail: ERR-RV-11
    governedBy: ["DEC-BR-017 §0.3, §5", "SM-CNS-001 §5 R8, INV-10"]
    testIds: [TEST-CNS-243, TEST-CNS-249]
  - id: GRD-RV-16
    name: request_ttl_elapsed
    rule: "Hora de servidor ≥ requestedAt + P-19 sin R4 ni R8; no aplica a R1r–R3r; no-op si la Revocation ya tiene FLAG-escalated con caso abierto de la cadena."
    onFail: null # guard de disparo
    governedBy: ["SM-CNS-001 §5 R9", "SEC-CNS-006 P-19", "AUDIT F-A11"]
    testIds: [TEST-CNS-244, TEST-CNS-340]
  - id: GRD-RV-17
    name: recovery_issuance_limits
    rule: "Envío solo al channelRef ligado (nunca a uno aportado ni a case_contact); K (P-16) y ventana (P-17) por (tenant_id, channelRef) y por origen, contados aparte de la clave de idempotencia; trigger del enum; superarlo nunca deniega."
    onFail: ERR-RV-12
    governedBy: ["SM-CNS-001 §5.1 RV0", "DEC-BR-017 §2, §9", "SEC-CNS-006 P-16, P-17", "INV-11"]
    testIds: [TEST-CNS-245, TEST-CNS-250, TEST-CNS-326]
  - id: GRD-RV-18
    name: recovery_revocation_only_no_session
    rule: "El handle RECOVERY solo habilita R1r→R2r→R3r (y abrir caso RC1 desde /r/); no crea sesión MANAGE/DECISION; no muestra menor, colegio, finalidades, recibos ni Evidence; no lee, reinicia ni consume contadores OTP."
