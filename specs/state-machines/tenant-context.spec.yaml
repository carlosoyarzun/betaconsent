# §6 de SM-CNS-001 (contexto de tenant) modelado SOLO en lo que afecta a las cinco máquinas IT0
# rev. 4e (2026-09-27, DEC-BR-018): alinea con DEC-BR-018 (ACCEPTED 2026-09-27) — OPEN-TC-07 pasa a DECIDED (A-09, A-35, A-36); tope/backoff del job sigue PENDING (SEC-CNS-006). Reemplaza citas de gobierno a scratchpad (CARLOS r3 R13-N/R14-X puros, S/PROPUESTA-Q18.md, S/R14-derivados.md) por DEC-BR-018; deja sin mapeo claro CARLOS r3 con codigos R1-R12/H1/C/F/(a), SM:NNN y DEC-BR-015:NN. Sin cambio de guards, errors ni semantica de consentimiento/revocacion/elegibilidad.
# (decisión del Supervisor sobre AUDIT F-A14, 2026-09-27). H01 / CA-116, rev. 4 (R14-E, R14-F; AUDIT-H01-rev3 N-12/N-13). Cero PII.
# rev. 4d (2026-09-27): SEC-CNS-013 (lampone-security, propuesta re-evaluada contra rev. 4c, "Modificado
# (residual tras 4b/4c)"): TN1, TN2, SP1–SP4 pasan a actor.bySource {FIXTURE, MIGRATION} siguiendo la
# convención de guardsBySource de common.spec.yaml (common:109-116), igual que EN0/EN1; MIGRATION queda
# deshabilitada (DECISION CARLOS pendiente: actorType de "migración revisada", DEC-BR-014 §5). GRD-TC-01
# admite explícitamente la fuente FIXTURE. Sin cambio de semántica.
# rev. 4c (2026-09-27): SEC-CNS-012 re-verificación rev. 4b N3-01 (GRD-CM-15 en la fuente FIXTURE de EN0/EN1) y condiciones (i)–(iii) de GRD-TC-08 (OPEN-TC-07 DECIDED, DEC-BR-018).
# rev. 4b (2026-09-27): SEC-CNS-012 re-verificación rev. 4 N2-05 (locks de la cascada Q-18, GRD-TC-07/08), N2-06 (GRD-CM-14), N2-01 (guardsBySource en EN0/EN1).
# Lo que §6 no aplica a IT0 se lista en coverage.notCovered y no se declara cubierto.
# rev. 4f (2026-09-27, SEC-CNS-014, aprobado por Carlos): cierra el grupo GRD-CM-02 (Guard T, cross-tenant) de OPEN-RV-12 (revocation.spec.yaml) en tenant-context.Enrollment EN0/EN1 — errors += ERR-CM-02. Sin cambio de guards existentes, actores, estados ni semántica.
specId: SPEC-CNS-SM-TENANT-CONTEXT
title: "Contexto de tenant (Tenant status, SchoolParticipation, Enrollment, readiness de ConsentContext): efectos sobre las máquinas IT0"
smId: SM-CNS-001
smSection: "§6 (D1, F-211), R0.4–R0.6"
version: "0.4.4"
status: PROPOSED
jiraStory: CA-116
owner: lampone-architect
reviewers: [lampone-security, lampone-qa, carlosoyarzun]
humanGate: "Solo Carlos cierra esta spec."
commonSpec: specs/state-machines/common.spec.yaml
reviewInputs: ["AUDIT-H01 F-A14 (decisión del Supervisor: entra en H01 solo lo que afecta a las cinco máquinas)"]
governedBy:
  - "SM-CNS-001 v7 §6 (SM:169-174)"
  - "DEC-BR-014 §1 (SchoolParticipation y Enrollment por fixture o acto humano), §5 (DEC-BR-014:84, viñeta 'Roles de plataforma': SchoolParticipation y tenant.active solo por fixture o migración revisada, sin UI), §6 (actor FIXTURE; R14-F lo limita a LOCAL y CI)"
  - "DEC-BR-018 R14-E (Q-18 opción A), R14-F (FIXTURE solo en LOCAL/CI)"
  - "DEC-BR-015:42, :45 (guard (d) + Guard P; reactivación R7-1)"
  - "DEC-BR-016 §1, §4, §7, §8"
  - "ADR-006 §2 (school_participation, enrollment, CONTEXT_READINESS), §12 (estado del tenant)"
  - "CARLOS r2 D1, D5; r3 R7-1"
  - "[N-SM] §1 ConsentContext (READY → ACTIVE, PAUSED → ACTIVE)"
  - "SEC-CNS-005 T-25, T-50, T-62"

coverage:
  covered:
    - "Tenant ACTIVE ↔ SUSPENDED y su efecto: bloquea ISSUANCE/DECISION, nunca RIGHTS (SM:170)"
    - "SchoolParticipation PENDING_AUTHORIZATION → ACTIVE ↔ SUSPENDED → CLOSED y su efecto sobre Guard P, I9 y ConsentDecision (SM:172)"
    - "Enrollment ACTIVE → CLOSED {TRANSFERRED, LEFT_SCHOOL, PARTICIPATION_CLOSED} y su efecto sobre Guard E, I9, API-CNS-001 e INV-7 (SM:173)"
    - "ConsentContext READY → ACTIVE y PAUSED → ACTIVE: solo el guard (d) / CONTEXT_READINESS (R7-1) y su evaluación sin lectura cross-tenant (SM:171)"
    - "Fail-closed en el tenant nuevo tras un traslado: ninguna autorización cruza tenant (SM:174, INV-3)"
  notCovered: # no se declaran cubiertos por H01
    - "Creación/borrado de tenants (provisión por fixture; borrado: LD-12)"
    - "BillingSubscription → tenant.active (DEFERRED IT0; DEC-BR-016 §5)"
    - "Flujo del traslado en el tenant destino (DEFERRED IT0; LD-09, LD-10)"
    - "Resto de la máquina ConsentContext ([N-SM] §1): DRAFT → READY, ACTIVE → PAUSED (reasonCodes, cuarentena REQ-CNS-035), → CLOSED, → ARCHIVED; guards (a)–(c) de ética y versión"
    - "eligibility.changed (E-10 PROPOSED; separado de Q-18 por R14-E) — no se emite"
    - "Ética por colegio (Q-11), Organization (DEFERRED)"

submachines:
  - machine: Tenant
    aggregateType: TenantStatus
    projection: "app.tenant_status (tenant.active); la existencia vive en tenant_resolve.tenant (ADR-006 §6)"
    noTerminalStates: "El tenant no se borra mientras exista dato o evento del tenant (ADR-006 §6; LD-12)."
    states:
      - id: ACTIVE
        initial: true
        terminal: false
        description: "tenant.active = true."
        governedBy: ["SM-CNS-001 §6 (SM:170)", "ADR-006 §12"]
        testIds: [TEST-CNS-350]
      - id: SUSPENDED
        initial: false
        terminal: false
        description: "tenant.active = false: bloquea ISSUANCE/DECISION (GRD-CM-05); nunca RIGHTS (INV-6)."
        governedBy: ["SM-CNS-001 §6 (SM:170)", "DEC-BR-016 §8"]
        testIds: [TEST-CNS-351]
    transitions:
      - id: TN1
        from: ACTIVE
        to: SUSPENDED
        command: SuspendTenant
        actor:
          bySource: # SEC-CNS-013 (residual 4b/4c): antes actorType HUMAN cubría ambos canales sin bySource ni GRD-CM-15
            FIXTURE: {actorType: FIXTURE, note: "seed sintético, solo LOCAL/CI (DEC-BR-014 §1, §5, §6; R14-F; GRD-CM-14)"}
            MIGRATION:
              enabled: false
              actorRole: PLATFORM_ADMIN
              disabledReason: "SEC-CNS-013 residual (4b/4c): actorType de 'migración revisada' sin decidir (DEC-BR-014 §5, :84); DECISION CARLOS pendiente. Hasta entonces la única fuente ejecutable de TN1/TN2/SP1–SP4 es FIXTURE (LOCAL/CI); en STAGING solo migración revisada, también deshabilitada por ahora."
        routeClass: PLATFORM
        httpPost: false
        httpPostBySource: {FIXTURE: false}
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-01] # comunes
        guardsBySource:
          FIXTURE: [GRD-CM-14, GRD-CM-15]
        effects: ["Desde el append: GRD-CM-05 da false en I1–I4, V1 DECISION y C1–C5 del tenant; las rutas RIGHTS siguen resolviendo (GRD-CM-06, AC-02.3)."]
        emits: [TENANT_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, sequence)"
        errors: [ERR-CM-10, ERR-TC-01]
        governedBy: ["SM-CNS-001 §6 (SM:170)", "ADR-006 §12", "DEC-BR-014 §5", "SEC-CNS-013"]
        testIds: [TEST-CNS-352]
        changeNote: "SEC-CNS-013 (P1, residual tras 4b/4c): actor pasa a bySource {FIXTURE, MIGRATION} siguiendo la convención de guardsBySource de common.spec.yaml (common:109-116), igual que EN0/EN1; MIGRATION queda deshabilitada (DECISION CARLOS pendiente). guardsBySource FIXTURE suma GRD-CM-15 (fuente por identidad de ejecución). errors sin cambio: GRD-CM-14/15 ya tienen onFail ERR-CM-10, presente. Sin cambio de semántica."
      - id: TN2
        from: SUSPENDED
        to: ACTIVE
        command: ReactivateTenant
        actor:
          bySource: # SEC-CNS-013 (residual 4b/4c)
            FIXTURE: {actorType: FIXTURE, note: "seed sintético, solo LOCAL/CI (DEC-BR-014 §1, §6; R14-F; GRD-CM-14)"}
            MIGRATION:
              enabled: false
              actorRole: PLATFORM_ADMIN
              disabledReason: "SEC-CNS-013 residual (4b/4c): actorType de 'migración revisada' sin decidir (DEC-BR-014 §5, :84); DECISION CARLOS pendiente. Hasta entonces la única fuente ejecutable de TN1/TN2/SP1–SP4 es FIXTURE (LOCAL/CI)."
        routeClass: PLATFORM
        httpPost: false
        httpPostBySource: {FIXTURE: false}
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-01] # comunes
        guardsBySource:
          FIXTURE: [GRD-CM-14, GRD-CM-15]
        effects: ["Rehabilita ISSUANCE/DECISION del tenant; no reactiva nada terminal."]
        emits: [TENANT_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, sequence)"
        errors: [ERR-CM-10, ERR-TC-01]
        governedBy: ["SM-CNS-001 §6 (SM:170)", "ADR-006 §12", "SEC-CNS-013"]
        testIds: [TEST-CNS-353]
        changeNote: "SEC-CNS-013 (P1, residual tras 4b/4c): mismo fix que TN1. Sin cambio de semántica."
  - machine: SchoolParticipation
    aggregateType: SchoolParticipation
    table: "app.school_participation (ADR-006 §2); UNIQUE parcial (tenant_id, context_ref) WHERE status <> 'CLOSED'"
    states:
      - id: PENDING_AUTHORIZATION
        initial: true
        terminal: false
        description: "Participación creada sin autorizar: Guard P falla."
        governedBy: ["SM-CNS-001 §6 (SM:172)", "ADR-006 §2", "DEC-BR-016 §1"]
        testIds: [TEST-CNS-354]
      - id: ACTIVE
        initial: false
        terminal: false
        description: "Autorizada: Guard P se cumple para (contextRef, productRef)."
        governedBy: ["SM-CNS-001 §6", "DEC-BR-016 §4"]
        testIds: [TEST-CNS-355]
      - id: SUSPENDED
        initial: false
        terminal: false
        description: "Bloquea I3/I4/C1–C5 sin cancelar invitaciones ni tocar decisiones; nunca RIGHTS."
        governedBy: ["SM-CNS-001 §6 (SM:172), §2 'Inválidas'"]
        testIds: [TEST-CNS-356]
      - id: CLOSED
        initial: false
        terminal: true
        description: "Participación cerrada; nunca toca ConsentDecision ni emite consent.revoked."
        governedBy: ["SM-CNS-001 §6 (SM:172)", "INV-7"]
        testIds: [TEST-CNS-357]
    transitions:
      - id: SP1
        from: PENDING_AUTHORIZATION
        to: ACTIVE
        command: AuthorizeSchoolParticipation
        actor:
          bySource: # SEC-CNS-013 (residual 4b/4c)
            FIXTURE: {actorType: FIXTURE, note: "seed sintético, solo LOCAL/CI (DEC-BR-014 §1, §6; R14-F; GRD-CM-14)"}
            MIGRATION:
              enabled: false
              actorRole: CONTEXT_OWNER
              disabledReason: "SEC-CNS-013 residual (4b/4c): actorType de 'migración revisada' sin decidir (DEC-BR-014 §5, :84); DECISION CARLOS pendiente. Hasta entonces la única fuente ejecutable de TN1/TN2/SP1–SP4 es FIXTURE (LOCAL/CI). Segundo aprobador Privacy Legal (F-313) sigue abierto, sin efecto en esta fuente."
        routeClass: PLATFORM
        httpPost: false
        httpPostBySource: {FIXTURE: false}
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-02] # comunes
        guardsBySource:
          FIXTURE: [GRD-CM-14, GRD-CM-15]
        effects: ["Guard P empieza a cumplirse para el tenant; habilita I1–I4/C1–C5 si el resto de la fórmula se cumple. La IA nunca la otorga ni la infiere."]
        emits: [SCHOOL_PARTICIPATION_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, participation_ref, sequence)"
        errors: [ERR-CM-10, ERR-TC-02]
        governedBy: ["SM-CNS-001 §6 (SM:172)", "DEC-BR-016 §1, §4", "ADR-006 §2", "SEC-CNS-013"]
        testIds: [TEST-CNS-358]
        changeNote: "SEC-CNS-013 (P1, residual tras 4b/4c): mismo fix que TN1. Sin cambio de semántica."
      - id: SP2
        from: ACTIVE
        to: SUSPENDED
        command: SuspendSchoolParticipation
        actor:
          bySource: # SEC-CNS-013 (residual 4b/4c)
            FIXTURE: {actorType: FIXTURE, note: "seed sintético, solo LOCAL/CI (DEC-BR-014 §1, §6; R14-F; GRD-CM-14)"}
            MIGRATION:
              enabled: false
              actorRole: CONTEXT_OWNER
              disabledReason: "SEC-CNS-013 residual (4b/4c): actorType de 'migración revisada' sin decidir (DEC-BR-014 §5, :84); DECISION CARLOS pendiente. Hasta entonces la única fuente ejecutable de TN1/TN2/SP1–SP4 es FIXTURE (LOCAL/CI)."
        routeClass: PLATFORM
        httpPost: false
        httpPostBySource: {FIXTURE: false}
        guards: [GRD-CM-07, GRD-CM-13] # comunes
        guardsBySource:
          FIXTURE: [GRD-CM-14, GRD-CM-15]
        effects: ["Guard P falla: I3/I4/C1–C5 del tenant se rechazan con INVITER_NOT_PARTICIPATING/CONTEXT_NOT_ACTIVE sin volver nada terminal (INV-IV-07); revocación y derechos intactos (INV-6)."]
        emits: [SCHOOL_PARTICIPATION_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, participation_ref, sequence)"
        errors: [ERR-CM-10]
        governedBy: ["SM-CNS-001 §6 (SM:172)", "DEC-BR-016 §4", "SEC-CNS-013"]
        testIds: [TEST-CNS-359]
        changeNote: "SEC-CNS-013 (P1, residual tras 4b/4c): mismo fix que TN1. Sin cambio de semántica."
      - id: SP3
        from: SUSPENDED
        to: ACTIVE
        command: ReactivateSchoolParticipation
        actor:
          bySource: # SEC-CNS-013 (residual 4b/4c)
            FIXTURE: {actorType: FIXTURE, note: "seed sintético, solo LOCAL/CI (DEC-BR-014 §1, §6; R14-F; GRD-CM-14)"}
            MIGRATION:
              enabled: false
              actorRole: CONTEXT_OWNER
              disabledReason: "SEC-CNS-013 residual (4b/4c): actorType de 'migración revisada' sin decidir (DEC-BR-014 §5, :84); DECISION CARLOS pendiente. Hasta entonces la única fuente ejecutable de TN1/TN2/SP1–SP4 es FIXTURE (LOCAL/CI)."
        routeClass: PLATFORM
        httpPost: false
        httpPostBySource: {FIXTURE: false}
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-02] # comunes
        guardsBySource:
          FIXTURE: [GRD-CM-14, GRD-CM-15]
        effects: ["Guard P vuelve a cumplirse; las invitaciones no terminales continúan."]
        emits: [SCHOOL_PARTICIPATION_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, participation_ref, sequence)"
        errors: [ERR-CM-10, ERR-TC-02]
        governedBy: ["SM-CNS-001 §6 (SM:172: 'ACTIVE ↔ SUSPENDED')", "SEC-CNS-013"]
        testIds: [TEST-CNS-360]
        changeNote: "SEC-CNS-013 (P1, residual tras 4b/4c): mismo fix que TN1. Sin cambio de semántica."
      - id: SP4
        from: [ACTIVE, SUSPENDED]
        to: CLOSED
        command: CloseSchoolParticipation
        actor:
          bySource: # SEC-CNS-013 (residual 4b/4c)
            FIXTURE: {actorType: FIXTURE, note: "seed sintético, solo LOCAL/CI (DEC-BR-014 §1, §6; R14-F; GRD-CM-14)"}
            MIGRATION:
              enabled: false
              actorRole: CONTEXT_OWNER
              disabledReason: "SEC-CNS-013 residual (4b/4c): actorType de 'migración revisada' sin decidir (DEC-BR-014 §5, :84); DECISION CARLOS pendiente. Hasta entonces la única fuente ejecutable de TN1/TN2/SP1–SP4 es FIXTURE (LOCAL/CI)."
        routeClass: PLATFORM
        httpPost: false
        httpPostBySource: {FIXTURE: false}
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-08] # comunes
        guardsBySource:
          FIXTURE: [GRD-CM-14, GRD-CM-15]
        effects:
          - "R14-E (Q-18 opción A): en la misma transacción, invitation I9 PARTICIPATION_CLOSED (fuente SYSTEM) sobre todas las invitaciones no terminales del tenant en esa participación."
          - "SEC N2-05 (GRD-TC-08): toma FOR UPDATE la fila de la participación y luego, en orden de invitationRef, las invitaciones no terminales; relee bajo lock; salta de forma idempotente las que ya son terminales; la cascada nunca aborta el cierre. Falla propia de una invitación: reintento dentro de la tx y, si persiste, job CASCADE_CANCEL_INVITATION (condiciones (i)–(iii), OPEN-TC-07 DECIDED, DEC-BR-018)."
          - "Cierre en cascada de Enrollments con motivo PARTICIPATION_CLOSED: no especificado en SM §6 como efecto automático (OPEN-TC-02); Guard P ya bloquea el tratamiento."
          - "Ninguna transición de ConsentDecision ni consent.revoked (INV-7)."
        emits: [SCHOOL_PARTICIPATION_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, participation_ref, sequence)"
        errors: [ERR-CM-10]
        governedBy: ["SM-CNS-001 v7 §6 (SM:172)", "DEC-BR-016 §4", "DEC-BR-018 R14-E", "DEC-BR-017 E-04 (sin condición, derivado D-17)", "SEC-CNS-012 re-verificación rev. 4 N2-05", "SEC-CNS-013"]
        testIds: [TEST-CNS-361, TEST-CNS-418, TEST-CNS-436, TEST-CNS-438, TEST-CNS-449, TEST-CNS-450]
        changeNote: "SEC-CNS-013 (P1, residual tras 4b/4c): mismo fix que TN1. Sin cambio de semántica."
  - machine: Enrollment
    aggregateType: Enrollment
    table: "app.enrollment (ADR-006 §2); UNIQUE parcial (tenant_id, subject_ref, participation_ref) WHERE status = 'ACTIVE'"
    states:
      - id: ACTIVE
        initial: true
        terminal: false
        description: "Guard E se cumple para el subjectRef en la participación."
        governedBy: ["SM-CNS-001 §6 (SM:173)", "ADR-006 §2"]
        testIds: [TEST-CNS-362]
      - id: CLOSED
        initial: false
        terminal: true
        description: "close_reason ∈ {TRANSFERRED, LEFT_SCHOOL, PARTICIPATION_CLOSED}; ningún motivo es retiro de consentimiento."
        governedBy: ["SM-CNS-001 §6 (SM:173)", "DEC-BR-016 §1"]
        testIds: [TEST-CNS-363]
    transitions:
      - id: EN0
        from: null
        to: ACTIVE
        command: OpenEnrollment
        actor:
          bySource:
            STAFF: {actorType: HUMAN, actorRole: INVITER, note: "TENANT_ADMIN en la consola STAFF (DEC-BR-016 §4 'abre y cierra Enrollments')"}
            FIXTURE: {actorType: FIXTURE, note: "seed sintético, solo LOCAL/CI (DEC-BR-014 §1; R14-F; GRD-CM-14)"}
        routeClass: STAFF_ADMIN # AUDIT-H01-rev3 N-13: no evalúa la fórmula de elegibilidad
        httpPost: true # consola STAFF
        httpPostBySource: {STAFF: true, FIXTURE: false}
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-03] # comunes
        guardsBySource: # SEC N2-01 (mismo defecto): el seed no tiene credencial ni POST
          STAFF: [GRD-CM-01, GRD-CM-02, GRD-CM-10]
          FIXTURE: [GRD-CM-14, GRD-CM-15] # N3-01: fuente = rol de seed, nunca un campo de la request
        effects: ["Guard E empieza a cumplirse para el subjectRef en esa participación."]
        emits: [ENROLLMENT_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, subject_ref, participation_ref)"
        errors: [ERR-CM-02, ERR-CM-09, ERR-CM-10, ERR-TC-03]
        governedBy: ["DEC-BR-014 §1", "DEC-BR-016 §4", "ADR-006 §2", "SEC-CNS-012 re-verificación rev. 4 N2-01, N2-06"]
        testIds: [TEST-CNS-364, TEST-CNS-429, TEST-CNS-444, TEST-CNS-446]
      - id: EN1
        from: ACTIVE
        to: CLOSED
        command: CloseEnrollment
        actor:
          bySource:
            STAFF: {actorType: HUMAN, actorRole: INVITER, note: "TENANT_ADMIN registra el motivo en la consola STAFF (DEC-BR-016 §4)"}
            FIXTURE: {actorType: FIXTURE, note: "seed sintético, solo LOCAL/CI (R14-F; GRD-CM-14)"}
        routeClass: STAFF_ADMIN # AUDIT-H01-rev3 N-13
        httpPost: true
        httpPostBySource: {STAFF: true, FIXTURE: false}
        guards: [GRD-CM-07, GRD-CM-13, GRD-TC-04, GRD-TC-08] # comunes
        guardsBySource: # SEC N2-01 (mismo defecto): el seed no tiene credencial ni POST
          STAFF: [GRD-CM-01, GRD-CM-02, GRD-CM-10]
          FIXTURE: [GRD-CM-14, GRD-CM-15] # N3-01
        effects:
          - "Guard E falla: I3/I4/C1–C5 del subjectRef se rechazan; en la misma transacción, invitation I9 ENROLLMENT_CLOSED (fuente SYSTEM) sobre sus invitaciones no terminales (R14-E, Q-18 opción A)."
          - "SEC N2-05 (GRD-TC-08): toma FOR KEY SHARE la participación, FOR UPDATE el Enrollment y luego, en orden de invitationRef, las invitaciones no terminales del subjectRef; relee bajo lock; salta las terminales; la cascada nunca aborta el cierre. Falla propia de una invitación: reintento dentro de la tx y, si persiste, job CASCADE_CANCEL_INVITATION (condiciones (i)–(iii), OPEN-TC-07 DECIDED, DEC-BR-018)."
          - "API-CNS-001 responde NOT_AUTHORIZED (RULE-CNS-013); el motivo interno ENROLLMENT_NOT_ACTIVE queda solo en AuthorizationCheck (F-323)."
          - "TRANSFERRED ≠ revocación: sin consent.revoked, sin transición de ConsentDecision, sin supresión; histórico conservado (LD-12). El DecisionMaker conserva consulta, revocación y derechos (INV-6)."
          - "eligibility.changed no se emite (E-10 PROPOSED, Q-18)."
        emits: [ENROLLMENT_STATUS_CHANGED]
        idempotencyKey: "(tenant_id, enrollment_ref, sequence)"
        errors: [ERR-CM-02, ERR-CM-09, ERR-CM-10, ERR-TC-04]
        governedBy: ["SM-CNS-001 §6 (SM:173)", "DEC-BR-016 §7", "DR2 D1", "INV-7", "INV-CD-06", "SEC-CNS-012 re-verificación rev. 4 N2-01, N2-05, N2-06"]
        testIds: [TEST-CNS-365, TEST-CNS-419, TEST-CNS-429, TEST-CNS-437, TEST-CNS-438, TEST-CNS-444, TEST-CNS-446, TEST-CNS-449, TEST-CNS-450]
  - machine: ConsentContextReadiness
    aggregateType: ConsentContext
    partial: true
    partialNote: "Solo las dos transiciones de [N-SM] §1 que dependen de SchoolParticipation (guard (d), R7-1). El resto de la máquina no está cubierto (coverage.notCovered)."
    states:
      - id: READY
        initial: false
        terminal: false
        description: "Configuración completa y aprobada ([N-SM] §1)."
        governedBy: ["[N-SM] §1"]
        testIds: [TEST-CNS-366]
      - id: ACTIVE
        initial: false
        terminal: false
        description: "Contexto activo: parte de la fórmula de GRD-CM-05 (study.active)."
        governedBy: ["[N-SM] §1", "DEC-BR-016 §8"]
        testIds: [TEST-CNS-367]
      - id: PAUSED
        initial: false
        terminal: false
        description: "Bloquea invitaciones y decisiones; revocación y derechos disponibles ([N-SM] §1, ACCEPTED)."
