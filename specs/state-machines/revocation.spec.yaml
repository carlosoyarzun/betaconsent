    governedBy: ["SM-CNS-001 §5.1, INV-8", "DEC-BR-017 §2", "CARLOS r2 D6", "REQ-CNS-TBD-04 AC-04.1…AC-04.3", "REQ-CNS-TBD-03 AC-03.4"]
    testIds: [TEST-CNS-247]
  - id: GRD-RV-19
    name: ledger_vocabulary_whitelist
    rule: "Todo payload de Revocation pasa la lista blanca de DEC-BR-017 §6: recoveryMethod iff authPath = RECOVERY; originPurposeRef nunca nulo; initiatedVia = SCHOOL_REPORT iff caso SCHOOL_REPORTED; scope = ALL; valores legacy rechazados."
    onFail: ERR-RV-13
    governedBy: ["DEC-BR-017 §6", "ADR-002 §10", "REQ-CNS-TBD-05 AC-05.1, AC-05.2", "SEC-CNS-005 TS-27"]
    testIds: [TEST-CNS-262]
  - id: GRD-RV-20
    name: management_handle_scope
    rule: "Erratum R13-3 (SM v7 §5.0 = ADR-006 §6.1): el handle MANAGE_ENTRY (P-14) habilita solo V1 MANAGE/REVOCATION, RV0 con trigger de portador (REQUESTER_ASKED, LIMIT_REACHED), RC1, RC2u y RC3/RC3a, con todo envío solo al canal ligado; V1 y RV0 siempre visibles; antes de V3 no muestra menor, colegio, finalidades ni estado; cualquier otra operación con ese handle se rechaza; no existe búsqueda por email sin tenant y cadena resueltos."
    onFail: ERR-RV-02
    governedBy: ["SM-CNS-001 v7 §5.0", "ADR-006 §6.1 (erratum R13-3)", "DEC-BR-018 R13-3", "REQ-CNS-TBD-02 AC-02.1", "REQ-CNS-TBD-07 AC-07.3", "SEC-CNS-012 P1-04"]
    testIds: [TEST-CNS-264, TEST-CNS-388]
  - id: GRD-RV-21
    name: rights_session_bound_to_chain
    rule: "Sesión RIGHTS vigente (P-28): MANAGE para R1 y R8, REVOCATION para R2 y R3; session.parentRef = revocation.chainRef (para R1, la cadena a revocar) y session.decisionMakerRef = decisionMakerRef de la cadena; junto con Guard T (GRD-CM-02). Un DecisionMaker con dos cadenas en el tenant no puede aplicar la sesión de una a la otra."
    onFail: ERR-RV-14
    governedBy: ["SEC-CNS-012 P1-05", "SM-CNS-001 §3.1 (sesión ligada a parentRef)", "SEC-CNS-006 P-28"]
    testIds: [TEST-CNS-327, TEST-CNS-328, TEST-CNS-330]
  - id: GRD-RV-22
    name: system_trigger_with_open_case
    rule: "RV0 con trigger CASE_CONTACT o SCHOOL_REPORTED: el llamador es SYSTEM_GUARD (worker) actuando por rights-case RC2 sobre un RightsCase no terminal de la misma (tenant_id, chainRef); no requiere handle; el token se liga al revokedDecisionRef del caso (SEC N2-04). Un llamador sin caso abierto o con otra cadena se rechaza."
    onFail: ERR-RV-02
    governedBy: ["SEC-CNS-012 P1-03", "AUDIT F-A09", "SM-CNS-001 §5.1 RV0 (triggers), §5.2 RC2"]
    testIds: [TEST-CNS-325]
  - id: GRD-RV-23
    name: aggregate_serialization
    rule: "Toda transición de Revocation toma el lock de la proyección de la revocación y verifica expectedSequence en la misma tx. R8 y R4 son mutuamente excluyentes: gana la primera tx que confirma; R8 con APPLY_REVOCATION ya tomado o aplicado falla con ERR-RV-15; el job de R4 sobre una revocación que ya no está CONFIRMED termina sin efecto con ERR-RV-16. Perdedor de una carrera (SEC N-06): se re-evalúa en la misma tx contra el estado nuevo (R10 → R11 si ya está CONFIRMED; RC3 → RC3a si ya hay Revocation abierta); nunca se consume un token sin efecto."
    onFail: ERR-RV-15
    governedBy: ["SEC-CNS-012 P1-06 (técnico), P2-05", "SEC-CNS-012 re-verificación N-06", "SM-CNS-001 §4.2"]
    testIds: [TEST-CNS-333, TEST-CNS-335, TEST-CNS-407, TEST-CNS-408]
  - id: GRD-RV-24
    name: durable_apply_job
    rule: "R3, R3r y RH3 encolan ops.job(kind = APPLY_REVOCATION, revocationRef) en la misma tx que REVOCATION_CONFIRMED; el job es idempotente por revocationRef, at-least-once, con reintentos y alerta si supera el umbral operativo; no existe CONFIRMED sin job."
    onFail: ERR-CM-06
    governedBy: ["SEC-CNS-012 P1-01 (fix técnico: 'R4 en la misma tx o job durable')", "SM-CNS-001 R0.1", "ADR-006 §6 (ops.claim_due_jobs)"]
    testIds: [TEST-CNS-331]
  - id: GRD-RV-25
    name: initiated_via_server_derived
    rule: "initiatedVia se calcula en servidor: SCHOOL_REPORT si y solo si la revocación nace dentro (o con caso abierto) de un RightsCase con origin SCHOOL_REPORTED; si no, DECISION_MAKER. Un valor enviado por el cliente se ignora."
    onFail: ERR-RV-13
    governedBy: ["DEC-BR-017 §6 (F-510)", "SEC-CNS-012 P2-17"]
    testIds: [TEST-CNS-339]

  - id: GRD-RV-26
    name: rh3_four_eyes
    rule: "Interino IT0 (R13-4, R14-B): RH3 surte efecto solo con dos RIGHTS_OPERATOR distintos (registra uno con record_case_confirmation, co-firma otro con cosign_case_confirmation; ninguno de los dos tiene que ser el proponente de la RH2/RH2v: SM v7 SM:157 no lo exige, AUDIT-H01-rev4 M-04), cada uno con su sesión CASE vigente y un grant atestado del caso revalidado en la tx de RH3; recorder y co-firmante ∉ {aprobadores de RH2/RH2v, aprobadores de grants del caso}, comparado por sub atestado; CHECK cosigned_by_ref <> recorded_by_ref. Mínimo 4 personas reales sin reutilización (GRD-RC-15). Step-up de la co-firma: OPEN-RV-10 (P-36 no lo cubre). Sin co-firma, sin efecto (caso abierto, nunca FAILED). Regla definitiva: LD-03."
    onFail: ERR-RV-18
    governedBy: ["DEC-BR-018 R13-4, R14-B", "SM-CNS-001 v7 §5.2 RH3, INV-17", "SEC-CNS-012 P1-07", "SEC-CNS-012 re-verificación N-04", "AUDIT-H01-rev3 N-08"]
    testIds: [TEST-CNS-386, TEST-CNS-387, TEST-CNS-403, TEST-CNS-404, TEST-CNS-442]
  - id: GRD-RV-27
    name: attach_to_open_revocation
    rule: "R10, R11, R12 y RH2v solo sobre la Revocation abierta de la decisión GRANTED vigente de la cadena (R14-C), en estado previo a APPLIED (REQUESTED, VERIFIED, CONFIRMED; lectura P-v7-5, pendiente de Carlos); desde APPLIED+ respuesta uniforme y el caso cierra por RC4/RC5; nunca crean otra ni hacen retroceder el estado (P-v7-2 ACCEPTED, R14-A); sin Revocation abierta rigen R1r o RC3."
    onFail: ERR-RV-19
    governedBy: ["DEC-BR-018 R13-1, R14-A, R14-C", "SM-CNS-001 v7 §5 (P-v7-2, P-v7-5), INV-16", "AUDIT-H01-rev3 N-06"]
    testIds: [TEST-CNS-384, TEST-CNS-411, TEST-CNS-423]
  - id: GRD-RV-28
    name: effective_auth_path_from_verification
    rule: "P-v7-1 y NF-20 ACCEPTED (R14-A): el authPath/recoveryMethod de CONSENT_REVOKED y del receipt es el del REVOCATION_VERIFIED que precede a la confirmación, nunca el de la solicitud; el adjunto no sobrescribe el authPath proyectado; una RH2/RH2v solo es aceptable si la Revocation tiene un REVOCATION_REQUESTED HUMAN_ASSISTED con caseRef; CONSENT_REVOKED lleva actor DECISION_MAKER solo si lo precede una verificación probada (R2, R2r, R10, RH2 o RH2v). Aplica en R12, RH2, RH2v y RH3 (R14-A). En R4 no se usa: lo reemplaza GRD-RV-29, que deriva sin rechazar (SEC N2-02, INV-RV-07)."
    rejectsOnIntegrity: true # si la integridad del ledger no es verificable, rechaza (LD-05): prohibido en R4
    onFail: ERR-RV-13
    governedBy: ["SM-CNS-001 v7 (P-v7-1, P-v7-3)", "DEC-BR-018 R14-A", "DEC-BR-017 §6", "SM-CNS-001 §5.1 R1r (precedente)"]
    testIds: [TEST-CNS-389, TEST-CNS-412]
  - id: GRD-RV-29
    name: effective_auth_path_derived_on_apply
    rule: "SEC N2-02 / INV-RV-07: en R4, el authPath/recoveryMethod y el actor de CONSENT_REVOKED y del receipt se DERIVAN de la proyección de la revocación (verifiedAuthPath, verifiedRecoveryMethod: escritos en la misma tx del REVOCATION_VERIFIED que precede a la confirmación; CHECK NOT NULL desde VERIFIED). Como CONFIRMED solo se alcanza desde VERIFIED (R2, R2r, R10, RH2, RH2v), el actor es DECISION_MAKER (NF-20). Nunca rechaza ni retrasa R4: si la cadena del ledger no es verificable (LD-05) se aplica igual con el efecto más restrictivo (AuthorizationCheck NOT_AUTHORIZED para la cadena desde el append), registro durable, reconciliación y alerta; la validez de esa evidencia es LEGAL DECISION LD-05."
    onFail: null # derivación: nunca rechaza (INV-RV-07)
    governedBy: ["SEC-CNS-012 re-verificación rev. 4 N2-02", "DEC-BR-018 R14-A (NF-20)", "SM-CNS-001 v7 (P-v7-1, P-v7-3)", "INV-RV-07", "LD-05"]
    testIds: [TEST-CNS-430, TEST-CNS-431]

