# Matriz de roles de base de datos (ADR-010 rev. 4 §4.1, §4.1.1, §4.5), unificada con SEC-CNS-021 tal como quedó en main.
# rev. 0.4 (2026-10-15, lampone-dev, ADR-010 rev. 5 PR-b `feat(db):`, aceptada por Carlos el 2026-10-15 para IT0b): roles ledger_gen_owner y ledger_writer, esquema ledger_gen (0046-0049), INV-DBR-07 reescrita
#   (emision derivada de la fila, pares disjuntos), retiro total del INSERT de app_rw sobre integrity.audit_event, RES-OTP-WEB ampliado (F-A10-30-S0, F-PR6-23). Ver ledgerWriter y specs/ledger-derivation.spec.yaml.
# rev. 0.3 (2026-10-11, lampone-dev, ADR-010 PR-4 `feat:`): refleja lo implementado en la migración 0036 y las decisiones de Carlos del 2026-10-11 (2), (3), (4) y (6).
#   Cambio de criterio declarado: el verifier lee y cierra platform.oidc_exchange SOLO por funciones SECURITY DEFINER (claim_oidc_exchange, record_assertion), sin
#   privilegios de columna sobre la tabla (más estricto que la rev. 0.2). Sin esto la tabla de roles de runtime conserva "sin privilegios sobre tablas de platform".
# rev. 0.2 (2026-10-11, lampone-architect, ADR-010 PR-1 `spec:`, sin código): incorpora Q-17 (a), Q-18 (a), Q-19 y Q-20 (c), decididas por Carlos el 2026-10-11.
# rev. 0.1 (2026-10-11): primera versión sobre rev. 3.
# 0045 (2026-10-14, lampone-dev, SEC-CNS-PR94 P2-A): ops.security_event admite GUEST_MESSAGE_DELIVERY_FAILED (ver la fila de ops.security_event de app_rw); sin cambio de roles, membresías ni dueños.
# Base verificada: origin/main 9c8a764, migraciones 0000–0033.
# Estado por elemento: MAIN = existe hoy (cita archivo:línea); PR-2…PR-7 = lo crea o cambia ese PR de ADR-010 §7; DECIDIDO = decisión de Carlos
# del 2026-10-11 (Q-17…Q-20) que no estaba en rev. 3. Los números de migración NO se fijan (ADR-010 §7).
# No decide semántica de consentimiento, revocación ni elegibilidad. La autoridad de RH3 sigue siendo LEGAL DECISION LD-03 (ADR-010 Q12).
specId: SPEC-CNS-DB-ROLES
title: "Roles de PostgreSQL, membresías, privilegios y chequeos (IT0b / datos reales)"
version: "0.4.0"
status: PROPOSED
owner: lampone-architect
reviewers: [lampone-security, lampone-qa, carlosoyarzun]
humanGate: "Solo Carlos cierra esta spec. Cambiar una membresía SET de un owner, el modo REAL_DATA o un residual aceptado es human gate."
baseline: {ref: origin/main, commit: 9c8a764, migrations: "0000-0033"}
relatedSpecs:
  - specs/state-machines/revocation.spec.yaml   # dbEnforcement (funciones por transición, ADR-010 §4.2)
  - specs/state-machines/rights-case.spec.yaml  # dbEnforcement
  - specs/session.spec.yaml                     # STAFF sigue en web/app_rw (Q-17); CASE pasa a platform_rw en PR-5
  - contracts/openapi/consent-platform.openapi.yaml
governedBy:
  - "ADR-010 rev. 4 §4.1, §4.1.1, §4.2, §4.3, §4.5, §7 (rev. 3 aceptada por Carlos para IT0b; Q-17…Q-20 decididas por Carlos el 2026-10-11; texto de Notion no verificado en esta sesión: FN-3)"
  - "SEC-CNS-021 §3 (matriz de roles), D7/F-7, R-21-1, R-21-2 (= R-23 del registro de riesgos, propuesto)"
  - "ADR-002 §2, §5; ADR-006 §1, §4-§6; DEC-BR-014 §4, §6; DEC-BR-015 §1 (tenant_id única clave)"
  - "common.spec.yaml GRD-CM-11, GRD-CM-15, INV-CM-02, INV-CM-11"
  - "R-10, R-16, R-22 / F-X8-11 (CA-144), FN-4, FN-6, FN-7, FN-8 (registers/risk-register-IT0.md, registers/findings-register-IT0.md)"

decisions:
  - {id: Q-17, decision: "(a) La consola STAFF del colegio (/staff/*) se sirve desde web con app_rw y RLS por tenant. platform_rw queda solo para el equipo de LectorPro (sesiones CASE y PLATFORM).", by: Carlos, date: "2026-10-11"}
  - {id: Q-18, decision: "(a) transition_owner (NOLOGIN, NOSUPERUSER, NOBYPASSRLS) es dueño de TODAS las funciones SECURITY DEFINER de transición de revocation y rights_case (titular, escuela, operador y SYSTEM) y es el único rol con INSERT en el ledger de esos eventos. La escritura directa de app_rw se revoca en PR-5.", by: Carlos, date: "2026-10-11"}
  - {id: Q-18-I9, decision: "Opción A (Carlos, 2026-10-14): el alcance de transition_owner incluye la transición I9 de Invitation (VERIFIED -> CANCELLED, reasonCode SUBJECT_MISMATCH_REPORTED, API-CNS-128): la función SECURITY DEFINER case_state.cancel_invitation_subject_mismatch (0044) es dueña del UPDATE de app.invitation.state a CANCELLED y del INSERT de Invitation:INVITATION_CANCELLED (por case_state.ledger_append). app_rw sigue SIN ese par en la allowlist del ledger (0041, LG-3/LG-5; no se reabre) y solo tiene EXECUTE de la función.", by: Carlos, date: "2026-10-14"}
  - {id: LG-8, decision: "ADR-010 rev. 5 (Carlos, 2026-10-13/15): el ledger no-Revocation lo genera la base desde OLD->NEW con el rol ledger_writer (NOLOGIN, esquema ledger_gen, dueno ledger_gen_owner); app_rw queda SIN INSERT sobre integrity.audit_event. transition_owner sigue emitiendo Revocation, RightsCase, CONSENT_REVOKED, RECEIPT_CREATED de R4/R7 e Invitation:INVITATION_CANCELLED (Q-18-I9). Los doce owners de §4.1.1 incluyen los dos nuevos (F-PR6-11).", by: Carlos, date: "2026-10-15"}
  - {id: PR-b-F-PRB, decision: "Dictamen de arquitectura 2026-10-15: F-PRB-01 managementLinkIssued se deriva de tenant_resolve.handle (fila no rotada; ledger_writer solo lee tenant_id, revoked_decision_ref, rotated_at); F-PRB-02 se retira case_state.seed_local_revoke_decision; F-PRB-03 Enrollment ACTIVE->CLOSED no es arista hasta EN1 + Q-28; F-PRB-04 ledger_writer = 19 pares (17 derivados + 2 siembra LOCAL) y transition_owner = 14.", by: "lampone-architect (human gate de Carlos)", date: "2026-10-15"}
  - {id: Q-19, decision: "§4.1.1 incluye security_event_owner, tenant_resolve_owner, staff_roster_owner y outbox_claimer. La aserción de membresía por modo corre en el runner y en startup-checks.", by: Carlos, date: "2026-10-11"}
  - {id: D-2026-10-11-2, decision: "Los enums de rol quedan FIJOS (ver fixedEnums). Cambiarlos requiere decisión de Carlos y migración nueva.", by: Carlos, date: "2026-10-11"}
  - {id: D-2026-10-11-3, decision: "Bootstrap del primer PLATFORM: fixture LOCAL sintético dentro de los fixtures locales (db/fixtures/local/0002_platform_bootstrap.sql, patrón TEST-CNS-879). STAGING y datos reales: ceremonia de break-glass de PR-7 (NO implementada en PR-4).", by: Carlos, date: "2026-10-11"}
  - {id: D-2026-10-11-4, decision: "La excepción de tenantRef (F-A10-07) aplica SOLO en la API del proceso platform; la vía web (consola STAFF, app_rw) deriva el tenant de la sesión STAFF y nunca lo acepta de la request.", by: Carlos, date: "2026-10-11"}
  - {id: D-2026-10-11-6, decision: "Nadie aprueba su propio acceso: approved_by_ref <> principal_ref (CHECK en tenant_membership y platform_role_assignment, y DENY SELF_ACCESS en platform.authorize_target). Es aparte del solicitante <> aprobador (SELF_APPROVAL).", by: Carlos, date: "2026-10-11"}
  - {id: Q-20, decision: "(c) R-21-2 se cierra sin event trigger: sin membresía SET fuera de la ceremonia y con auditoría de las sesiones que usen el rol.", by: Carlos, date: "2026-10-11"}

fixedEnums:   # D-2026-10-11-2; ya así en 0035 (CHECK) y vigentes en 0036
  membership_role: [TENANT_ADMIN, INVITER]                       # platform.tenant_membership.membership_role
  platform_role: [PLATFORM, RIGHTS_OPERATOR, APPROVER, CONTEXT_OWNER]   # platform.platform_role_assignment.platform_role
  approver_class: [PRIVACY_LEGAL, SECURITY]                      # solo con platform_role = APPROVER (CHECK platform_role_assignment_approver_class_iff)
  principal_ref: "UUIDv4 opaco, minúsculas (^[0-9a-f]{8}-…-4…-[89ab]…$). La forma staff-synthetic-NN deja de ser válida en platform (PR-4, F-A10-12)."

principalIdentity:   # F-A10-12 / ADR-010 §4.4 / N6 — migración 0036
  table: platform.principal_identity   # dueño membership_owner; FORCE RLS; append-only; sin acceso de ningún runtime
  mapping: "UNIQUE en ambos sentidos: principal_ref (PK) <-> sub_hmac (UNIQUE). sub_hmac = HMAC-SHA256(K_sub, iss 0x1f sub) en hex; el sub en claro nunca se persiste."
  enforcement: "platform.record_assertion (grant_owner, EXECUTE solo integrity_verifier) degrada a REJECTED/SUB_MISMATCH si el sub_hmac informado no es el mapeado al principal_ref del canje, aunque el verifier pida ATTESTED."
  creation: "LOCAL: fixture sintético. IT0b/STAGING/datos reales: OPEN (OI-DBR-09); ninguna función de runtime crea el vínculo (evita trust-on-first-use)."

selfApproval:   # D-2026-10-11-6
  rule: "approved_by_ref <> principal_ref. Se impone en DOS capas: CHECK de tabla (tenant_membership_no_self_approval, platform_role_assignment_no_self_approval) y platform.authorize_target (reason_code SELF_ACCESS). Aparte: approved_by_ref <> requested_by_ref (SELF_APPROVAL, *_double_control)."
  tests: [TEST-CNS-1364]

bootstrap:   # D-2026-10-11-3
  LOCAL: "db/fixtures/local/0002_platform_bootstrap.sql: dos principals PLATFORM sintéticos (A y B) ACTIVE, con requested_by/approved_by sintéticos distintos de ellos, y su fila de principal_identity con sub_hmac sintético. Se necesitan DOS: con uno solo nunca se aprobaría un tercero (solicitante <> aprobador y approved_by <> principal)."
  STAGING_AND_REAL_DATA: "Ceremonia de break-glass de PR-7 (Q10). NO implementada en PR-4; el fixture LOCAL se niega fuera de LOCAL (applyLocalFixtures) y el SQL aborta si ops.db_catalog no es LOCAL/SYNTHETIC."
  tests: [TEST-CNS-1368]

tenantRefException:   # D-2026-10-11-4 / F-A10-07
  scope: "SOLO la API del proceso platform (contracts/openapi/consent-platform.openapi.yaml): solicitudes de membership (tenant destino) y de role-assignment (cross-tenant) del equipo de LectorPro."
  web: "La vía web (consola STAFF, app_rw) deriva el tenant de la sesión STAFF (app.current_tenant_id()); API-CNS-100 sigue vigente: ningún request del titular/escuela acepta tenantRef."
  db: "platform.request_membership(p_tenant_id, …) recibe el tenant destino solo desde platform_rw (rol PLATFORM activo + step-up). Desde app_rw (TENANT_ADMIN) el tenant del parámetro debe ser el de la transacción (TENANT_MISMATCH si no)."

modes:
  - id: IT0B_SYNTHETIC
    rule: "Datos sintéticos. Residuales tipo R-22 aceptados solo aquí: consent_owner con SET (INHERIT FALSE) sobre owners de §4.1.1 (Q15 c) y consent_migrator con SET sobre outbox_claimer."
  - id: REAL_DATA
    rule: "Nadie tiene SET sobre los owners de §4.1.1 en operación normal; toda DDL sobre sus objetos va por la ceremonia ddl_breakglass (§4.5.3), con sesiones auditadas (Q-20 c). Requiere además Q1 (opción C), APR-IDP, DEC-BR nueva que enmiende DEC-BR-014, DEC-BR-003, G2, G3."
  - note: "El modo lo declara el runner (variable de entorno del deploy, nunca la request) y lo verifica la aserción posterior al cluster y startup-checks (INV-DBR-03)."

conventions:
  roleAttributesDefault: "NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS (patrón 0000:27, 0000:34)"
  membershipNotation: "member -> role {inherit, set}. SET TRUE + INHERIT FALSE = solo SET [LOCAL] ROLE explícito, sin heredar privilegios."
  securityDefinerHygiene: "SET search_path = pg_catalog, pg_temp; REVOKE EXECUTE … FROM PUBLIC; sin SQL dinámico (EXECUTE format) sobre objetos protegidos; tenant derivado del registro y comparado con app.current_tenant_id() (ADR-010 §4.2, D3); cada función de transición fija case_state.effect con su propio nombre al entrar."
  passwords: "Solo roles LOGIN; las fija migrate.ts setRolePasswords desde el entorno; nunca en el repo (0000:7-9)."

roles:
  # ---------------------------------------------------------------- runtime (LOGIN)
  - id: app_rw
    class: RUNTIME
    process: "web (titular + consola STAFF del colegio, Q-17)"
    login: true
    status: MAIN
    createdBy: "0000:30-35"
    settings: ["idle_in_transaction_session_timeout = 10s (0000:52)"]
    memberOf:
      - {role: staff_roster_reader, inherit: false, set: true, status: "MAIN (0018:32); se mantiene (Q-17: GET /staff/roster sigue en web)"}
    setRoleBy: []
    schemas:
      - {schema: app, privileges: [USAGE], status: "MAIN (0001:28)"}
      - {schema: integrity, privileges: [USAGE], status: "MAIN (0001:28)"}
      - {schema: ops, privileges: [USAGE], status: "MAIN (0001:28)"}
      - {schema: tenant_resolve, privileges: [USAGE], status: "MAIN (0001:30)"}
      - {schema: case_state, privileges: [USAGE], status: "PR-5 (solo EXECUTE de funciones del titular y de la escuela)"}
      - {schema: platform, privileges: [USAGE], status: "PR-3 (solo EXECUTE de platform.request_membership para TENANT_ADMIN, Q4 + Q-17)"}
    tables:
      - {object: ops.db_catalog, privileges: [SELECT], status: "MAIN (0001:76)"}
      - {object: integrity.audit_event, privileges: ["SELECT"], status: "PR-b 0049 (ADR-010 rev. 5): app_rw SIN INSERT ni policy de INSERT (lo emiten ledger_writer y transition_owner); antes: MAIN; PR-5 policy de INSERT que excluye aggregate_type Revocation/RightsCase y CONSENT_REVOKED (DECIDIDO, Q-18; INV-DBR-07)"}
      - {object: app.outbox, privileges: ["SELECT", "INSERT(columnas 0003:74-75)"], status: MAIN}
      - {object: app.subject, privileges: ["SELECT(tenant_id, subject_ref)"], status: "MAIN (0005:58)"}
      - {object: app.school_participation, privileges: ["SELECT(columnas 0005:59)"], status: MAIN}
      - {object: app.consent_decision, privileges: ["SELECT", "INSERT(columnas)", "UPDATE(state, purposes, prior_steps_complete, steps_recorded, receipt_ref)"], status: "MAIN (0006:106-111); PR-5 policy WITH CHECK state <> 'REVOKED' (C6 solo por case_state.apply_revocation; DECIDIDO 2026-10-11, F-A10-06)"}
      - {object: app.revocation, privileges: ["SELECT", "INSERT(0006:113-115, 0016:18)", "UPDATE(0006:116-118, 0016:19)"], status: "MAIN; PR-5 REVOKE INSERT y UPDATE (todas las transiciones por funciones); queda SELECT"}
      - {object: app.recovery_token, privileges: ["SELECT", "INSERT(columnas)", "UPDATE(consumed_at)"], status: "MAIN (0006:120-123); sin cambio"}
      - {object: app.invitation, privileges: ["SELECT", "INSERT(columnas)", "UPDATE(0010:156-157)", "UPDATE(otp_exhausted)"], status: "MAIN (0010:149-157, 0032:43); 0044 (Q-18-I9): policies invitation_tenant_insert/update con state <> 'CANCELLED' (WITH CHECK y USING): app_rw no deja ni des-cancela CANCELLED"}
      - {object: app.otp_verification, privileges: ["SELECT", "INSERT/UPDATE(columnas 0010:159-162, 0032:55-56)"], status: "MAIN; residual declarado: vía OTP del titular (ADR-010 §4.2)"}
      - {object: app.rights_case, privileges: ["SELECT", "INSERT(0010:164-165)", "UPDATE(status, revocation_ref, origin)"], status: "MAIN (0010:166); PR-5 REVOKE INSERT y UPDATE"}
      - {object: app.enrollment, privileges: ["SELECT", "INSERT(columnas)", "UPDATE(state)"], status: "MAIN (0010:168-169)"}
      - {object: app.idempotency_key, privileges: ["SELECT", "INSERT(columnas)", "UPDATE(columnas)"], status: "MAIN (0012:40-43)"}
      - {object: ops.access_log, privileges: ["SELECT", "INSERT(columnas)"], status: "MAIN (0014:62-63); se mantiene (Q-17: lecturas del roster STAFF)"}
      - {object: app.staff_session, privileges: [SELECT, "INSERT(columnas)", "UPDATE(last_seen_at, revoked_at)", DELETE], status: "MAIN (0021:66-69); se mantiene con RLS por tenant (Q-17)"}
      - {object: app.case_session, privileges: [SELECT, "INSERT(columnas)", "UPDATE(last_seen_at, revoked_at)", DELETE], status: "MAIN (0022:65-68); PR-5 REVOKE ALL (pasa a platform)"}
      - {object: ops.security_event, privileges: ["INSERT(columnas 0025:78, 0029:105)", "INSERT(delivery_kind, receipt_ref) (0045)"], policy: "security_event_app_rw_insert (0029:96-103; 0045 la altera con ALTER POLICY y suma GUEST_MESSAGE_DELIVERY_FAILED)", status: "MAIN; 0045 (SEC-CNS-PR94 P2-A, Carlos 2026-10-14): tipo GUEST_MESSAGE_DELIVERY_FAILED (fallo de entrega post-commit de RECEIPT/MANAGEMENT_LINK; solo delivery_kind y receipt_ref UUIDv4 opaca; sin PII ni token), CHECK security_event_type_enum/otp_shape/delivery_kind_enum/receipt_ref_uuidv4/delivery_cols_only_for_type; DDL como security_event_owner, sin cambio de dueno ni de las 4 policies; PR-5: la policy conserva OTP_*, RECOVERY_TOKEN_ISSUED, MANAGEMENT_TOKEN_ROTATED, STAFF_LOGIN, STAFF_LOGOUT y SESSION_REVOKED_BY_ROTATION con session_kind STAFF; quita CASE_LOGIN, CASE_LOGOUT y la rotación CASE (a platform_rw)"}
      - {object: ops.otp_budget, privileges: [SELECT, "INSERT(columnas)", "UPDATE(failures, window_start, expires_at)"], status: "MAIN (0032:89-100)"}
    functions:
      - {name: "app.current_tenant_id()", status: "MAIN (0001:39)"}
      - {name: "ops.catalog_environment()", status: "MAIN (0002:22)"}
      - {name: "app.is_reserved_email(text)", status: "MAIN (0005:25)"}
      - {name: "tenant_resolve.* (7 funciones SECURITY DEFINER)", status: "MAIN (0007:44,69; 0011:54,79,91,117,136)"}
      - {name: "ops.retention_status()", status: "MAIN (0031:286)"}
      - {name: "case_state.<funciones del titular> y case_state.report_school_revocation_intent (transitions.md §A, §B)", status: "PR-5 (dueño transition_owner, Q-18)"}
      - {name: "platform.request_membership (solo solicitud de TENANT_ADMIN)", status: "PR-3 (Q4 + Q-17)"}
    mustNot:
      - "INSERT/UPDATE directo en app.revocation / app.rights_case (desde PR-5)"
      - "Append directo al ledger de eventos Revocation, RightsCase o CONSENT_REVOKED (desde PR-5)"
      - "consent_decision.state = 'REVOKED' (desde PR-5)"
      - "Sesiones CASE; EXECUTE de funciones de operador, aprobador y SYSTEM (GRD-CM-15), de ops.purge_p34 y de aprobaciones de aprovisionamiento"
      - "Ser miembro de cualquier owner, de rights_operator o de outbox_claimer"
    verifiedBy:
      startupChecks: ["expectedRole = app_rw (startup-checks.ts:86-88, F6)", "no miembro de owners (startup-checks.ts:93-100; PR-2 amplía la lista a §4.1.1)", "staff_roster_reader INHERIT FALSE/SET TRUE (startup-checks.ts:216-220; sin cambio por Q-17)", "sin CREATE, sin session_replication_role (:107-117)", "sin EXECUTE de ops.purge_p34 (:142-153)", "PR-5: sin EXECUTE de funciones de operador/SYSTEM"]
      tests: [TEST-CNS-742, TEST-CNS-744, TEST-CNS-747, TEST-CNS-807, TEST-CNS-810, TEST-CNS-884, TEST-CNS-1087, TEST-CNS-1189, TEST-CNS-1306, TEST-CNS-444]
      newTests: ["TEST-CNS-TBD-DBR-01: app_rw recibe 42501 en UPDATE/INSERT de app.revocation y app.rights_case (PR-5)", "TEST-CNS-TBD-DBR-02: app_rw recibe 42501/23514 al append directo de eventos Revocation/RightsCase o CONSENT_REVOKED (PR-5, INV-DBR-07)", "TEST-CNS-TBD-DBR-10: app_rw no puede poner consent_decision.state = 'REVOKED' (PR-5)"]

  - id: platform_rw
    class: RUNTIME
    process: "platform (solo equipo de LectorPro, Q-17)"
    login: true
    status: MAIN
    createdBy: "0000:30-35"
    settings: ["idle_in_transaction_session_timeout = 10s (0000:54)"]
    egress: none   # ADR-010 §4.3.2, Q14
    memberOf:
      - {role: rights_operator, inherit: false, set: true, status: PR-5}
    schemas:
      - {schema: app, privileges: [USAGE], status: "MAIN (0001:28)"}
      - {schema: integrity, privileges: [USAGE], status: "MAIN (0001:28); revisar si sigue haciendo falta tras PR-5"}
      - {schema: ops, privileges: [USAGE], status: "MAIN (0001:28)"}
      - {schema: platform, privileges: [USAGE], status: PR-3}
      - {schema: case_state, privileges: [USAGE], status: PR-5}
    tables:
      - {object: ops.db_catalog, privileges: [SELECT], status: "MAIN (0001:76)"}
      - {object: platform.oidc_exchange, privileges: [], note: "sin privilegios de tabla ni DML (N4): inicia y completa SOLO por platform.begin_oidc_authorization / complete_oidc_callback (rev. 5 §2; enqueue_oidc_exchange se retiró en 0051); code y PKCE son secretos operativos y nadie hace SELECT. Columnas 0050: kind (LOGIN_PLATFORM|LOGIN_CASE|STEP_UP), state_hash (UNIQUE), target_ref_hash (solo LOGIN_CASE), estado AWAITING_CALLBACK", status: "MAIN (0036, 0050, 0051)"}
      - {object: "platform.login_assertion / platform.session_event", privileges: [], note: "tablas de grant_owner (0050), FORCE RLS, sin privilegios de runtime; login_assertion: vida <= 5 min desde auth_time (CHECK), un solo uso, sin sub_hmac; session_event: sin IP (F-PR6-31), append-only; retención = LEGAL DECISION LD-15/P-34", status: "MAIN (0050)"}
      - {object: ops.access_log, privileges: ["INSERT(columnas)"], status: "PR-5 (lecturas del operador); app_rw lo conserva para STAFF"}
      - {object: ops.security_event, privileges: ["INSERT(columnas de sesión)"], policy: "nueva policy FOR INSERT TO platform_rw: CASE_LOGIN, CASE_LOGOUT y SESSION_REVOKED_BY_ROTATION con session_kind CASE (y PLATFORM si se agrega al enum)", status: "PR-5 (SEC-CNS-021 §3); DDL como security_event_owner"}
      - {object: app.case_session, privileges: [], note: "sin DML directo; solo por funciones (N7)", status: PR-5}
      - {object: "platform.tenant_membership / platform.platform_role_assignment", privileges: [], note: "sin DML; solo funciones de aprovisionamiento con doble control (Q4)", status: PR-3}
    functions:
      - {name: "app.current_tenant_id(), ops.catalog_environment(), app.is_reserved_email(text)", status: "MAIN (0001:39, 0002:22, 0005:25)"}
      - {name: "platform.authorize(action, resource_ref)", status: PR-3}
      - {name: "platform.issue_action_nonce(action, refs)", status: PR-3}
      - {name: "platform.request_membership / approve_membership / request_role_assignment / approve_role_assignment", status: "PR-3 (nombres propuestos; Q4)"}
      - {name: "platform.begin_oidc_authorization(kind, state_hash, binding, pkce_verifier, target_ref_hash, ttl, max_awaiting, p51_max, p51_window) (dueño grant_owner; crea AWAITING_CALLBACK; aplica P-53 y, en STEP_UP, P-51; NULL ante DENY con evidencia)", status: "MAIN (0051); reemplaza a platform.enqueue_oidc_exchange (retirada)"}
      - {name: "platform.complete_oidc_callback(state, code) (AWAITING_CALLBACK -> PENDING solo si sha256(state) coincide, vigente y sin uso previo)", status: "MAIN (0051)"}
