openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Consent App IT0 — API HTTP (borrador)
  version: 0.1.0-draft
  x-api-id: API-CNS-100
  x-status: DRAFT
  x-it0-only: true
  x-data-class: SYNTHETIC_ONLY
  x-spec-source: specs/state-machines/*.spec.yaml rev. 4c–4f + specs/adapters/lectorpro-beta.spec.yaml (CA-116; main @ bc945d5, PR #6)
  x-governed-by:
    - specs/state-machines/common.spec.yaml (routeClasses, GRD-CM-*, INV-CM-*)
    - specs de las 6 máquinas (transiciones con httpPost true)
    - specs/adapters/lectorpro-beta.spec.yaml (F-012: contextRef, productRef, allowPartialGrant y finalidades se resuelven desde el adapter activo, no del contrato genérico)
    - SM-CNS-001 v6/v7
    - DEC-BR-014 §4, §5, §6 (Iteración 0; solo datos sintéticos)
    - DEC-BR-015 §1 (tenant = colegio), DEC-BR-016 §8, DEC-BR-017 §1-§8
    - ADR-001 §2, ADR-002, ADR-006 §6
    - SEC-CNS-005 rev. 5, SEC-CNS-006 rev. 5
    - DEC-BR-018 (ACCEPTED 2026-09-27; R13/R14 y SM-CNS-001 v7: cierra F-001…F-007, F-009, P-02, OPEN-RV-11, OPEN-TC-07 y la decisión 9)
  x-human-gate: "Ningún contrato está aprobado; cierre = human gate de Carlos."
  description: |
    Transcripción del diseño de rutas de `contracts/README.md` y de las `x-transitions`
    de las proyecciones JSON Schema (API-CNS-186…191). Operaciones API-CNS-101…160.

    Reglas transversales (verificables por lint):
    - Cero PII en path y query: solo referencias opacas UUIDv4 (INV-CM-09) o tokens
      opacos de canje. Nunca email, teléfono, nombre ni RUT.
    - Ningún request acepta `tenantRef` ni `organization*`: el tenant se resuelve en
      servidor desde la credencial (GRD-CM-01; DEC-BR-015 §1). Los bodies usan
      `additionalProperties: false`.
    - Todo POST exige CSRF + Origin/Host exacto (GRD-CM-10; ERR-CM-09).
    - Ningún GET consume un token ni transiciona un agregado (INV-CM-08): /i/, /m/, /r/
      se canjean con 303 a una ruta sin token.
    - `eligibility_to_participate != eligibility_to_revoke` (INV-CM-06): las rutas
      RIGHTS nunca leen `*.active` de tenant, estudio, participación, matrícula ni contexto.
    - Respuestas RIGHTS uniformes: nunca «denegado»; siempre `rightsPathsAvailable`
      (RULE-CNS-TBD-02; INV-RV-05; INV-OT-06).
    - En rutas del portador (landingHandle, manageHandle, recoveryHandle) ERR-CM-01, ERR-CM-02 y
      ERR-CM-10 (ACTOR_NOT_ALLOWED) salen con la respuesta uniforme de ERR-CM-01 (404
      UniformNotFound, AC-07.1), nunca con un 403 ni un código distinguible (SEC-CNS-013). El 403
      de esas rutas es solo CSRF_REJECTED (ERR-CM-09). ACTOR_NOT_ALLOWED solo se expone en las
      consolas STAFF, PLATFORM y CASE.
    - Secretos (código OTP, aserciones de step-up) son `writeOnly` y nunca se loguean.

    Convenciones de extensiones:
    `x-governed-by`, `x-state-transition` (IDs de las specs), `x-route-class`
    (ISSUANCE_DECISION | STAFF_ADMIN | RIGHTS | PLATFORM), `x-eligibility`,
    `x-actor`, `x-guards`, `x-pending` (decisiones abiertas; ninguna se resuelve aquí),
    `x-not-exposed` (transiciones sin superficie HTTP y por qué), `x-errors` (errores de la spec;
    transcritos solo en las operaciones sincronizadas con F-011 y SEC-CNS-013, el resto OPEN-CT-08).
    Transiciones con más de una fuente (convención guardsBySource de common.spec; SEC-CNS-012
    N2-01): `x-actor.bySource` y `x-guards-by-source` (common + una lista por fuente) las
    transcriben; `x-guards` lista los guards efectivos de la fuente HTTP de la operación
    (`x-actor.source`) = comunes ∪ esa fuente. Las fuentes SYSTEM y FIXTURE no tienen superficie
    HTTP: la fuente se deriva de la identidad de ejecución (rol de DB + entrypoint), nunca de un
    campo, header ni marca de la request (GRD-CM-15, INV-CM-11).
  x-pending:
    - "OPEN-CT-04: rango API-CNS-100…199 propuesto; reconciliar con el registro de Notion. API-CNS-001 reservado (AuthorizationCheck del consumidor)."
    - "P-26 / SEC-CNS-006: nombres de cookie __Host- y de la cabecera CSRF son ilustrativos hasta fijarse."
    - "OPEN-CT-08 (nuevo): las specs no fijan los códigos HTTP exactos por error; los status de este borrador son propuesta."
    - "OPEN-RV-12 (F-SEC-013-02): errors[] de una transición no es sistemáticamente el cierre de onFail(guards); falta checker genérico."
    - "OPEN-RV-13 (F-SEC-013-03, fuera de alcance de SEC-CNS-013): R1r, R10, R11 sin GRD-CM-07; R2, R3 sin GRD-CM-01."
    - "OPEN-CT-09: I1 idempotencyKey (tenantRef, clientRequestId) sin clientRequestId en el body; se transcribe como cabecera Idempotency-Key. (La parte 'cosign RH3 sin schema propio' se cerró: CosignCaseConfirmationRequest.)"
servers:
  - url: http://localhost:8080
    description: LOCAL / CI únicamente (DEC-BR-014; ADR-003 rev. 7). Sin proveedor cloud, sin staging ni producción (NOT PROVISIONED).
tags:
  - name: redemption
    description: Canje GET de enlaces /i/, /m/, /r/ (sin transición; INV-CM-08).
  - name: staff
    description: Consola STAFF del colegio (tenant). Cookie y CSRF propios (GRD-CM-10).
  - name: bearer-invitation
    description: Portador del enlace de invitación (UNVERIFIED_BEARER hasta V3).
  - name: bearer-otp
    description: Verificación OTP del canal ligado (otp-challenge).
  - name: bearer-decision
    description: Decisión de consentimiento (consent-decision).
  - name: bearer-rights
    description: Rutas RIGHTS del titular (gestión, revocación, recuperación, caso humano).
  - name: platform
    description: Consola PLATFORM y sesión CASE (RIGHTS_OPERATOR, PRIVACY_LEGAL, SECURITY, CONTEXT_OWNER).
security: []
components:
  securitySchemes:
    landingHandle:
      type: apiKey
      in: cookie
      name: __Host-cns-landing
      description: Handle LANDING creado por GET /i/{token} (P-12); tras V3 scope DECISION el ID de sesión rota (P-30) y la sesión queda verificada para C1…C5.
      x-pending: ["P-26 (nombre de cookie)"]
    manageHandle:
      type: apiKey
      in: cookie
      name: __Host-cns-manage
      description: Handle MANAGE_ENTRY creado por GET /m/{token} (P-14); habilita V1 scope MANAGE/REVOCATION, RV0 del portador, RC1, RC2u (POST explícito, F-011), RC3/RC3a (CFG-RV-MANAGEMENT-LINK; erratum R13-3). Tras V3 queda sesión MANAGE verificada (P-28).
      x-pending: ["P-26 (nombre de cookie)"]
    recoveryHandle:
      type: apiKey
      in: cookie
      name: __Host-cns-recovery
      description: Portador del hash del token fijado por GET /r/{token} sin validar ni consumir (P-18). Es un handle RECOVERY válido solo si GRD-RV-06 resuelve en GET /recovery/confirm o en POST /recovery/revoke; si no, no existe handle.
      x-pending: ["P-26 (nombre de cookie)"]
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-cns-staff
      description: >-
        Sesión de consola STAFF con membership TENANT vigente (GRD-CM-01/02/07). Acceso staff IT0_ONLY.
        CA-138 (SEC-CNS-018 rev. 2 D-3): la cookie lleva sid aleatorio (256 bits), iat y exp firmados (HMAC) y cada request se valida además contra el
        registro de sesiones del servidor (solo el hash del sid, RLS por tenant): firma, no vencida (expiración absoluta), no revocada, sin superar la
        inactividad, y tenant, principal y rol coincidentes. Cualquier fallo es el mismo 404 uniforme sin filtrar la causa. Logout revoca el sid en servidor.
        El token CSRF de la consola, el cursor de GET /staff/roster y la cookie flash de la UI quedan ligados al sid. Cada login emite un sid nuevo (rotación).
        Acceso staff IT0_ONLY.
      x-pending: ["P-26 (nombre de cookie)", "LD-03 (quién opera RC0 y con qué base)", "CA-138: vida absoluta (propuesta 8 h) e inactividad (propuesta 30 min) PROPUESTAS, pendiente aprobación de Carlos (approved-parameters.ts)"]
    platformSession:
      type: apiKey
      in: cookie
      name: __Host-cns-platform
      description: Sesión PLATFORM propia (PRIVACY_LEGAL, SECURITY, CONTEXT_OWNER); step-up P-36 por acción.
      x-pending: ["P-26 (nombre de cookie)", "APR-IDP (parámetros del IdP: PENDING — Carlos / studio)", "OPEN-TC-06 (PRIVACY_LEGAL fuera del enum actorRole)"]
    caseSession:
      type: apiKey
      in: cookie
      name: __Host-cns-case
      description: Sesión CASE del RIGHTS_OPERATOR ligada a un caseRef (ADR-006 §6.3); el actor se deriva de la sesión, nunca de un parámetro.
      x-pending: ["P-26 (nombre de cookie)", "APR-IDP"]
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token CSRF de la consola/superficie correspondiente; además Origin/Host por igualdad exacta (GRD-CM-10). Falta o no coincide → ERR-CM-09 sin efecto.
      schema: {type: string, minLength: 16, maxLength: 256, pattern: "^[A-Za-z0-9._~-]+$"}
      x-governed-by: ["GRD-CM-10", "SEC-CNS-006 P-26", "SEC-CNS-005 T-03, T-04"]
      x-pending: ["P-26 (nombre de la cabecera)"]
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Ligada a (tenantRef, principal, operación), almacenada solo como hash con TTL P-33 (GRD-CM-08). Misma key + otro payloadHash → ERR-CM-07.
      schema: {$ref: '../schemas/common.schema.json#/$defs/IdempotencyKey'}
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Opcional; la idempotencia natural de la transición la fija el servidor (ver `x-idempotency`). Si se envía, aplica GRD-CM-08.
      schema: {$ref: '../schemas/common.schema.json#/$defs/IdempotencyKey'}
    RedemptionToken:
      name: token
      in: path
      required: true
      description: Token opaco de canje (credencial de un solo propósito, sin PII). Solo se persiste su hash; nunca se loguea ni se reenvía a terceros (Referrer-Policy no-referrer).
      schema: {type: string, minLength: 32, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
      x-sensitive: "credencial; nunca se loguea"
      x-pending: ["DEC-BR-003 / EXT-A / LD-01 (P0 del enlace: bloquea todo uso con datos reales)"]
    InvitationRef:
      name: invitationRef
      in: path
      required: true
      schema: {$ref: '../schemas/common.schema.json#/$defs/Ref'}
    EnrollmentRef:
      name: enrollmentRef
      in: path
      required: true
      schema: {$ref: '../schemas/common.schema.json#/$defs/Ref'}
    CaseRef:
      name: caseRef
      in: path
      required: true
      description: Debe coincidir con el caseRef ligado a la sesión CASE (ADR-006 §6.3); si no, 404 uniforme.
      schema: {$ref: '../schemas/common.schema.json#/$defs/Ref'}
    ProposalRef:
      name: proposalRef
      in: path
      required: true
      schema: {$ref: '../schemas/common.schema.json#/$defs/Ref'}
    ContextRef:
      name: contextRef
      in: path
      required: true
      description: Código de catálogo del contexto (no PII), resuelto desde el adapter activo (F-012).
      schema: {$ref: '../schemas/common.schema.json#/$defs/ContextRef'}
  headers:
    Location:
      description: Ruta relativa sin token (p. ej. /welcome, /manage, /recovery/confirm).
      schema: {type: string, pattern: "^/[a-z-]+(/[a-z-]+)*$"}
    SetCookie:
      description: Cookie __Host- del handle (Secure; HttpOnly; SameSite; Path=/), P-26.
      schema: {type: string}
  responses:
    RedeemSeeOther:
      description: Canje válido. Crea el handle, fija la cookie y redirige a una ruta sin token. No consume el token ni transiciona (INV-CM-08).
      headers:
        Location: {$ref: '#/components/headers/Location'}
        Set-Cookie: {$ref: '#/components/headers/SetCookie'}
    UniformNotFound:
      description: 404 uniforme (mismo cuerpo, código y tiempo acotado) para token o ref inexistente, expirado, rotado o de otro tenant/contexto (ERR-CM-01, ERR-IV-01). En rutas del portador cubre también ERR-CM-02 y ERR-CM-10 (SEC-CNS-013).
      content:
        application/json:
          schema: {$ref: '../schemas/common.schema.json#/$defs/UniformNotFound'}
    CsrfRejected:
      description: ERR-CM-09 (CSRF_REJECTED), sin efecto.
      content:
        application/problem+json:
          schema: {$ref: '../schemas/common.schema.json#/$defs/Problem'}
    Problem:
      description: Error sin texto libre ni PII (INV-CM-05). `code` del enum ErrorCode.
      content:
        application/problem+json:
          schema: {$ref: '../schemas/common.schema.json#/$defs/Problem'}
    RightsProblem:
      description: Error en ruta RIGHTS. Nunca «denegado»; siempre ofrece las tres vías (RightsPaths).
      content:
        application/problem+json:
          schema:
            allOf:
              - {$ref: '../schemas/common.schema.json#/$defs/Problem'}
              - required: [rightsPathsAvailable]
    UniformAccepted:
      description: Respuesta genérica idéntica exista o no el canal, la cadena, el caso o el límite (ERR-OT-01, ERR-OT-07, ERR-OT-08, ERR-RV-02, ERR-RV-05, ERR-RV-12, ERR-RV-19, ERR-RC-01, ERR-RC-02, ERR-RC-09).
      content:
        application/json:
          schema: {$ref: '../schemas/common.schema.json#/$defs/UniformAccepted'}
    RecoveryRedeemSeeOther:
      description: Respuesta idéntica (status, headers, Location /recovery/confirm, atributos y largo del Set-Cookie) sea el token válido, inexistente, consumido, expirado, de otro tenant o de otra cadena o ciclo. No lee la BD, no valida, no consume, no emite (INV-CM-08; Carlos 2026-09-28).
      headers:
        Location: {$ref: '#/components/headers/Location'}
        Set-Cookie: {$ref: '#/components/headers/SetCookie'}
    InvitationRedeemSeeOther:
      description: Respuesta idéntica (status, headers, Location /welcome, atributos y largo del Set-Cookie) sea el token válido, inexistente, expirado o de otro tenant. No lee la BD (GRD-IV-13 incluido): solo hashea el token y fija el handle INVITATION_LANDING firmado. GRD-IV-13/GRD-IV-07 se evalúan en la página HTML /welcome (INV-CM-08; Carlos 2026-09-28, mismo patrón que RecoveryRedeemSeeOther).
      headers:
        Location: {$ref: '#/components/headers/Location'}
        Set-Cookie: {$ref: '#/components/headers/SetCookie'}
    ManagementRedeemSeeOther:
      description: Respuesta idéntica (status, headers, Location /manage, atributos y largo del Set-Cookie) sea el token válido, inexistente o rotado. No lee la BD: solo hashea el token y fija el handle MANAGE_ENTRY firmado. GRD-CM-01 se evalúa en la página HTML /manage (INV-CM-08; Carlos 2026-09-28, mismo patrón que RecoveryRedeemSeeOther).
      headers:
        Location: {$ref: '#/components/headers/Location'}
        Set-Cookie: {$ref: '#/components/headers/SetCookie'}
  schemas:
    Problem: {$ref: '../schemas/common.schema.json#/$defs/Problem'}
    UniformAccepted: {$ref: '../schemas/common.schema.json#/$defs/UniformAccepted'}
    EmptyCommand: {$ref: '../schemas/api-payloads.schema.json#/$defs/EmptyCommand'}
paths:
  # ---------------------------------------------------------------------------
  # Canje de enlaces (GET sin transición; INV-CM-08)
  # ---------------------------------------------------------------------------
  /i/{token}:
    get:
      operationId: redeemInvitationLink
      x-api-id: API-CNS-101
      tags: [redemption]
      summary: "Canje uniforme del enlace de invitación: siempre 303 a /welcome (SEC-CNS-014)"
      description: Fija el handle INVITATION_LANDING (hash del token, sin leer la BD) sin validar. GRD-IV-13 (participación o Enrollment de la invitación CLOSED, o job CASCADE_CANCEL_INVITATION pendiente) y GRD-IV-07 (expiración) se evalúan en la página HTML /welcome (INV-CM-08; Carlos 2026-09-28, mismo patrón que GET /r/{token}, cierra el oráculo 303 válido/404 inválido de TEST-CNS-537). No transiciona Invitation (la transición I4 ocurre en POST /invitation/open).
      x-governed-by: ["invitation.spec I4 effects, GRD-IV-13", "INV-CM-08", "SM-CNS-001 §2.2", "ADR-001 §2", "SEC-CNS-005 T-01, T-20", "SEC-CNS-006 P-12", "SEC-CNS-012 re-verificación rev. 4b (3)(iii)", "SEC-CNS-014 (Carlos, 2026-09-28)"]
      x-state-transition: none
      x-route-class: ISSUANCE_DECISION
      x-eligibility: "eligibility_to_participate (GRD-CM-05; DEC-BR-016 §8) evaluada en GET /welcome (ya no en el canje); desconocido = false"
      x-redeem-guards: [] # SEC-CNS-014 (Carlos 2026-09-28): ningún guard en el canje; GRD-IV-13/GRD-IV-07 se evalúan en GET /welcome
      x-pending: ["DEC-BR-003 / EXT-A / LD-01 (P0 del enlace)", "SEC-CNS-006 (tope y backoff del job CASCADE_CANCEL_INVITATION: PENDING; OPEN-TC-07 cerrado por DEC-BR-018)"]
      parameters: [{$ref: '#/components/parameters/RedemptionToken'}]
      responses:
        '303': {$ref: '#/components/responses/InvitationRedeemSeeOther'}
  /m/{token}:
    get:
      operationId: redeemManagementLink
      x-api-id: API-CNS-102
      tags: [redemption]
      summary: "Canje uniforme del enlace de gestión: siempre 303 a /manage (SEC-CNS-014)"
      description: Fija el handle MANAGE_ENTRY (hash del token, sin leer la BD) sin validar. resolve_management_token(token_hash) → (tenant_id, chain_ref) se evalúa en GET /manage, no aquí (INV-CM-08; Carlos 2026-09-28, mismo patrón que GET /r/{token}). Nunca *.active. No transiciona ni consume el token. La página del caso que se renderiza tras el canje NO dispara RC2u; RC2u solo transiciona con el POST explícito /rights-case/resume (F-011).
      x-governed-by: ["revocation.spec managementLink (CFG-RV-MANAGEMENT-LINK)", "INV-CM-08", "SM-CNS-001 §5.0", "ADR-006 §6.1", "DEC-BR-017 §1", "SEC-CNS-006 P-13, P-14", "SEC-CNS-014 (Carlos, 2026-09-28)"]
      x-state-transition: none
      x-route-class: RIGHTS
      x-eligibility: "eligibility_to_revoke (GRD-CM-06): evaluada en GET /manage (ya no en el canje); solo existencia del tenant y chainRef; nunca lee *.active"
      x-pending: ["DEC-BR-003 / EXT-A / LD-01"]
      parameters: [{$ref: '#/components/parameters/RedemptionToken'}]
      responses:
        '303': {$ref: '#/components/responses/ManagementRedeemSeeOther'}
  /r/{token}:
    get:
      operationId: redeemRecoveryLink
      x-api-id: API-CNS-103
      tags: [redemption]
      summary: "Canje uniforme del enlace de recuperación: siempre 303 a /recovery/confirm"
      description: Fija el portador del hash sin validar. GRD-RV-06 y ERR-RV-05 se evalúan en la página HTML /recovery/confirm (UX-CNS-004, 33:87/33:106) y en POST /recovery/revoke.
      x-governed-by: ["revocation.spec R1r effects", "INV-CM-08", "SM-CNS-001 v7 §5.1", "DEC-BR-017 §2", "ADR-006 §6.2", "SEC-CNS-014"]
      x-state-transition: none
      x-route-class: RIGHTS
      x-eligibility: "GRD-CM-06 evaluado en /recovery/confirm y en el POST"
      x-pending: ["DEC-BR-003 / EXT-A / LD-01"]
      parameters: [{$ref: '#/components/parameters/RedemptionToken'}]
      responses:
        '303': {$ref: '#/components/responses/RecoveryRedeemSeeOther'}
  # ---------------------------------------------------------------------------
  # tenant-context (EN0, EN1, CX2). TN*, SP*, CX1 sin HTTP: ver x-not-exposed.
  # ---------------------------------------------------------------------------
  /staff/enrollments:
    post:
      operationId: openEnrollment
      x-api-id: API-CNS-105
      tags: [staff]
      summary: EN0 — abrir Enrollment (null → ACTIVE)
      x-governed-by: ["tenant-context.spec EN0 (guardsBySource)", "DEC-BR-014 §1", "DEC-BR-016 §4", "ADR-006 §2", "SEC-CNS-012 re-verificación rev. 4 N2-01, N2-06; rev. 4b N3-01"]
      x-state-transition: {machine: Enrollment, id: EN0, from: null, to: ACTIVE}
      x-route-class: STAFF_ADMIN
      x-eligibility: "no evalúa la fórmula de elegibilidad (AUDIT-H01-rev3 N-13); membership TENANT vigente"
      x-actor:
        source: STAFF
        bySource:
          STAFF: {actorType: HUMAN, actorRole: INVITER, note: "TENANT_ADMIN en la consola STAFF (DEC-BR-016 §4)"}
          FIXTURE: {actorType: FIXTURE, note: "seed sintético solo LOCAL/CI (R14-F; GRD-CM-14); sin superficie HTTP (x-not-exposed)"}
        note: "Esta operación es siempre la fuente STAFF (GRD-CM-15): una request con actorType FIXTURE o marca de seed se evalúa como STAFF o se rechaza con ERR-CM-10; nunca registra FIXTURE (TEST-CNS-446)."
      x-guards: [GRD-CM-01, GRD-CM-02, GRD-CM-07, GRD-CM-10, GRD-CM-13, GRD-TC-03]
      x-guards-by-source:
        common: [GRD-CM-07, GRD-CM-13, GRD-TC-03]
        STAFF: [GRD-CM-01, GRD-CM-02, GRD-CM-10]
        FIXTURE: [GRD-CM-14, GRD-CM-15] # sin superficie HTTP
      x-idempotency: "(tenant_id, subject_ref, participation_ref)"
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IdempotencyKeyOptional'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/api-payloads.schema.json#/$defs/OpenEnrollmentRequest'}
      responses:
        '201':
          description: Enrollment ACTIVE.
          content:
            application/json:
              schema: {$ref: '../schemas/api-payloads.schema.json#/$defs/EnrollmentOpened'}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/UniformNotFound'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /staff/enrollments/{enrollmentRef}/close:
    post:
      operationId: closeEnrollment
      x-api-id: API-CNS-106
      tags: [staff]
      summary: EN1 — cerrar Enrollment (ACTIVE → CLOSED; cancela invitaciones no terminales en la misma tx, I9 ENROLLMENT_CLOSED)
      description: Ningún motivo es retiro de consentimiento; sin consent.revoked ni transición de ConsentDecision (INV-7, INV-CD-06).
      x-governed-by: ["tenant-context.spec EN1 (guardsBySource)", "SM-CNS-001 §6", "DEC-BR-016 §7", "DR2 D1", "INV-7", "INV-CD-06", "CARLOS r3 R14-E (Q-18 opción A)", "SEC-CNS-012 re-verificación rev. 4 N2-01, N2-05, N2-06; rev. 4b N3-01", "DEC-BR-018 R14-E, OPEN-TC-07 (A-09: cascada Q-18 con SAVEPOINT y job idempotente)"]
